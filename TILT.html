<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TILT</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0b1020">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; transition: background-color 0.3s; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; }
        
        /* ---- dock: the contextual shelf and the tool bar, docked to the
               bottom on every screen. The shelf overlays the canvas (never
               shrinks it) so the model stays full-bleed behind the glass. */
        #dock {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
            display: flex; flex-direction: column; align-items: stretch;
            pointer-events: none;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #shelf {
            pointer-events: auto;
            width: 100%; max-width: 480px; margin: 0 auto;
            display: flex; flex-direction: column; overflow: hidden;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(15,23,42,0.10); border-bottom: 0;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -12px 32px rgba(0,0,0,0.18);
            transform: translateY(0);
            transition: transform 0.28s ease;
        }
        .dark #shelf {
            background: rgba(24,24,27,0.85);
            border-color: rgba(255,255,255,0.12);
            box-shadow: 0 -12px 32px rgba(0,0,0,0.5);
        }
        #shelf.closed { transform: translateY(110%); }
        /* grab handle, the way every sheet on a phone has one */
        #shelf::before {
            content: ''; flex: none;
            width: 42px; height: 4px; border-radius: 999px;
            background: rgba(100,116,139,0.5);
            margin: 7px auto 0;
        }
        #shelf-head {
            flex: none;
            display: flex; align-items: center; gap: 0.25rem;
            padding: 0.2rem 0.4rem 0.25rem 0.85rem;
        }
        #shelf-head > div { flex: 1 1 auto; min-width: 0; }
        #model-name {
            margin: 0; font-size: 14px; font-weight: 700; line-height: 1.2;
            color: #0284c7; letter-spacing: 0.02em;
        }
        .dark #model-name { color: #38bdf8; }
        #model-sub {
            margin: 0; font-size: 9.5px; text-transform: uppercase;
            letter-spacing: 0.14em; color: #64748b; line-height: 1.3;
        }
        .dark #model-sub { color: #a1a1aa; }
        #shelf-body {
            padding: 0.35rem 0.75rem 0.85rem;
            max-height: min(46vh, 430px);
            overflow-y: auto; overflow-x: hidden;
            overscroll-behavior: contain; scrollbar-width: thin;
        }
        #toolbar {
            pointer-events: auto;
            flex: none;
            display: flex; gap: 0.3rem; align-items: stretch;
            width: 100%; max-width: 480px; margin: 0 auto;
            padding: 0.35rem 0.45rem;
            overflow-x: auto; scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(15,23,42,0.08);
        }
        .dark #toolbar {
            background: rgba(24,24,27,0.92);
            border-top-color: rgba(255,255,255,0.10);
        }

        /* ---- project bar: back, name, save status, overflow menu ---- */
        #topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 30;
            display: flex; align-items: center; gap: 0.15rem;
            padding: 0.15rem 0.35rem;
            padding-top: calc(0.15rem + env(safe-area-inset-top));
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(15,23,42,0.10);
        }
        .dark #topbar {
            background: rgba(24,24,27,0.8);
            border-bottom-color: rgba(255,255,255,0.10);
        }
        .tb-btn {
            display: flex; align-items: center; justify-content: center;
            min-width: 44px; min-height: 44px; padding: 0 0.6rem;
            border: 0; border-radius: 10px; background: transparent;
            color: #0369a1; cursor: pointer;
        }
        .dark .tb-btn { color: #38bdf8; }
        .tb-btn:active { background: rgba(2,132,199,0.14); }
        #project-title {
            flex: 1 1 auto; min-width: 0; min-height: 44px;
            display: flex; flex-direction: column; align-items: flex-start;
            justify-content: center; gap: 1px;
            padding: 0 0.35rem; border: 0; background: transparent;
            text-align: left; cursor: pointer; font: inherit;
        }
        #project-name {
            max-width: 100%; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; font-size: 13px; font-weight: 700; color: #0f172a;
        }
        .dark #project-name { color: #f4f4f5; }
        #save-status {
            font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
            color: #64748b;
        }
        #save-status[data-state="saving"] { color: #0284c7; }
        #save-status[data-state="offline"] { color: #dc2626; }
        #save-status[data-state="note"] { color: #059669; }
        .dark #save-status { color: #a1a1aa; }

        /* Fixed to the viewport, not to the bar: editor.js pins `top` to the
           measured bottom of the bar each time it opens, and this is the
           fallback for that (bar = 44px buttons + 2x0.15rem padding + 1px
           border + notch inset). */
        #overflow {
            position: fixed; top: calc(49.8px + env(safe-area-inset-top) + 4px);
            right: 0.45rem; z-index: 31;
            min-width: 196px; padding: 0.3rem; border-radius: 12px;
            background: #fff; border: 1px solid rgba(15,23,42,0.12);
            box-shadow: 0 14px 34px rgba(0,0,0,0.24);
        }
        .dark #overflow { background: #18181b; border-color: rgba(255,255,255,0.14); }
        #overflow { max-height: calc(100vh - 72px - env(safe-area-inset-top)); overflow-y: auto; }
        /* Red badge on the ⋮ button while the self-check has failures - the
           diagnostic itself lives inside the menu (see .menu-diag), so the
           canvas stays clear. */
        #btn-overflow { position: relative; }
        #err-badge {
            position: absolute; top: 5px; right: 5px;
            min-width: 16px; height: 16px; padding: 0 2px 0 4px;
            border-radius: 999px; background: #dc2626; color: #fff;
            font: 700 10px/16px system-ui, sans-serif; text-align: center;
            box-shadow: 0 0 0 2px #fff;
            pointer-events: none;
            display: inline-flex; align-items: center; gap: 1px;
        }
        #err-badge[hidden] { display: none; }
        .dark #err-badge { box-shadow: 0 0 0 2px #18181b; }
        /* The x is the only tappable part; the rest of the pill still
           passes clicks through to the menu button underneath. */
        #err-dismiss {
            pointer-events: auto;
            cursor: pointer;
            padding: 0 4px;
            margin-right: -1px;
            font: 700 12px/16px system-ui, sans-serif;
            opacity: 0.85;
        }
        #err-dismiss:hover, #err-dismiss:focus-visible { opacity: 1; }
        .menu-diag {
            margin: 0.3rem 0.4rem 0.4rem; padding: 0.45rem 0.55rem;
            max-height: 42vh; overflow-y: auto; border-radius: 8px;
            background: rgba(127,29,29,0.94); color: #fff;
            font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            white-space: pre-wrap; word-break: break-word;
        }
        .menu-item {
            display: block; width: 100%; min-height: 42px; padding: 0.55rem 0.7rem;
            border: 0; border-radius: 8px; background: transparent; text-align: left;
            font: inherit; font-size: 13px; color: #0f172a; cursor: pointer;
        }
        .dark .menu-item { color: #e4e4e7; }
        .menu-item:active { background: rgba(2,132,199,0.16); }
        .menu-item.is-danger { color: #dc2626; }
        .dark .menu-item.is-danger { color: #f87171; }
        .menu-sep { height: 1px; margin: 0.3rem 0.4rem; background: rgba(148,163,184,0.4); }

        #sheet {
            position: fixed; inset: 0; z-index: 40;
            display: flex; align-items: center; justify-content: center;
            padding: 1.25rem; background: rgba(15,23,42,0.5);
        }
        #sheet[hidden] { display: none; }
        .sheet-card {
            width: min(340px, 100%); padding: 1.1rem; border-radius: 14px;
            background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        .dark .sheet-card { background: #18181b; }
        .sheet-card h2 {
            margin: 0 0 0.75rem; font-size: 13px; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase; color: #0f172a;
        }
        .dark .sheet-card h2 { color: #f4f4f5; }
        #sheet-input {
            width: 100%; box-sizing: border-box; padding: 0.65rem 0.7rem;
            border: 1px solid #cbd5e1; border-radius: 9px; background: transparent;
            font: inherit; font-size: 15px; color: #0f172a;
        }
        #sheet-input:focus { outline: 2px solid #0284c7; outline-offset: 1px; border-color: transparent; }
        .dark #sheet-input { border-color: #3f3f46; color: #f4f4f5; }
        .sheet-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
        .sheet-actions .btn {
            min-height: 42px; padding: 0 1rem; border-radius: 9px;
            border: 1px solid #cbd5e1; background: transparent; font: inherit;
            font-size: 14px; color: #0f172a; cursor: pointer;
        }
        .dark .sheet-actions .btn { border-color: #3f3f46; color: #e4e4e7; }
        .sheet-actions .btn.primary { background: #0284c7; border-color: #0284c7; color: #fff; }
        .sheet-actions .btn.primary:active { background: #0369a1; }

        /* ---- the Objects tray: CapCut-style bottom sheet over the stage,
               a category tab bar above a grid of add-cards. ---- */
        #objpick {
            position: fixed; inset: 0; z-index: 45;
            display: flex; align-items: flex-end; justify-content: center;
        }
        #objpick[hidden] { display: none; }
        #objpick .objpick-scrim { position: absolute; inset: 0; background: rgba(15,23,42,0.5); }
        .dark #objpick .objpick-scrim { background: rgba(0,0,0,0.6); }
        #objpick .objpick-sheet {
            position: relative; display: flex; flex-direction: column;
            width: min(720px, 100vw); max-height: min(74vh, 660px);
            border-radius: 18px 18px 0 0; background: #fff;
            box-shadow: 0 -12px 40px rgba(0,0,0,0.35);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .dark #objpick .objpick-sheet { background: #18181b; }
        #objpick .objpick-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.9rem 1rem 0.35rem;
        }
        #objpick .objpick-head h2 {
            margin: 0; font-size: 13px; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase; color: #0f172a;
        }
        .dark #objpick .objpick-head h2 { color: #f4f4f5; }
        #objpick .objpick-close {
            min-width: 44px; min-height: 44px; border: 0; background: transparent;
            font-size: 22px; line-height: 1; color: #64748b; cursor: pointer;
        }
        #objpick .objpick-close:hover { color: #0f172a; }
        .dark #objpick .objpick-close { color: #a1a1aa; }
        .dark #objpick .objpick-close:hover { color: #f4f4f5; }
        #objpick .objpick-tabs {
            display: flex; gap: 6px; padding: 0.15rem 1rem 0.6rem;
            overflow-x: auto; scrollbar-width: none;
        }
        #objpick .objpick-tabs::-webkit-scrollbar { display: none; }
        #objpick .objtab {
            flex: none; min-height: 34px; padding: 0 12px; border-radius: 999px;
            border: 1px solid #cbd5e1; background: transparent;
            font: 600 12px/1 system-ui, sans-serif; color: #475569; cursor: pointer;
        }
        #objpick .objtab.is-on { background: #0284c7; border-color: #0284c7; color: #fff; }
        .dark #objpick .objtab { border-color: #3f3f46; color: #a1a1aa; }
        .dark #objpick .objtab.is-on { background: #0284c7; border-color: #0284c7; color: #fff; }
        #objpick .objpick-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px; padding: 0 1rem 1rem; overflow-y: auto; overscroll-behavior: contain;
        }
        #objpick .objpick-empty { grid-column: 1 / -1; margin: 0.5rem 0; font-size: 13px; color: #64748b; }
        #objpick .objcard {
            position: relative; display: flex; flex-direction: column; gap: 2px;
            padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0;
            background: #f8fafc; text-align: left; font: inherit; cursor: pointer;
        }
        #objpick .objcard.is-on { border-color: #0284c7; box-shadow: inset 0 0 0 1px #0284c7; }
        .dark #objpick .objcard { border-color: #27272a; background: #232327; }
        .dark #objpick .objcard.is-on { border-color: #0284c7; }
        #objpick .objcard-tile {
            display: flex; align-items: center; justify-content: center;
            width: 100%; aspect-ratio: 4 / 3; border-radius: 8px; margin-bottom: 4px;
            background: linear-gradient(160deg, #e0f2fe, #f8fafc 60%);
            color: #0284c7; transition: transform 0.15s ease;
        }
        #objpick .objcard-tile svg { width: 34px; height: 34px; }
        .dark #objpick .objcard-tile {
            background: linear-gradient(160deg, #0c4a6e, #18181b 70%); color: #7dd3fc;
        }
        #objpick .objcard-tile.is-added { transform: scale(1.08); }
        #objpick .objcard-name { font: 600 12px/1.25 system-ui, sans-serif; color: #0f172a; }
        .dark #objpick .objcard-name { color: #f4f4f5; }
        #objpick .objcard-sub { font: 11px/1.3 system-ui, sans-serif; color: #64748b; }
        .dark #objpick .objcard-sub { color: #a1a1aa; }
        #objpick .objcard-badge {
            position: absolute; top: 6px; right: 6px; padding: 2px 7px;
            border-radius: 999px; background: #0284c7; color: #fff;
            font: 700 10px/1.5 system-ui, sans-serif;
        }
        #objpick .objcard:not(.is-on) .objcard-badge { background: #cbd5e1; color: #334155; }
        .dark #objpick .objcard:not(.is-on) .objcard-badge { background: #3f3f46; color: #d4d4d8; }
        #objpick .objpick-stage {
            border-top: 1px dashed #cbd5e1; padding: 0.6rem 1rem 0.9rem;
            overflow-y: auto; max-height: 34%;
        }
        .dark #objpick .objpick-stage { border-top-color: #3f3f46; }
        #objpick .objpick-stage-title {
            font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.08em;
            text-transform: uppercase; color: #64748b; margin-bottom: 6px;
        }
        #objpick .objpick-stage-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; padding: 6px 8px; border-radius: 8px; background: #f8fafc;
            font: 600 12px/1.3 system-ui, sans-serif; color: #0f172a; margin-bottom: 4px;
        }
        .dark #objpick .objpick-stage-row { background: #232327; color: #f4f4f5; }
        #objpick .objpick-stage-rm {
            min-height: 30px; padding: 0 10px; border-radius: 999px;
            border: 1px solid #cbd5e1; background: transparent;
            font: 600 11px/1 system-ui, sans-serif; color: #475569; cursor: pointer;
        }
        .dark #objpick .objpick-stage-rm { border-color: #3f3f46; color: #a1a1aa; }
        @media (prefers-reduced-motion: reduce) {
            #objpick .objcard-tile { transition: none; }
        }

        /* ---- phones: the shelf is already the bottom dock; it just gets
               a little more room and tighter rhythm on small screens. ---- */
        @media (max-width: 640px) {
            #shelf-body {
                max-height: min(52vh, 430px);
                padding: 0.3rem 0.65rem 0.75rem;
            }
            #shelf-body .mb-1 { margin-bottom: 0.15rem; }
            #shelf-body .mb-2 { margin-bottom: 0.35rem; }
            #shelf-body .mb-3 { margin-bottom: 0.5rem; }
            #shelf-body .mt-1 { margin-top: 0.25rem; }
            #shelf-body .pt-1 { padding-top: 0.25rem; }
            #shelf-body .pt-3 { padding-top: 0.5rem; }
            #shelf-body .gap-2 { gap: 0.45rem; }
            #shelf-body .gap-4 { gap: 0.65rem; }
            #shelf-body .text-xs { font-size: 11px; }
            #shelf-body .text-sm { font-size: 12.5px; }
            #shelf-body .flex-1 { min-height: 38px; }
            #shelf-body select { min-height: 38px; }
            #shelf-body .ml-auto { min-height: 36px; padding: 0 0.7rem; }
            #shelf-body input[type=range] { margin: 9px 0; }
        }

        /* ---- fingers: everything tappable gets a 44px target ---- */
        @media (pointer: coarse) {
            #btn-shelf-close { min-width: 44px; min-height: 44px; }
            .custom-checkbox { width: 1.5rem; height: 1.5rem; }
            input[type=range] { margin: 14px 0; }
            input[type=range]::-webkit-slider-thumb {
                height: 22px; width: 22px; margin-top: -8px;
            }
            input[type=range]::-moz-range-thumb { height: 22px; width: 22px; border: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .ui-panel, .panel-body, #boot, #sheet, .sheet-card {
                transition: none !important;
            }
        }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 8px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; height: 6px; cursor: pointer; border-radius: 3px; 
            background: #cbd5e1; 
        }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #52525b; }
        
        input[type=range]::-webkit-slider-thumb { 
            height: 16px; width: 16px; border-radius: 50%; background: #0284c7; 
            cursor: pointer; -webkit-appearance: none; margin-top: -5px; 
            box-shadow: 0 0 6px rgba(2,132,199,0.5);
            transition: transform 0.1s;
        }
        .dark input[type=range]::-webkit-slider-thumb { background: #38bdf8; }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #0ea5e9; }

        #boot {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            background: #f3f4f6; color: #4b5563;
            font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
            transition: opacity 0.4s ease;
        }
        .dark #boot { background: #18181b; color: #a1a1aa; }
        #boot.hidden { opacity: 0; pointer-events: none; }
        .boot-spinner {
            width: 26px; height: 26px; border-radius: 50%;
            border: 3px solid #cbd5e1; border-top-color: #0284c7;
            animation: bootspin 0.8s linear infinite;
        }
        .dark .boot-spinner { border-color: #3f3f46; border-top-color: #38bdf8; }
        #boot.failed .boot-spinner { animation: none; border-top-color: #ef4444; }
        @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script>
        // External ES modules cannot be loaded from file:// or content:// (no
        // CORS), so when the page is opened directly from a file manager, hand
        // off to the single-file build instead of failing on js/app.js.
        (function () {
            if (/^https?:$/.test(location.protocol)) return;
            if (/TILT\.standalone\.html$/.test(location.pathname)) return;
            try {
                location.replace(new URL('TILT.standalone.html', location.href).href);
            } catch (e) { /* the boot overlay reports the module failure */ }
        })();
    </script>
    <script>
        // Live reload: tools/serve.mjs pushes an SSE event whenever js/, models/
        // or this shell change. Only runs over http; from a file this returns
        // immediately and the page just needs a manual refresh.
        (function () {
            if (!/^https?:$/.test(location.protocol)) return;
            try {
                var es = new EventSource('/__events');
                es.onmessage = function (e) {
                    if (e.data === 'reload') location.reload();
                };
                es.onerror = function () { if (es.readyState === 2) es.close(); };
            } catch (e) { /* served by something else - no reload */ }
        })();
    </script>
</head>
<body class="bg-gray-100 transition-colors duration-300">

    <div id="boot">
        <div class="boot-spinner"></div>
        <p id="boot-msg">Loading viewer</p>
    </div>

    <header id="topbar">
        <button type="button" class="tb-btn" id="btn-back" aria-label="Back to projects">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <button type="button" id="project-title" aria-label="Rename project">
            <span id="project-name">Untitled project</span>
            <span id="save-status" data-state="saved">Saved</span>
        </button>
        <span id="app-version" class="text-[9.5px] uppercase tracking-widest text-gray-400 dark:text-zinc-500 select-none pr-1" title="Build version"></span>
        <button type="button" class="tb-btn" id="btn-overflow" aria-label="Project menu" aria-haspopup="menu" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
        </button>
    </header>
    <!-- The menu is deliberately NOT a child of #topbar: that bar carries a
         backdrop-filter, which per spec makes it a containing block for its
         positioned descendants, and the popup then resolves against the bar
         instead of the viewport. Living on <body> it can only ever be fixed
         to the screen. -->
    <div id="overflow" role="menu" hidden></div>
    <script>
        (function () {
            var errs = [];
            window.__tiltErr = errs;
            window.__tiltStage = 'html';
            function note(msg) {
                if (benign(String(msg))) return;
                if (msg && errs.length < 8 && errs.indexOf(String(msg)) < 0) errs.push(String(msg));
            }
            // Fired on every window resize by the sheet observer; not ours.
            function benign(msg) {
                return /ResizeObserver loop/.test(msg);
            }

            // The panel callbacks are wrapped in guard(), which reports to the
            // console rather than to the page - so a swallowed exception would
            // otherwise look exactly like "the button does nothing".
            (function () {
                var orig = console.error;
                console.error = function () {
                    try {
                        note('[console] ' + Array.prototype.map.call(arguments, function (a) {
                            return a && a.message ? a.message : String(a);
                        }).join(' '));
                        show();
                    } catch (e) { /* never break the page */ }
                    return orig.apply(console, arguments);
                };
            })();
            function fail(msg) {
                note(msg);
                if (window.__bootFail) clearTimeout(window.__bootFail);
                var b = document.getElementById('boot');
                var m = document.getElementById('boot-msg');
                if (m) m.textContent = msg;
                if (b) b.classList.add('failed');
                show();
            }
            window.__tiltFail = fail;
            window.__bootFail = setTimeout(function () {
                fail('Could not load Three.js - check your connection');
            }, 12000);

            // Local modules only load over http:// - catch it instead of
            // leaving the spinner up forever.
            window.addEventListener('error', function (e) {
                var src = (e.target && (e.target.src || e.target.href)) || '';
                if (e.target && e.target !== window && (src || e.message)) {
                    fail(e.message || 'Failed to load ' + src);
                } else if (e.message) {
                    note(e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno);
                    show();
                }
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                fail((r && r.message) || 'Failed to start the viewer');
            });

            // ---------------------------------------------------- self-check
            function describe(el) {
                if (!el) return 'nothing';
                var s = el.tagName.toLowerCase();
                if (el.id) return s + '#' + el.id;
                if (typeof el.className === 'string' && el.className) {
                    return s + '.' + el.className.split(/\s+/)[0];
                }
                return s;
            }
            function hitTest(id) {
                var el = document.getElementById(id);
                if (!el) return id + '=missing';
                var r = el.getBoundingClientRect();
                if (!r.width || !r.height) return id + '=no-size';
                if (typeof document.elementFromPoint !== 'function') return id + '=noprobe';
                var hit = null;
                try {
                    hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
                } catch (e) { return id + '=probe failed'; }
                if (hit === el || el.contains(hit)) return id + '=ok';
                return id + '=covered by ' + describe(hit);
            }
            function probe() {
                try { return probeInner(); }
                catch (e) { return { bad: ['self-check threw: ' + (e && e.message)], lines: [] }; }
            }
            var clicked = false;
            var menuProbe = '';
            function probeInner() {
                var bad = [];
                var lines = [];
                lines.push('stage=' + window.__tiltStage
                    + ' O2=' + (window.O2 ? 'yes' : 'NO')
                    + ' wired=' + (window.__tiltWired === true ? 'yes'
                        : (window.__tiltWired || 'NO')));
                if (!window.O2) bad.push('app.js did not finish (stage=' + window.__tiltStage + ')');
                if (window.__tiltWired && window.__tiltWired !== true) {
                    bad.push('top bar controls missing: ' + window.__tiltWired);
                } else if (!window.__tiltWired) {
                    bad.push('the top bar was never wired');
                }

                var boot = document.getElementById('boot');
                lines.push('boot=' + (boot ? (boot.className || 'plain') : 'gone'));
                if (window.O2 && boot && !boot.classList.contains('hidden')) {
                    bad.push('the boot overlay still covers the screen');
                }

                var b1 = hitTest('btn-back');
                var b2 = hitTest('btn-overflow');
                lines.push(b1 + ' ' + b2);
                if (!/btn-back=ok$/.test(b1)) bad.push(b1);
                if (!/btn-overflow=ok$/.test(b2)) bad.push(b2);

                var o2 = window.O2;
                if (o2) {
                    var saved = 'x';
                    try { saved = Object.keys(o2.savedPresets).length; } catch (e) { saved = 'x'; }
                    lines.push('mode=' + o2.mode + ' target=' + o2.projectId
                        + ' dirty=' + o2.dirty + ' savedPresets=' + saved);
                    try {
                        var d = o2.buildDoc();
                        lines.push('buildDoc=ok mode=' + d.mode + ' mounted=[' + d.mounted.join(',')
                            + '] presets=' + Object.keys(d.presets || {}).length);
                    } catch (e) {
                        lines.push('buildDoc THREW: ' + (e && e.message));
                        bad.push('buildDoc threw: ' + (e && e.message));
                    }
                }

                var save = window.__tiltSave;
                lines.push('save=' + (save
                    ? (save.ok ? 'OK' : 'FAIL http' + save.status) + ' -> '
                        + (save.target || 'shared session') + ' '
                        + Math.round((Date.now() - save.at) / 1000) + 's ago'
                    : 'not yet'));
                if (save && !save.ok) {
                    bad.push('the save failed: http ' + save.status
                        + ' -> ' + (save.target || 'shared session'));
                }

                // Only once the bar is known to be wired, otherwise a probe
                // that lands before app.js finishes would record "no listener"
                // and never ask again.
                if (!clicked && window.__tiltWired) {
                    clicked = true;
                    var more = document.getElementById('btn-overflow');
                    var menu = document.getElementById('overflow');
                    if (more && menu && menu.hidden) {
                        more.click();
                        menuProbe = !menu.hidden ? 'opens' : 'NO LISTENER';
                        if (menuProbe === 'opens') more.click();
                    }
                }
                if (menuProbe) {
                    lines.push('click->menu=' + menuProbe);
                    if (menuProbe !== 'opens') bad.push('the ⋮ button has no listener');
                }

                if (errs.length) {
                    lines.push('err: ' + errs.slice(0, 3).join(' | '));
                    bad.push(errs.slice(0, 3).join(' | '));
                }
                return { bad: bad, lines: lines };
            }
            // The fault report lives behind the ⋮ menu now: no red box sits
            // on the canvas, the button wears a red issue-count badge while
            // anything fails, and editor.js renders the text inside the menu
            // from window.__tiltDiagText(). This still refreshes on every
            // probe so the badge cannot go stale.
            var lastReport = '';
            var lastN = 0;
            // Failures the user has acknowledged with the badge's x. The
            // badge re-probes every 2s, so without this it would spring
            // right back; a NEW failure (count rises) shows it again.
            var dismissedAt = 0;
            function dismissBadge(more) {
                dismissedAt = lastN;
                var b = document.getElementById('err-badge');
                if (b) b.hidden = true;
                more.classList.remove('has-errors');
                more.setAttribute('aria-label', 'Project menu');
            }
            function badge(n) {
                var more = document.getElementById('btn-overflow');
                if (!more) return;
                lastN = n;
                var b = document.getElementById('err-badge');
                if (n > 0 && n > dismissedAt) {
                    if (!b) {
                        b = document.createElement('span');
                        b.id = 'err-badge';
                        var cnt = document.createElement('span');
                        cnt.id = 'err-count';
                        b.appendChild(cnt);
                        var x = document.createElement('span');
                        x.id = 'err-dismiss';
                        x.setAttribute('role', 'button');
                        x.setAttribute('tabindex', '0');
                        x.setAttribute('aria-label', 'Dismiss diagnostics badge');
                        x.textContent = '×';
                        x.addEventListener('click', function (e) {
                            // Inside the menu button: keep the click from
                            // toggling the menu open as a side effect.
                            e.stopPropagation();
                            dismissBadge(more);
                        });
                        x.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter' || e.key === ' '
                                    || e.key === 'Spacebar') {
                                e.preventDefault();
                                e.stopPropagation();
                                dismissBadge(more);
                            }
                        });
                        b.appendChild(x);
                        more.appendChild(b);
                    }
                    b.hidden = false;
                    document.getElementById('err-count').textContent =
                        n > 9 ? '9+' : String(n);
                    more.classList.add('has-errors');
                    more.setAttribute('aria-label',
                        'Project menu, ' + n + ' issue' + (n === 1 ? '' : 's')
                        + ', tap the x to dismiss');
                } else {
                    if (b) b.hidden = true;
                    more.classList.remove('has-errors');
                    more.setAttribute('aria-label', 'Project menu');
                }
            }
            function show() {
                var r = probe();
                window.__tiltDiagBad = r.bad.length;
                badge(r.bad.length);
                lastReport = r.bad.length
                    ? 'TILT self-check\n'
                        + r.bad.map(function (s) { return '! ' + s; }).join('\n')
                        + '\n\n' + r.lines.join('\n')
                    : 'TILT self-check: all clear\n\n' + r.lines.join('\n');
            }
            window.__tiltDiag = show;
            window.__tiltDiagText = function () {
                return lastReport || 'TILT self-check: not run yet';
            };
            setTimeout(show, 8000);
            setInterval(show, 2000);
        })();

    </script>

    <div id="dock">
        <div id="shelf">
            <div id="shelf-head">
                <div>
                    <h1 id="model-name">Model</h1>
                    <p id="model-sub">&nbsp;</p>
                </div>
                <button type="button" class="tb-btn" id="btn-shelf-close" aria-label="Hide tools">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
                </button>
            </div>
            <div id="shelf-body" class="text-gray-800 dark:text-zinc-200"></div>
        </div>
        <div id="toolbar" aria-label="Tools"></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // PWA: offline shell + install prompt. Only over http(s) - the
        // standalone file and file:// use must keep working from disk.
        (function () {
            if (!/^https?:$/.test(location.protocol)
                || !('serviceWorker' in navigator)) return;
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function (err) {
                    console.warn('[pwa] service worker:', err);
                });
            });
            var installBtn = null, deferred = null;
            function hide() {
                if (installBtn) { installBtn.remove(); installBtn = null; }
            }
            window.addEventListener('beforeinstallprompt', function (e) {
                if (sessionStorage.getItem('tilt-install-dismissed')) return;
                e.preventDefault();
                deferred = e;
                if (installBtn) return;
                installBtn = document.createElement('button');
                installBtn.type = 'button';
                installBtn.textContent = 'Install TILT';
                installBtn.setAttribute('aria-label', 'Install TILT on this device');
                installBtn.style.cssText = 'position:fixed;right:1rem;bottom:1rem;'
                    + 'z-index:40;padding:0.55rem 1rem;border-radius:9999px;'
                    + 'font-size:13px;font-weight:600;color:#0b1020;background:#d4af37;'
                    + 'border:none;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.35);';
                installBtn.addEventListener('click', function () {
                    var d = deferred; deferred = null; hide();
                    if (d && d.prompt) d.prompt();
                });
                document.body.appendChild(installBtn);
            });
            window.addEventListener('appinstalled', hide);
        })();
    </script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
