<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TILT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; transition: background-color 0.3s; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; }
        
        .ui-panel {
            position: absolute; top: calc(3.4rem + env(safe-area-inset-top)); left: 1rem; z-index: 10;
            width: 320px; border-radius: 0.75rem;
            display: flex; flex-direction: column; overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: calc(100vw - 2rem);
        }
        .dark .ui-panel { box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .panel-body { 
            padding: 1.25rem; transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out; 
            max-height: min(600px, calc(100vh - 11rem)); overflow-y: auto; overflow-x: hidden;
            overscroll-behavior: contain; scrollbar-width: thin;
        }
        .panel-body.collapsed { 
            max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; border: none;
            overflow: hidden;
        }

        /* ---- project bar: back, name, save status, overflow menu ---- */
        #topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 30;
            display: flex; align-items: center; gap: 0.15rem;
            padding: 0.15rem 0.35rem;
            padding-top: calc(0.15rem + env(safe-area-inset-top));
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(15,23,42,0.10);
        }
        .dark #topbar {
            background: rgba(24,24,27,0.8);
            border-bottom-color: rgba(255,255,255,0.10);
        }
        .tb-btn {
            display: flex; align-items: center; justify-content: center;
            min-width: 44px; min-height: 44px; padding: 0 0.6rem;
            border: 0; border-radius: 10px; background: transparent;
            color: #0369a1; cursor: pointer;
        }
        .dark .tb-btn { color: #38bdf8; }
        .tb-btn:active { background: rgba(2,132,199,0.14); }
        #project-title {
            flex: 1 1 auto; min-width: 0; min-height: 44px;
            display: flex; flex-direction: column; align-items: flex-start;
            justify-content: center; gap: 1px;
            padding: 0 0.35rem; border: 0; background: transparent;
            text-align: left; cursor: pointer; font: inherit;
        }
        #project-name {
            max-width: 100%; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; font-size: 13px; font-weight: 700; color: #0f172a;
        }
        .dark #project-name { color: #f4f4f5; }
        #save-status {
            font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
            color: #64748b;
        }
        #save-status[data-state="saving"] { color: #0284c7; }
        #save-status[data-state="offline"] { color: #dc2626; }
        #save-status[data-state="note"] { color: #059669; }
        .dark #save-status { color: #a1a1aa; }

        /* Fixed to the viewport, not to the bar: editor.js pins `top` to the
           measured bottom of the bar each time it opens, and this is the
           fallback for that (bar = 44px buttons + 2x0.15rem padding + 1px
           border + notch inset). */
        #overflow {
            position: fixed; top: calc(49.8px + env(safe-area-inset-top) + 4px);
            right: 0.45rem; z-index: 31;
            min-width: 196px; padding: 0.3rem; border-radius: 12px;
            background: #fff; border: 1px solid rgba(15,23,42,0.12);
            box-shadow: 0 14px 34px rgba(0,0,0,0.24);
        }
        .dark #overflow { background: #18181b; border-color: rgba(255,255,255,0.14); }
        .menu-item {
            display: block; width: 100%; min-height: 42px; padding: 0.55rem 0.7rem;
            border: 0; border-radius: 8px; background: transparent; text-align: left;
            font: inherit; font-size: 13px; color: #0f172a; cursor: pointer;
        }
        .dark .menu-item { color: #e4e4e7; }
        .menu-item:active { background: rgba(2,132,199,0.16); }
        .menu-item.is-danger { color: #dc2626; }
        .dark .menu-item.is-danger { color: #f87171; }
        .menu-sep { height: 1px; margin: 0.3rem 0.4rem; background: rgba(148,163,184,0.4); }

        #sheet {
            position: fixed; inset: 0; z-index: 40;
            display: flex; align-items: center; justify-content: center;
            padding: 1.25rem; background: rgba(15,23,42,0.5);
        }
        #sheet[hidden] { display: none; }
        .sheet-card {
            width: min(340px, 100%); padding: 1.1rem; border-radius: 14px;
            background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        .dark .sheet-card { background: #18181b; }
        .sheet-card h2 {
            margin: 0 0 0.75rem; font-size: 13px; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase; color: #0f172a;
        }
        .dark .sheet-card h2 { color: #f4f4f5; }
        #sheet-input {
            width: 100%; box-sizing: border-box; padding: 0.65rem 0.7rem;
            border: 1px solid #cbd5e1; border-radius: 9px; background: transparent;
            font: inherit; font-size: 15px; color: #0f172a;
        }
        #sheet-input:focus { outline: 2px solid #0284c7; outline-offset: 1px; border-color: transparent; }
        .dark #sheet-input { border-color: #3f3f46; color: #f4f4f5; }
        .sheet-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
        .sheet-actions .btn {
            min-height: 42px; padding: 0 1rem; border-radius: 9px;
            border: 1px solid #cbd5e1; background: transparent; font: inherit;
            font-size: 14px; color: #0f172a; cursor: pointer;
        }
        .dark .sheet-actions .btn { border-color: #3f3f46; color: #e4e4e7; }
        .sheet-actions .btn.primary { background: #0284c7; border-color: #0284c7; color: #fff; }
        .sheet-actions .btn.primary:active { background: #0369a1; }

        /* ---- phones: the controls become a compact bottom sheet ----
           A 320px card pinned top-left is unusable on a 375px screen and it
           sits exactly where a thumb wants to be, so below 640px the same
           markup docks to the bottom. app.js measures it and shrinks the
           canvas to whatever is left, so opening the controls minifies the
           view instead of covering it. */
        @media (max-width: 640px) {
            .ui-panel {
                top: auto; bottom: 0; left: 0; right: 0;
                width: 100%; max-width: none;
                border-radius: 16px 16px 0 0;
                padding-bottom: env(safe-area-inset-bottom);
                box-shadow: 0 -12px 32px rgba(0,0,0,0.22);
            }
            .dark .ui-panel { box-shadow: 0 -12px 32px rgba(0,0,0,0.55); }

            /* grab handle, the way every sheet on a phone has one */
            .ui-panel::before {
                content: ''; flex: none;
                width: 42px; height: 4px; border-radius: 999px;
                background: rgba(100,116,139,0.5);
                margin: 7px auto 0;
            }

            /* compact header */
            .ui-panel > .flex { min-height: 44px; padding: 0.45rem 0.6rem; }
            .ui-panel > .flex h1 { font-size: 14px; }

            /* compact controls: tighter rhythm, shorter fields, same markup */
            .panel-body {
                padding: 0.65rem 0.75rem 0.85rem;
                max-height: min(48vh, calc(100vh - 8rem));
            }
            .panel-body .mb-1 { margin-bottom: 0.15rem; }
            .panel-body .mb-2 { margin-bottom: 0.35rem; }
            .panel-body .mb-3 { margin-bottom: 0.5rem; }
            .panel-body .mt-1 { margin-top: 0.25rem; }
            .panel-body .pt-1 { padding-top: 0.25rem; }
            .panel-body .pt-3 { padding-top: 0.5rem; }
            .panel-body .gap-2 { gap: 0.45rem; }
            .panel-body .gap-4 { gap: 0.65rem; }
            .panel-body .text-xs { font-size: 11px; }
            .panel-body .text-sm { font-size: 12.5px; }
            .panel-body .flex-1 { min-height: 38px; }
            .panel-body select { min-height: 38px; }
            .panel-body .ml-auto { min-height: 36px; padding: 0 0.7rem; }
            .panel-body input[type=range] { margin: 9px 0; }
            .panel-body.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; }
        }

        /* ---- fingers: everything tappable gets a 44px target ---- */
        @media (pointer: coarse) {
            .btn-minimize { min-width: 44px; min-height: 44px; }
            .custom-checkbox { width: 1.5rem; height: 1.5rem; }
            input[type=range] { margin: 14px 0; }
            input[type=range]::-webkit-slider-thumb {
                height: 22px; width: 22px; margin-top: -8px;
            }
            input[type=range]::-moz-range-thumb { height: 22px; width: 22px; border: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .ui-panel, .panel-body, #boot, #sheet, .sheet-card {
                transition: none !important;
            }
        }
        
        .btn-minimize {
            width: 28px; height: 28px; border-radius: 6px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 8px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; height: 6px; cursor: pointer; border-radius: 3px; 
            background: #cbd5e1; 
        }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #52525b; }
        
        input[type=range]::-webkit-slider-thumb { 
            height: 16px; width: 16px; border-radius: 50%; background: #0284c7; 
            cursor: pointer; -webkit-appearance: none; margin-top: -5px; 
            box-shadow: 0 0 6px rgba(2,132,199,0.5);
            transition: transform 0.1s;
        }
        .dark input[type=range]::-webkit-slider-thumb { background: #38bdf8; }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        
        .custom-checkbox { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #0ea5e9; }

        #boot {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
            background: #f3f4f6; color: #4b5563;
            font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
            transition: opacity 0.4s ease;
        }
        .dark #boot { background: #18181b; color: #a1a1aa; }
        #boot.hidden { opacity: 0; pointer-events: none; }
        .boot-spinner {
            width: 26px; height: 26px; border-radius: 50%;
            border: 3px solid #cbd5e1; border-top-color: #0284c7;
            animation: bootspin 0.8s linear infinite;
        }
        .dark .boot-spinner { border-color: #3f3f46; border-top-color: #38bdf8; }
        #boot.failed .boot-spinner { animation: none; border-top-color: #ef4444; }
        @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <script>
        // External ES modules cannot be loaded from file:// or content:// (no
        // CORS), so when the page is opened directly from a file manager, hand
        // off to the single-file build instead of failing on js/app.js.
        (function () {
            if (/^https?:$/.test(location.protocol)) return;
            if (/TILT\.standalone\.html$/.test(location.pathname)) return;
            try {
                location.replace(new URL('TILT.standalone.html', location.href).href);
            } catch (e) { /* the boot overlay reports the module failure */ }
        })();
    </script>
    <script>
        // Live reload: tools/serve.mjs pushes an SSE event whenever js/, models/
        // or this shell change. Only runs over http; from a file this returns
        // immediately and the page just needs a manual refresh.
        (function () {
            if (!/^https?:$/.test(location.protocol)) return;
            try {
                var es = new EventSource('/__events');
                es.onmessage = function (e) {
                    if (e.data === 'reload') location.reload();
                };
                es.onerror = function () { if (es.readyState === 2) es.close(); };
            } catch (e) { /* served by something else - no reload */ }
        })();
    </script>
</head>
<body class="bg-gray-100 transition-colors duration-300">

    <div id="boot">
        <div class="boot-spinner"></div>
        <p id="boot-msg">Loading viewer</p>
    </div>

    <header id="topbar">
        <button type="button" class="tb-btn" id="btn-back" aria-label="Back to projects">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <button type="button" id="project-title" aria-label="Rename project">
            <span id="project-name">Untitled project</span>
            <span id="save-status" data-state="saved">Saved</span>
        </button>
        <button type="button" class="tb-btn" id="btn-overflow" aria-label="Project menu" aria-haspopup="menu" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
        </button>
    </header>
    <!-- The menu is deliberately NOT a child of #topbar: that bar carries a
         backdrop-filter, which per spec makes it a containing block for its
         positioned descendants, and the popup then resolves against the bar
         instead of the viewport. Living on <body> it can only ever be fixed
         to the screen. -->
    <div id="overflow" role="menu" hidden></div>
    <script>
        (function () {
            function fail(msg) {
                if (window.__bootFail) clearTimeout(window.__bootFail);
                var b = document.getElementById('boot');
                var m = document.getElementById('boot-msg');
                if (m) m.textContent = msg;
                if (b) b.classList.add('failed');
            }
            window.__bootFail = setTimeout(function () {
                fail('Could not load Three.js - check your connection');
            }, 12000);

            // Local modules only load over http:// - catch it instead of
            // leaving the spinner up forever.
            window.addEventListener('error', function (e) {
                var src = (e.target && (e.target.src || e.target.href)) || '';
                if (e.target && e.target !== window && (src || e.message)) {
                    fail(e.message || 'Failed to load ' + src);
                }
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                fail((r && r.message) || 'Failed to start the viewer');
            });
        })();
    </script>

    <div class="ui-panel bg-white/30 dark:bg-zinc-900/30 backdrop-blur-md border border-gray-200 dark:border-zinc-700" id="ui-panel">
        <div class="flex justify-between items-center p-4 border-b border-gray-200 dark:border-zinc-700">
            <div>
                <h1 class="text-base font-bold text-sky-600 dark:text-sky-400 tracking-wide leading-tight" id="model-name">Model</h1>
                <p class="text-[10px] text-gray-500 dark:text-zinc-400 uppercase tracking-widest leading-tight" id="model-sub">&nbsp;</p>
            </div>
            <button class="btn-minimize bg-gray-100 hover:bg-gray-200 text-gray-600 dark:bg-zinc-800 dark:hover:bg-zinc-700 dark:text-zinc-300 border border-gray-300 dark:border-zinc-600" id="btn-minimize" aria-label="Toggle UI">
                <svg id="icon-collapse" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path></svg>
                <svg id="icon-expand" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
        </div>

        <div class="panel-body text-gray-800 dark:text-zinc-200" id="panel-body"></div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- js/project.js ----
// The project file is the panel's memory: which display mode was on, which
// presets were on stage, every control value for every preset that has been
// added, plus which project it belongs to and where the camera was left.
// Served builds keep a copy on disk as project.json and mirror it in
// localStorage; named projects themselves live in the SQLite database behind
// tools/store.mjs, which sanitises documents through these same helpers.

const PROJECT_FILE = 'project.json';
const STORAGE_KEY = 'o2tilt-project.v1';
const API = './api/projects';

// A project opened from the homepage carries ?p=<id>. That id decides where
// every save goes; without it the editor keeps working on the shared
// project.json session, which is what a direct file:// open uses.
function readTarget() {
    try {
        const id = new URLSearchParams(location.search).get('p');
        return id && /^[\w-]{1,64}$/.test(id) ? id : null;
    } catch {
        return null;
    }
}

let target = readTarget();
let notice = '';

function projectId() { return target; }

// 'missing' - the URL points at a project that has since been deleted, so the
// editor detached and is editing the local session instead.
// 'offline' - the project could not be reached; saves will keep failing.
function loadNotice() { return notice; }

function served() {
    return typeof location !== 'undefined' && /^https?:$/.test(location.protocol);
}


function hasLocal() {
    return typeof localStorage !== 'undefined';
}

function cleanName(name, fallback = '') {
    if (typeof name !== 'string') return fallback;
    const clean = name.replace(/\s+/g, ' ').trim().slice(0, 80);
    return clean || fallback;
}

// A camera position/target is only kept when it is three finite numbers.
function vec3(v) {
    if (!Array.isArray(v) || v.length !== 3) return null;
    return v.every(x => typeof x === 'number' && Number.isFinite(x)) ? v : null;
}

function cleanView(view) {
    if (!view || typeof view !== 'object' || Array.isArray(view)) return null;
    const out = {
        position: vec3(view.position),
        target: vec3(view.target),
        theme: view.theme === 'dark' || view.theme === 'light' ? view.theme : null
    };
    return out.position || out.target || out.theme ? out : null;
}

// Pure: turns whatever came back from disk into a known shape, or null if it
// is unusable. Never throws - a corrupt project just means "start fresh".
function parseProject(raw) {
    let data = raw;
    if (typeof raw === 'string') {
        try { data = JSON.parse(raw); } catch { return null; }
    }
    if (!data || typeof data !== 'object' || Array.isArray(data)) return null;

    const project = {
        version: 2,
        name: cleanName(data.name),
        mode: data.mode === 'overlay' ? 'overlay' : 'single',
        activeId: typeof data.activeId === 'string' ? data.activeId : null,
        view: cleanView(data.view),
        mounted: Array.isArray(data.mounted)
            ? data.mounted.filter(id => typeof id === 'string' && id)
            : [],
        overlayIds: Array.isArray(data.overlayIds)
            ? data.overlayIds.filter(id => typeof id === 'string' && id)
            : [],
        presets: {}
    };

    if (data.presets && typeof data.presets === 'object' && !Array.isArray(data.presets)) {
        for (const [id, values] of Object.entries(data.presets)) {
            if (!values || typeof values !== 'object' || Array.isArray(values)) continue;
            const clean = {};
            for (const [k, v] of Object.entries(values)) {
                if (typeof v === 'number' && Number.isFinite(v)) clean[k] = v;
                else if (typeof v === 'boolean') clean[k] = v;
            }
            if (Object.keys(clean).length) project.presets[id] = clean;
        }
    }
    return project;
}

// Pure: writes a saved value into a model's state, but only when the schema
// still has that key and the type still matches. A preset file edited by hand
// can never poison the model.
function applySaved(state, schema, saved) {
    if (!saved || !schema) return false;
    let changed = false;
    for (const [k, v] of Object.entries(saved)) {
        const p = schema[k];
        if (!p) continue;
        if (p.type === 'range') {
            if (typeof v !== 'number' || !Number.isFinite(v)) continue;
            const clamped = Math.min(p.max, Math.max(p.min, v));
            if (state[k] === clamped) continue;
            state[k] = clamped;
            changed = true;
        } else if (p.type === 'toggle') {
            if (typeof v !== 'boolean' || state[k] === v) continue;
            state[k] = v;
            changed = true;
        }
    }
    return changed;
}

function projectToJSON(project) {
    return JSON.stringify(project, null, 2);
}

function readLocal() {
    if (!hasLocal()) return null;
    try {
        return parseProject(localStorage.getItem(STORAGE_KEY));
    } catch {
        return null;
    }
}

// Named projects live behind the API; the shared session lives in
// project.json with a localStorage mirror for a file:// open.
async function fetchNamed(id) {
    const res = await fetch(`${API}/${encodeURIComponent(id)}`, { cache: 'no-store' });
    if (res.status === 404) {
        // The row is gone: stop aiming saves at it rather than failing
        // forever, and let the caller say so.
        target = null;
        notice = 'missing';
        return null;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}

async function loadProject() {
    notice = '';
    if (target && served()) {
        try {
            const payload = await fetchNamed(target);
            const project = payload ? parseProject(payload.doc) : null;
            if (project) {
                project.name = cleanName(payload.name, project.name);
                return project;
            }
            if (notice === 'missing') return readLocal();
        } catch (err) {
            console.warn('[project] could not load project ' + target, err);
            notice = 'offline';
            return readLocal();
        }
    }
    if (served()) {
        try {
            const res = await fetch(PROJECT_FILE, { cache: 'no-store' });
            if (res.ok) {
                const project = parseProject(await res.text());
                if (project) return project;
            }
        } catch {
            // fall through to the local mirror
        }
    }
    return readLocal();
}

async function saveProject(project) {
    const json = projectToJSON(project);
    let onDisk = false;

    if (served()) {
        try {
            const res = await fetch(target ? `${API}/${target}` : PROJECT_FILE, {
                method: target ? 'PATCH' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: target ? JSON.stringify({ doc: project }) : json
            });
            onDisk = res.ok;
        } catch {
            onDisk = false;
        }
    }
    if (hasLocal()) {
        try { localStorage.setItem(STORAGE_KEY, json); } catch { /* quota */ }
    }
    return onDisk;
}

// The last write on the way out of the page. keepalive lets a PATCH outlive
// the document - sendBeacon can only POST, which the API would answer with a
// 405 for a named project.
function flushProject(project) {
    const json = projectToJSON(project);
    if (hasLocal()) {
        try { localStorage.setItem(STORAGE_KEY, json); } catch { /* quota */ }
    }
    if (!served()) return false;
    try {
        fetch(target ? `${API}/${target}` : PROJECT_FILE, {
            method: target ? 'PATCH' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: target ? JSON.stringify({ doc: project }) : json,
            keepalive: true
        }).catch(() => { /* the page is closing */ });
        return true;
    } catch {
        return false;
    }
}

// Forget the local session. A named project is kept - deleting it would break
// the URL - and just has its document reset to the defaults.
async function clearProject() {
    if (served()) {
        try {
            await fetch(target ? `${API}/${target}` : PROJECT_FILE, {
                method: target ? 'PATCH' : 'DELETE',
                headers: target ? { 'Content-Type': 'application/json' } : undefined,
                body: target ? JSON.stringify({ doc: {} }) : undefined
            });
        } catch { /* offline */ }
    }
    if (hasLocal()) {
        try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
    }
}

async function patchName(name) {
    const res = await fetch(`${API}/${target}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}

async function renameProject(name) {
    if (!target) return false;
    const payload = await patchName(name);
    notice = '';
    return payload.name;
}

// Turn the local session into a real project: the whole document goes up in
// the create call, so nothing is lost on the redirect back.
async function createProject(name, doc) {
    const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, doc })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}

async function duplicateProject(name) {
    if (!target) throw new Error('no project open');
    const res = await fetch(`${API}/${target}/duplicate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(name ? { name } : {})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}

// ---- js/registry.js ----
const MANIFEST_FILE = 'manifest.json';

// Used when the manifest cannot be fetched (no server, bad path), so the
// viewer still boots with something on screen instead of an empty stage.
const BUILTIN = {
    id: 'o2tilt-classic',
    name: 'O2-TILT Classic',
    environment: { theme: 'light' },
    objects: [{
        type: 'o2tilt-frame',
        params: { gap: 3, pan: 0, pitch: 0, decline: 0, fabric: true },
        elements: []
    }]
};

const THEMES = ['light', 'dark'];

function isPlainObject(v) {
    return !!v && typeof v === 'object' && !Array.isArray(v);
}

// Pure: no fetch, no three. Returns a list of human-readable problems.
// `types` is a Map of type -> { factory, params }.
function validateDef(def, types) {
    const errs = [];
    if (!isPlainObject(def)) return ['definition must be a JSON object'];

    if (typeof def.id !== 'string' || !def.id) errs.push('missing "id"');
    if (typeof def.name !== 'string' || !def.name) errs.push('missing "name"');

    if (def.environment !== undefined) {
        if (!isPlainObject(def.environment)) errs.push('"environment" must be an object');
        else if (def.environment.theme !== undefined && !THEMES.includes(def.environment.theme)) {
            errs.push(`environment.theme must be one of ${THEMES.join(', ')}`);
        }
    }

    if (!Array.isArray(def.objects) || def.objects.length === 0) {
        errs.push('"objects" must be a non-empty array');
        return errs;
    }

    def.objects.forEach((o, i) => {
        const at = `objects[${i}]`;
        if (!isPlainObject(o)) { errs.push(`${at} must be an object`); return; }
        if (typeof o.type !== 'string' || !o.type) { errs.push(`${at}.type must be a string`); return; }

        const reg = types ? types.get(o.type) : null;
        if (types && !reg) { errs.push(`${at}.type "${o.type}" is not registered`); return; }
        if (!reg) return;

        const params = o.params === undefined ? {} : o.params;
        if (!isPlainObject(params)) { errs.push(`${at}.params must be an object`); return; }

        const schema = reg.params || {};
        for (const [k, v] of Object.entries(params)) {
            const p = schema[k];
            if (!p) { errs.push(`${at}.params: unknown "${k}"`); continue; }
            if (p.type === 'range') {
                if (typeof v !== 'number' || !Number.isFinite(v)) {
                    errs.push(`${at}.params.${k} must be a number`);
                } else if (v < p.min || v > p.max) {
                    errs.push(`${at}.params.${k}=${v} outside [${p.min}, ${p.max}]`);
                }
            } else if (p.type === 'toggle') {
                if (typeof v !== 'boolean') errs.push(`${at}.params.${k} must be true or false`);
            }
        }

        if (o.elements !== undefined && !Array.isArray(o.elements)) {
            errs.push(`${at}.elements must be an array`);
        }
    });

    return errs;
}

class Registry {
    constructor(base = './models') {
        this.base = String(base).replace(/\/+$/, '');
        this.types = new Map();
        this.entries = [];
        this.defs = new Map();
        this.source = 'builtin';
    }

    register(type, factory, params = {}) {
        this.types.set(type, { factory, params });
        return this;
    }

    get list() {
        if (this.entries.length) return this.entries;
        return [{ id: BUILTIN.id, name: BUILTIN.name, file: null, tags: ['builtin'] }];
    }

    // 'builtin' until a manifest has been fetched successfully.
    get manifestSource() { return this.source; }

    async loadManifest() {
        const url = `${this.base}/${MANIFEST_FILE}`;
        const res = await fetch(url, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`GET ${url} -> ${res.status}`);

        let data;
        try { data = await res.json(); }
        catch (e) { throw new Error(`${MANIFEST_FILE} is not valid JSON: ${e.message}`); }

        if (!isPlainObject(data) || !Array.isArray(data.models)) {
            throw new Error(`${MANIFEST_FILE} needs a "models" array`);
        }
        if (!data.models.length) throw new Error(`${MANIFEST_FILE} lists no models`);

        const seen = new Set();
        const entries = data.models.map((m, i) => {
            if (!isPlainObject(m)) throw new Error(`models[${i}] must be an object`);
            const id = typeof m.id === 'string' ? m.id : '';
            const file = typeof m.file === 'string' ? m.file : '';
            if (!id) throw new Error(`models[${i}] needs an "id"`);
            if (!file) throw new Error(`models[${i}] needs a "file"`);
            if (seen.has(id)) throw new Error(`duplicate model id "${id}"`);
            if (file.includes('..') || file.startsWith('/') || file.includes(':')) {
                throw new Error(`models[${i}].file must stay inside the models folder`);
            }
            seen.add(id);
            return {
                id,
                name: typeof m.name === 'string' && m.name ? m.name : id,
                file,
                tags: Array.isArray(m.tags) ? m.tags.map(String) : []
            };
        });

        this.entries = entries;
        this.defs.clear();
        this.source = 'manifest';
        return entries;
    }

    async load(id) {
        const cached = this.defs.get(id);
        if (cached) return cached;

        let def;
        if (this.source !== 'manifest' && id === BUILTIN.id) {
            def = BUILTIN;
        } else {
            const entry = this.entries.find(e => e.id === id);
            if (!entry) throw new Error(`unknown model id "${id}"`);

            const url = `${this.base}/${entry.file}`;
            const res = await fetch(url, { cache: 'no-cache' });
            if (!res.ok) throw new Error(`GET ${url} -> ${res.status}`);
            try { def = await res.json(); }
            catch (e) { throw new Error(`${entry.file} is not valid JSON: ${e.message}`); }
        }

        const errs = validateDef(def, this.types);
        if (errs.length) throw new Error(`${id}: ${errs.join('; ')}`);

        this.defs.set(id, def);
        return def;
    }

    // Turns a definition into live models. Returns both, because the viewer
    // and the environment (theme) are separate concerns.
    async instantiate(def) {
        const errs = validateDef(def, this.types);
        if (errs.length) throw new Error(`${def && def.id}: ${errs.join('; ')}`);

        const models = [];
        for (const [i, o] of def.objects.entries()) {
            const model = this.types.get(o.type).factory(o.params || {});
            model.id = def.id;
            model.name = def.name;
            model.objectIndex = i;
            model.def = def;
            models.push(model);
        }
        return { models, environment: def.environment || {} };
    }
}

// ---- js/objects/o2tilt.js ----
const MODEL_ID = 'o2tilt';
const MODEL_NAME = 'O2-TILT Frame';
const MODEL_SUBTITLE = 'Modular Control';

const POLE_MAX_HEIGHT = 8.0;
const RAIL_LENGTH = 12.0;
const WAVE_AMP = 1.0;
const RAIL_RADIUS = 0.12;
const FABRIC_RES_X = 300;
const FABRIC_RES_Y = 8;
const POLE_COUNT = 3;
const MAX_DROP = 5.0;
const PLEAT_FREQ = 30;
const PLEAT_DEPTH = 0.12;
const ANCHOR_RAIL_SAMPLES = 24;

// A stand is telescoping: a fixed sleeve standing out of the floor, with a
// slimmer inner tube running out of its open top and on up to the rail.
const POLE_SECTION = 0.16;      // outer tube across flats, in feet
const MM_PER_FOOT = 304.8;
const NEST_CLEARANCE = 0.002;   // gap between inner tube and sleeve bore, feet
const INNER_HIDE = 0.02;        // below this the inner tube is not drawn

const PARAMS = {
    gap:     { label: 'Center Gap',        type: 'range', min: 0, max: 6,   step: 0.1, value: 3,  unit: ' ft' },
    pan:     { label: 'Swing Pan (Arc)',   type: 'range', min: 0, max: 90,  step: 1,   value: 0,  unit: '°' },
    pitch:   { label: 'Pitch (Rail Tilt)', type: 'range', min: 0, max: 20,  step: 1,   value: 0,  unit: '°' },
    decline: { label: 'Decline (Slope)',   type: 'range', min: 0, max: 100, step: 1,   value: 0,  unit: '%' },
    fabric:  { label: 'Curtains',          type: 'toggle', value: false },

    poleShape: { label: 'Square Poles',    type: 'toggle', value: true, advanced: true },
    poleInner: { label: 'Inner Wall',      type: 'range', min: 0.8, max: 3, step: 0.1,
                 value: 1,   unit: ' mm', advanced: true },
    poleOuter: { label: 'Outer Wall',      type: 'range', min: 1,   max: 4, step: 0.1,
                 value: 1.5, unit: ' mm', advanced: true },
    sleeve:    { label: 'Sleeve Height',   type: 'range', min: 3, max: 10, step: 0.1,
                 value: 5,   unit: ' ft', advanced: true }
};

const MODEL_THEME = {
    light: { fabric: 0xffffff, fabricEnv: 0.15, metalEnv: 1.0 },
    dark:  { fabric: 0xd4d4d8, fabricEnv: 0.08, metalEnv: 0.4 }
};

function createBaseFrame(bMat) {
    const group = new THREE.Group();
    const w = 1.6, d = 1.6, thick = 0.12, h = 0.12;

    const mark = m => { m.castShadow = true; m.receiveShadow = true; return m; };

    // 1. Square base frame
    const geoX = new THREE.BoxGeometry(w, h, thick);
    const geoZ = new THREE.BoxGeometry(thick, h, d - thick * 2);

    const b1 = new THREE.Mesh(geoX, bMat); b1.position.set(0, h / 2, d / 2 - thick / 2);
    const b2 = new THREE.Mesh(geoX, bMat); b2.position.set(0, h / 2, -d / 2 + thick / 2);
    const b3 = new THREE.Mesh(geoZ, bMat); b3.position.set(w / 2 - thick / 2, h / 2, 0);
    const b4 = new THREE.Mesh(geoZ, bMat); b4.position.set(-w / 2 + thick / 2, h / 2, 0);
    [b1, b2, b3, b4].forEach(m => group.add(mark(m)));

    // 2. Pole base plate + collar (the pole foot the braces anchor into)
    const PLATE_R = 0.30, PLATE_H = 0.10;
    const COLLAR_R = 0.14, COLLAR_TOP = 0.66;
    const plate = mark(new THREE.Mesh(
        new THREE.CylinderGeometry(PLATE_R, PLATE_R, PLATE_H, 24), bMat));
    plate.position.y = PLATE_H / 2;
    const collar = mark(new THREE.Mesh(
        new THREE.CylinderGeometry(COLLAR_R, COLLAR_R, COLLAR_TOP - PLATE_H, 24), bMat));
    collar.position.y = (PLATE_H + COLLAR_TOP) / 2;
    group.add(plate, collar);

    // 3. Four diagonal braces, each embedded at BOTH ends
    const a = new THREE.Vector3(0.06, 0.58, 0);
    const b = new THREE.Vector3(w / 2 - thick / 2, h / 2, 0);
    const dir = b.clone().sub(a);
    const gLen = dir.length();
    const braceGeo = new THREE.CylinderGeometry(0.045, 0.045, gLen, 8);
    braceGeo.translate(0, gLen / 2, 0);
    const braceQ = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), dir.normalize());

    for (let i = 0; i < 4; i++) {
        const holder = new THREE.Group();
        const g = mark(new THREE.Mesh(braceGeo, bMat));
        g.position.copy(a);
        g.quaternion.copy(braceQ);
        holder.add(g);
        holder.rotation.y = (Math.PI / 2) * i;
        group.add(holder);
    }
    return group;
}

// Cross-section of a real tube: a square (or round) ring extruded along Y
// over a unit height, so scaling Y sets the length while the wall thickness
// stays in X/Z. Solid-looking but genuinely hollow - the wall number in the
// Advanced settings is a real dimension.
function tubeGeometry(square, section, wall) {
    const outer = section / 2;
    const inner = Math.max(outer * 0.15, outer - wall);
    let shape, hole;

    if (square) {
        shape = new THREE.Shape();
        shape.moveTo(-outer, -outer).lineTo(outer, -outer)
             .lineTo(outer, outer).lineTo(-outer, outer).closePath();
        hole = new THREE.Path();
        // Opposite winding so the ring triangulates as a hole.
        hole.moveTo(-inner, -inner).lineTo(-inner, inner)
             .lineTo(inner, inner).lineTo(inner, -inner).closePath();
    } else {
        shape = new THREE.Shape();
        shape.absarc(0, 0, outer, 0, Math.PI * 2, false);
        hole = new THREE.Path();
        hole.absarc(0, 0, inner, 0, Math.PI * 2, true);
    }
    shape.holes.push(hole);

    const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 1, bevelEnabled: false, steps: 1, curveSegments: square ? 1 : 24
    });
    geo.rotateX(-Math.PI / 2);
    return geo;
}

function getStructuralPoints(state, isRight, segments) {
    const pts = [];
    const panRad = state.pan * (Math.PI / 180);
    const pitchRad = state.pitch * (Math.PI / 180);
    const halfGap = state.gap / 2.0;

    const sinP = Math.sin(pitchRad), cosP = Math.cos(pitchRad);
    const sinA = Math.sin(panRad),   cosA = Math.cos(panRad);

    for (let i = 0; i <= segments; i++) {
        const t = i / segments;

        const localX = t * RAIL_LENGTH;
        const wave = Math.sin(t * Math.PI * 6) * WAVE_AMP;

        // Decline: a pure vertical drop, independent of pitch.
        const dropY = -t * (state.decline / 100) * MAX_DROP;

        // Pitch: roll the serpentine about the rail's own X axis. Poles sit
        // where wave === 0, so their heights are unaffected by pitch.
        const pitchedY = -wave * sinP;
        const pitchedZ =  wave * cosP;

        // Pan: yaw the whole rail about Y, anchored at the centre gap
        const panX = localX * cosA + pitchedZ * sinA;
        const panZ = -localX * sinA + pitchedZ * cosA;

        let wX = halfGap + panX;
        let wY = POLE_MAX_HEIGHT + dropY + pitchedY;
        let wZ = panZ;

        if (!isRight) wX = -wX;

        pts.push(new THREE.Vector3(wX, wY, wZ));
    }
    return pts;
}

function generateFabricGeometry(curvePts, isRight) {
    const cols = FABRIC_RES_X, rows = FABRIC_RES_Y;
    const verts = [], uvs = [], indices = [];
    const rowStride = rows + 1;

    for (let i = 0; i <= cols; i++) {
        const t = i / cols;
        const pt = curvePts[i];

        let tan = new THREE.Vector3();
        if (i < cols) tan.subVectors(curvePts[i + 1], pt);
        else tan.subVectors(pt, curvePts[i - 1]);
        tan.y = 0;
        if (tan.lengthSq() < 1e-12) tan.set(1, 0, 0);
        tan.normalize();

        const normal = new THREE.Vector3(-tan.z, 0, tan.x);
        if (!isRight) normal.negate();

        const phase = t * Math.PI * 2 * PLEAT_FREQ;

        for (let j = 0; j <= rows; j++) {
            const v = j / rows;
            const y = THREE.MathUtils.lerp(pt.y - RAIL_RADIUS, 0, v);
            const amp = PLEAT_DEPTH * (0.55 + 0.45 * v);
            const off = Math.sin(phase) * amp;
            verts.push(pt.x + normal.x * off, y, pt.z + normal.z * off);
            uvs.push(t, 1 - v);
        }
    }

    for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
            const a = i * rowStride + j;
            const b = a + 1;
            const c = (i + 1) * rowStride + j;
            const d = c + 1;
            indices.push(a, b, d);
            indices.push(a, d, c);
        }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
}

function createO2TiltModel(initial = {}) {
    const root = new THREE.Group();
    root.name = MODEL_ID;

    const matRail = new THREE.MeshStandardMaterial({ color: 0x4b5563, metalness: 0.6, roughness: 0.3 });
    const matPole = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.4, roughness: 0.4 });
    const matBase = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.7, roughness: 0.2 });
    const matFabric = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.9, metalness: 0.1,
        side: THREE.DoubleSide, envMapIntensity: 0.15
    });

    const state = {};
    for (const k of Object.keys(PARAMS)) state[k] = PARAMS[k].value;
    Object.assign(state, initial);

    const polesL = [], polesR = [], basesL = [], basesR = [];
    for (let i = 0; i < POLE_COUNT; i++) {
        for (const [pArr, bArr, tag] of [
            [polesL, basesL, 'L'], [polesR, basesR, 'R']
        ]) {
            const stand = new THREE.Group();
            stand.name = `stand-${tag}-${i}`;

            const sleeve = new THREE.Mesh(new THREE.BufferGeometry(), matPole);
            const inner = new THREE.Mesh(new THREE.BufferGeometry(), matPole);
            sleeve.name = 'stand-sleeve';
            inner.name = 'stand-inner';
            sleeve.castShadow = inner.castShadow = true;
            inner.visible = false;
            stand.add(sleeve, inner);

            const base = createBaseFrame(matBase);
            base.name = 'stand-base';
            root.add(stand, base);

            pArr.push({ group: stand, sleeve, inner, height: 0 });
            bArr.push(base);
        }
    }

    // One shared geometry per part; rebuilt only when the advanced tube
    // settings actually change, not on every slider tick.
    let sleeveGeo = null, innerGeo = null, tubeKey = '';

    function ensureTubeGeometry() {
        const wallOut = state.poleOuter / MM_PER_FOOT;
        const wallIn = state.poleInner / MM_PER_FOOT;
        const key = `${state.poleShape ? 'square' : 'round'}|${wallOut.toFixed(5)}|${wallIn.toFixed(5)}`;
        if (key === tubeKey) return;
        tubeKey = key;

        // The inner tube has to nest inside the sleeve bore with room to slide.
        const bore = POLE_SECTION / 2 - wallOut;
        const innerSection = Math.max(0.02, (bore - NEST_CLEARANCE) * 2);

        if (sleeveGeo) sleeveGeo.dispose();
        if (innerGeo) innerGeo.dispose();
        sleeveGeo = tubeGeometry(state.poleShape, POLE_SECTION, wallOut);
        innerGeo = tubeGeometry(state.poleShape, innerSection, wallIn);

        for (const arr of [polesL, polesR]) {
            for (const p of arr) {
                p.sleeve.geometry = sleeveGeo;
                p.inner.geometry = innerGeo;
            }
        }
    }

    let railL = null, railR = null, fabricL = null, fabricR = null;
    let anchors = [];
    let anchorsStale = true;

    function release(mesh) {
        if (!mesh) return;
        root.remove(mesh);
        mesh.geometry.dispose();
    }

    function build() {
        const ptsL = getStructuralPoints(state, false, FABRIC_RES_X);
        const ptsR = getStructuralPoints(state, true, FABRIC_RES_X);
        const panRad = state.pan * (Math.PI / 180);

        ensureTubeGeometry();

        for (let i = 0; i < POLE_COUNT; i++) {
            const idx = Math.floor((i / (POLE_COUNT - 1)) * FABRIC_RES_X);

            for (const [pts, stands, bases, turn] of [
                [ptsR, polesR, basesR, 1],
                [ptsL, polesL, basesL, -1]
            ]) {
                const p = pts[idx];
                const railY = Math.max(0.05, p.y);
                const stand = stands[i];

                // The sleeve is the pole's retracted length; the inner tube
                // takes up the rest of the way to the rail, and neither is
                // ever allowed to poke through it.
                const sleeveH = Math.min(Math.max(0.05, state.sleeve), railY);
                const innerH = railY - sleeveH;

                stand.group.position.set(p.x, 0, p.z);
                stand.group.rotation.y = turn * panRad;
                stand.sleeve.position.set(0, 0, 0);
                stand.sleeve.scale.set(1, sleeveH, 1);
                stand.inner.position.set(0, sleeveH, 0);
                stand.inner.scale.set(1, Math.max(0.02, innerH), 1);
                stand.inner.visible = innerH > INNER_HIDE;
                stand.height = railY;

                bases[i].position.set(p.x, 0, p.z);
                bases[i].rotation.y = turn * panRad;
            }
        }

        release(railR); release(railL); railR = railL = null;
        const rCurv = new THREE.CatmullRomCurve3(ptsR);
        const lCurv = new THREE.CatmullRomCurve3(ptsL);
        rCurv.arcLengthDivisions = lCurv.arcLengthDivisions = Math.max(200, FABRIC_RES_X);
        railR = new THREE.Mesh(new THREE.TubeGeometry(rCurv, FABRIC_RES_X, RAIL_RADIUS, 12, false), matRail);
        railL = new THREE.Mesh(new THREE.TubeGeometry(lCurv, FABRIC_RES_X, RAIL_RADIUS, 12, false), matRail);
        railR.castShadow = railL.castShadow = true;
        root.add(railR, railL);

        release(fabricR); release(fabricL); fabricR = fabricL = null;
        if (state.fabric) {
            fabricR = new THREE.Mesh(generateFabricGeometry(ptsR, true), matFabric);
            fabricL = new THREE.Mesh(generateFabricGeometry(ptsL, false), matFabric);
            fabricR.castShadow = fabricL.castShadow = true;
            root.add(fabricR, fabricL);
        }

        anchorsStale = true;
        model.dirty = false;
    }

    // Anchors are where ELEMENTS (curtain, flowers, balloons) may attach.
    // kind: 'rail'  - along the serpentine rail, with tangent + outward normal
    //       'pole'  - top of each pole
    //       'base'  - floor plate of each base
    function getAnchors() {
        if (!anchorsStale) return anchors;
        anchors = [];

        for (const side of [false, true]) {
            const pts = getStructuralPoints(state, side, ANCHOR_RAIL_SAMPLES);
            for (let i = 0; i < pts.length; i++) {
                const prv = pts[Math.max(i - 1, 0)];
                const nxt = pts[Math.min(i + 1, pts.length - 1)];
                const tangent = nxt.clone().sub(prv).normalize();
                const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
                if (!side) normal.negate();
                anchors.push({
                    id: `rail-${side ? 'R' : 'L'}-${i}`,
                    kind: 'rail',
                    side: side ? 'R' : 'L',
                    position: pts[i].clone(),
                    tangent,
                    normal
                });
            }
        }

        for (const [tag, pArr, bArr] of [['L', polesL, basesL], ['R', polesR, basesR]]) {
            for (let i = 0; i < pArr.length; i++) {
                const stand = pArr[i];
                anchors.push({
                    id: `pole-${tag}-${i}`,
                    kind: 'pole',
                    side: tag,
                    position: new THREE.Vector3(
                        stand.group.position.x, stand.height, stand.group.position.z),
                    tangent: new THREE.Vector3(0, 1, 0),
                    normal: new THREE.Vector3(1, 0, 0)
                });
                anchors.push({
                    id: `base-${tag}-${i}`,
                    kind: 'base',
                    side: tag,
                    position: bArr[i].position.clone(),
                    tangent: new THREE.Vector3(1, 0, 0),
                    normal: new THREE.Vector3(0, 1, 0)
                });
            }
        }

        anchorsStale = false;
        return anchors;
    }

    function setTheme(isDark) {
        const t = isDark ? MODEL_THEME.dark : MODEL_THEME.light;
        matFabric.color.setHex(t.fabric);
        matFabric.envMapIntensity = t.fabricEnv;
        matRail.envMapIntensity = t.metalEnv;
        matPole.envMapIntensity = t.metalEnv;
        matBase.envMapIntensity = t.metalEnv;
    }

    function dispose() {
        release(railL); release(railR); release(fabricL); release(fabricR);
        railL = railR = fabricL = fabricR = null;
        root.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
        root.clear();
        sleeveGeo = innerGeo = null;
        tubeKey = '';
        [matRail, matPole, matBase, matFabric].forEach(m => m.dispose());
        anchors = [];
        anchorsStale = true;
    }

    const model = {
        id: MODEL_ID,
        name: MODEL_NAME,
        subtitle: MODEL_SUBTITLE,
        object3D: root,
        params: PARAMS,
        state,
        dirty: true,
        build,
        getAnchors,
        setTheme,
        setParams(partial) { Object.assign(state, partial); model.dirty = true; },
        dispose
    };

    build();
    return model;
}

// ---- js/viewer.js ----
const FLOOR_SIZE = 200;
const GRID_CELLS = 100;

const THEME = {
    light: { bg: 0xf3f4f6, ambient: 0.8, key: 1.5, floorEnv: 0.1 },
    dark:  { bg: 0x18181b, ambient: 0.4, key: 2.0, floorEnv: 0.05 }
};

const FRAME_DIR = new THREE.Vector3(0, 4, -25).normalize();

// Breathing room between side-by-side models in "all at once" mode.
const OVERLAY_GAP = 2.5;

const FALLBACK_BOUNDS =
    new THREE.Box3(new THREE.Vector3(-6, 0, -6), new THREE.Vector3(6, 9, 6));

// Pure. Takes world spans ([minX, maxX]) measured with every model back at its
// base position and returns the X offset each one needs: packs them left to
// right with `gap` between neighbours, then shifts the whole row so its centre
// lands on the origin. A lone span comes back as a plain re-centring, so the
// single-model view keeps framing exactly as it did before overlay mode.
function layoutOffsets(spans, gap = OVERLAY_GAP) {
    const offs = [];
    let cursor = 0;
    for (const span of spans) {
        const min = span[0], max = span[1];
        if (!(max > min)) { offs.push(0); continue; }
        offs.push(cursor - min);
        cursor += max - min + gap;
    }
    const back = -Math.max(0, cursor - gap) / 2;
    return offs.map(o => o + back);
}

// The grid is baked into the floor texture instead of drawn as separate lines.
// LineBasicMaterial cannot receive shadows, so standalone lines stayed bright
// inside a shadow and glared against the darkened floor.
function makeFloorTexture(base, line, anisotropy) {
    const S = 64;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = base;
    g.fillRect(0, 0, S, S);
    g.strokeStyle = line;
    g.lineWidth = 3;
    g.strokeRect(0, 0, S, S);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(GRID_CELLS, GRID_CELLS);
    tex.anisotropy = anisotropy;
    return tex;
}

function failBoot(message) {
    if (window.__bootFail) clearTimeout(window.__bootFail);
    const box = document.getElementById('boot');
    const msg = document.getElementById('boot-msg');
    if (msg) msg.textContent = message;
    if (box) box.classList.add('failed');
}

// Fit `bounds` into the viewport along the fixed view bearing. Deriving the
// distance from the real bounds and the current aspect keeps the whole scene
// visible on portrait phones, where a fixed camera position crops it badly.
function frameCamera(camera, controls, bounds) {
    const center = bounds.getCenter(new THREE.Vector3());
    const half = bounds.getSize(new THREE.Vector3()).multiplyScalar(0.5);

    const zAxis = FRAME_DIR.clone();
    const xAxis = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), zAxis).normalize();
    const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();
    const extent = v => Math.abs(v.x) * half.x + Math.abs(v.y) * half.y + Math.abs(v.z) * half.z;

    const vHalf = THREE.MathUtils.degToRad(camera.fov) / 2;
    const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
    const dist = Math.max(extent(xAxis) / Math.tan(hHalf),
                          extent(yAxis) / Math.tan(vHalf))
               + extent(zAxis);

    controls.target.copy(center);
    camera.position.copy(center).addScaledVector(FRAME_DIR, dist * 1.12);
    camera.updateProjectionMatrix();
    controls.update();
}

class Viewer {
    constructor(container) {
        this.container = container;
        this.models = [];
        this.isDark = false;
        this.onFirstRender = null;
        this._booted = false;
        this._framedAspect = window.innerWidth / window.innerHeight;

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(THEME.light.bg);

        this.camera = new THREE.PerspectiveCamera(
            45, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.set(0, 8, -25);

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true });
        } catch (err) {
            failBoot('WebGL is not available in this browser');
            throw err;
        }
        this.renderer = renderer;
        this.resize();
        this._framedAspect = this.camera.aspect;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Image based lighting, otherwise metalness reads as flat black
        const pmrem = new THREE.PMREMGenerator(renderer);
        const roomEnv = new RoomEnvironment(renderer);
        this.scene.environment = pmrem.fromScene(roomEnv, 0.04).texture;
        roomEnv.dispose();
        pmrem.dispose();

        this.controls = new OrbitControls(this.camera, renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.target.set(0, 4, 0);
        this.controls.maxPolarAngle = Math.PI / 2 - 0.05;

        this.ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        this.scene.add(this.ambientLight);

        this.mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        this.mainLight.position.set(15, 25, -20);
        this.mainLight.castShadow = true;
        this.mainLight.shadow.mapSize.width = 2048;
        this.mainLight.shadow.mapSize.height = 2048;
        this.mainLight.shadow.camera.left = -20;
        this.mainLight.shadow.camera.right = 20;
        this.mainLight.shadow.camera.top = 20;
        this.mainLight.shadow.camera.bottom = -20;
        this.scene.add(this.mainLight);

        this.fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        this.fillLight.position.set(-15, 10, 20);
        this.scene.add(this.fillLight);

        const aniso = renderer.capabilities.getMaxAnisotropy();
        this.floorTex = {
            light: makeFloorTexture('#e5e7eb', '#c7ccd3', aniso),
            dark:  makeFloorTexture('#27272a', '#46464e', aniso)
        };
        this.matFloor = new THREE.MeshStandardMaterial({
            color: 0xffffff, roughness: 1, envMapIntensity: 0.1, map: this.floorTex.light
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_SIZE, FLOOR_SIZE), this.matFloor);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        this.scene.add(floor);

        // The canvas fills its container, not the window: on a phone the
        // control sheet takes the bottom of the screen and the render target
        // has to follow it. Window events still drive the reframe, since only
        // a real window change should re-aim the camera.
        this._onResize = () => {
            const aspect = this.resize();
            if (Math.abs(aspect - this._framedAspect) > this._framedAspect * 0.3) {
                this._framedAspect = aspect;
                this.frameScene();
            }
        };
        window.addEventListener('resize', this._onResize);

        this._watchBox = null;
        if (typeof ResizeObserver === 'function') {
            this._watchBox = new ResizeObserver(() => this.resize());
            this._watchBox.observe(container);
        }

        this._raf = 0;
        this._tick = () => {
            this._raf = requestAnimationFrame(this._tick);
            this.controls.update();
            this.renderer.render(this.scene, this.camera);

            if (!this._booted) {
                this._booted = true;
                if (window.__bootFail) clearTimeout(window.__bootFail);
                const boot = document.getElementById('boot');
                if (boot) {
                    boot.classList.add('hidden');
                    setTimeout(() => boot.remove(), 500);
                }
                if (this.onFirstRender) this.onFirstRender();
            }
        };
    }

    // Mounting is decoupled from framing: overlay mode adds several models
    // and frames once, after layoutGroups has positioned them.
    addModel(model) {
        this.scene.add(model.object3D);
        this.models.push(model);
        if (model.setTheme) model.setTheme(this.isDark);
        return model;
    }

    removeModel(model) {
        const i = this.models.indexOf(model);
        if (i < 0) return false;
        this.models.splice(i, 1);
        this.scene.remove(model.object3D);
        if (model.dispose) model.dispose();
        return true;
    }

    clearModels() {
        while (this.models.length) this.removeModel(this.models[0]);
    }

    setTheme(isDark) {
        this.isDark = isDark;
        const t = isDark ? THEME.dark : THEME.light;

        document.documentElement.classList.toggle('dark', isDark);
        this.scene.background.setHex(t.bg);
        this.matFloor.map = this.floorTex[isDark ? 'dark' : 'light'];
        this.matFloor.envMapIntensity = t.floorEnv;
        this.ambientLight.intensity = t.ambient;
        this.mainLight.intensity = t.key;

        for (const m of this.models) if (m.setTheme) m.setTheme(isDark);
    }

    // Match the camera and the drawing buffer to whatever box the canvas
    // currently occupies. Never reframes: the sheet opening and closing must
    // not throw the camera back to its default aim.
    resize() {
        const w = this.container.clientWidth || window.innerWidth;
        const h = this.container.clientHeight || window.innerHeight;
        if (!w || !h) return this.camera.aspect;
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(w, h);
        return this.camera.aspect;
    }

    // World bounds of a set of models, before any overlay offset is applied.
    computeBoundsOf(models) {
        const box = new THREE.Box3();
        const tmp = new THREE.Box3();
        for (const m of models) {
            if (!m.object3D) continue;
            tmp.setFromObject(m.object3D);
            if (!tmp.isEmpty()) box.union(tmp);
        }
        return box;
    }

    computeBounds() {
        const box = this.computeBoundsOf(this.models);
        if (box.isEmpty()) return FALLBACK_BOUNDS.clone();
        return box;
    }

    // `groups` is an array of model arrays (one per preset). Spacing is derived
    // from each group's own bounds so presets never overlap, and the row is
    // re-centred. Only X is touched: the floor stays a single shared stage.
    layoutGroups(groups, gap = OVERLAY_GAP) {
        for (const g of groups) {
            for (const m of g) {
                if (!m.object3D) continue;
                m.object3D.position.x -= m.layoutX || 0;
                m.layoutX = 0;
            }
        }
        const spans = groups.map(g => {
            const b = this.computeBoundsOf(g);
            return b.isEmpty() ? [0, 0] : [b.min.x, b.max.x];
        });
        const offs = layoutOffsets(spans, gap);
        groups.forEach((g, i) => {
            for (const m of g) {
                if (!m.object3D) continue;
                m.object3D.position.x += offs[i];
                m.layoutX = offs[i];
            }
        });
        return offs;
    }

    frameScene(bounds = this.computeBounds()) {
        frameCamera(this.camera, this.controls, bounds);
    }

    // Where the camera was left, as plain arrays so the value survives JSON.
    // Restored views must not fight damping, so setCameraState writes the
    // controls directly rather than animating.
    getCameraState() {
        const p = this.camera.position;
        const t = this.controls.target;
        return {
            position: [p.x, p.y, p.z],
            target: [t.x, t.y, t.z]
        };
    }

    setCameraState(state) {
        if (!state) return false;
        const set = (vec, values) => {
            if (!Array.isArray(values) || values.length !== 3) return false;
            if (!values.every(v => typeof v === 'number' && Number.isFinite(v))) return false;
            vec.set(values[0], values[1], values[2]);
            return true;
        };
        const moved = set(this.camera.position, state.position);
        const aimed = set(this.controls.target, state.target);
        if (moved || aimed) {
            this.camera.updateProjectionMatrix();
            this.controls.update();
        }
        return moved || aimed;
    }

    // A 480px JPEG of the current frame, for the project list. The renderer
    // runs without preserveDrawingBuffer, so the canvas can only be read in
    // the same tick as a render - render here, then draw immediately.
    captureThumbnail(maxEdge = 480, quality = 0.72) {
        this.renderer.render(this.scene, this.camera);
        const source = this.renderer.domElement;
        const edge = Math.max(source.width, source.height) || 1;
        const scale = Math.min(1, maxEdge / edge);
        const w = Math.max(1, Math.round(source.width * scale));
        const h = Math.max(1, Math.round(source.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(source, 0, 0, w, h);
        return canvas.toDataURL('image/jpeg', quality);
    }

    start() {
        if (!this._raf) this._tick();
    }

    stop() {
        if (this._raf) cancelAnimationFrame(this._raf);
        this._raf = 0;
    }

    dispose() {
        this.stop();
        window.removeEventListener('resize', this._onResize);
        if (this._watchBox) this._watchBox.disconnect();
        this.clearModels();
        this.scene.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
        [this.matFloor].forEach(m => m.dispose());
        this.renderer.dispose();
        if (this.renderer.domElement.parentNode) {
            this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
        }
    }
}

// ---- js/panel.js ----
const LABEL_CLS = 'font-semibold text-gray-600 dark:text-zinc-300';
const VALUE_CLS = 'text-sky-600 dark:text-sky-400 font-mono';
const CHECK_CLS = 'custom-checkbox';
const FIELD_CLS = 'w-full text-sm px-2 py-1.5 rounded-md border border-gray-300 '
    + 'dark:border-zinc-600 bg-white/70 dark:bg-zinc-800/70 '
    + 'text-gray-800 dark:text-zinc-200 focus:outline-none focus:ring-1 focus:ring-sky-400';
const HEADING_CLS = 'text-xs font-semibold text-gray-600 dark:text-zinc-300 mb-1';

const fmt = (value, unit) =>
    (typeof value === 'number' ? parseFloat(value.toFixed(2)) : value) + (unit || '');

function blockShell(key, label) {
    const wrap = document.createElement('div');
    wrap.className = 'mb-3';
    const head = document.createElement('div');
    head.className = 'flex justify-between text-xs mb-1';
    const labelEl = document.createElement('label');
    labelEl.className = LABEL_CLS;
    labelEl.textContent = label;
    labelEl.htmlFor = `param-${key}`;
    const value = document.createElement('span');
    value.className = VALUE_CLS;
    value.id = `val-${key}`;
    head.append(labelEl, value);
    wrap.append(head);
    return { wrap, value };
}

function rangeBlock(key, p, current) {
    const { wrap, value } = blockShell(key, p.label);
    const input = document.createElement('input');
    input.type = 'range';
    input.id = `param-${key}`;
    input.min = p.min;
    input.max = p.max;
    input.step = p.step;
    input.value = current;
    value.textContent = fmt(current, p.unit);
    wrap.appendChild(input);
    return { wrap, input, value };
}

function toggleBlock(key, p, current) {
    const wrap = document.createElement('label');
    wrap.className = 'flex items-center gap-2 text-sm cursor-pointer hover:text-sky-600 transition-colors';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.id = `param-${key}`;
    input.className = CHECK_CLS;
    input.checked = !!current;
    const span = document.createElement('span');
    span.className = 'font-medium tracking-wide';
    span.textContent = p.label;
    wrap.append(input, span);
    return { wrap, input };
}

function themeBlock(isDark, onChange) {
    const wrap = document.createElement('label');
    wrap.className = 'flex items-center gap-2 text-sm cursor-pointer hover:text-sky-600 transition-colors';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.id = 'toggle-theme';
    input.className = CHECK_CLS;
    input.checked = isDark;
    input.addEventListener('change', e => onChange(e.target.checked));
    const span = document.createElement('span');
    span.className = 'font-medium tracking-wide';
    span.textContent = 'Dark Mode';
    wrap.append(input, span);
    return { wrap, input };
}

function heading(text) {
    const el = document.createElement('div');
    el.className = HEADING_CLS;
    el.textContent = text;
    return el;
}

function modeButtonCls(active) {
    return 'flex-1 text-xs font-semibold py-1.5 px-2 rounded-md border transition-colors '
        + (active
            ? 'bg-sky-600 border-sky-600 text-white'
            : 'bg-white/70 border-gray-300 text-gray-600 hover:border-sky-400 '
                + 'dark:bg-zinc-800/70 dark:border-zinc-600 dark:text-zinc-300 '
                + 'dark:hover:border-sky-500');
}

// The controls bar is generated from each mounted model's parameter schema, so
// the viewer never hard-codes a specific model's sliders. A "group" is one
// preset's worth of models ({ id, models }); single mode renders the active
// group as one flat block, overlay mode renders every mounted group as an
// accordion so several presets can be tuned side by side.
function createPanel(opts) {
    const {
        body, model, groups = [], catalog = [], activeId, mode = 'single',
        onSelect, onToggle, onModeChange, onParamsChange, onThemeChange, onReset,
        themeIsDark = false
    } = opts;

    const titleEl = document.getElementById('model-name');
    const subEl = document.getElementById('model-sub');

    let currentMode = mode;
    let currentGroups = groups;
    let current = model;
    let activeId_ = activeId;

    let sections = [];
    let live = { selects: [], checks: [], buttons: [] };
    let busy = false;
    let themeInput = null;
    let liveTheme = themeIsDark;
    let lastSignature = null;

    body.textContent = '';

    const msg = document.createElement('p');
    msg.id = 'panel-msg';
    msg.className = 'hidden mb-3 text-[11px] leading-snug text-red-600 dark:text-red-400';
    body.appendChild(msg);

    const host = document.createElement('div');
    body.appendChild(host);

    function emit(partial, targets) {
        onParamsChange && onParamsChange(partial, targets);
    }

    function applyBusy() {
        for (const el of live.selects) el.disabled = busy;
        for (const el of live.checks) el.disabled = busy;
        for (const el of live.buttons) el.disabled = busy;
    }

    // One collapsible block of parameters for one preset. `targets` is the
    // preset's models, so a preset holding several objects is edited at once.
    function section(group, collapsible, open) {
        const key = group.id || 'active';
        const targets = (group.models || []).filter(Boolean);
        const schema = targets[0];

        let root, inner;
        if (collapsible) {
            root = document.createElement('details');
            root.className = 'mb-3 rounded-lg border '
                + 'border-gray-200 dark:border-zinc-700 bg-white/40 dark:bg-zinc-800/40';
            const summary = document.createElement('summary');
            summary.className = 'cursor-pointer select-none px-3 py-2 text-xs '
                + 'font-semibold text-gray-700 dark:text-zinc-200';
            summary.textContent = schema ? schema.name : group.id;
            inner = document.createElement('div');
            inner.className = 'px-3 pb-3';
            root.append(summary, inner);
            root.open = !!open;
        } else {
            root = document.createElement('div');
            inner = root;
        }

        const rows = {};
        const normalToggles = [];
        const advancedRanges = [];
        const advancedToggles = [];

        // Renders one control and wires it to `emit`, so the schema stays the
        // only source of truth for what the panel shows.
        const addRange = (k, p) => {
            const built = rangeBlock(`${key}-${k}`, p, schema.state[k]);
            built.input.addEventListener('input', e => {
                const v = parseFloat(e.target.value);
                built.value.textContent = fmt(v, p.unit);
                emit({ [k]: v }, targets);
            });
            rows[k] = built;
            return built.wrap;
        };
        const addToggle = (k, p) => {
            const built = toggleBlock(`${key}-${k}`, p, schema.state[k]);
            built.input.addEventListener('change', e => {
                emit({ [k]: e.target.checked }, targets);
            });
            rows[k] = built;
            return built.wrap;
        };

        if (schema && schema.params) {
            for (const [k, p] of Object.entries(schema.params)) {
                if (p.advanced) {
                    (p.type === 'range' ? advancedRanges : advancedToggles)
                        .push([k, p]);
                } else if (p.type === 'range') {
                    inner.appendChild(addRange(k, p));
                } else if (p.type === 'toggle') {
                    normalToggles.push([k, p]);
                }
            }
        }

        if (normalToggles.length) {
            const row = document.createElement('div');
            row.className = 'flex flex-wrap gap-4 pt-1';
            for (const [k, p] of normalToggles) row.appendChild(addToggle(k, p));
            inner.appendChild(row);
        }

        // Everything the panel shows must come from the schema; "advanced" is
        // just a flag on a param, not a separate hardcoded list.
        if (advancedRanges.length || advancedToggles.length) {
            const details = document.createElement('details');
            details.className = 'mt-2 rounded-md border border-dashed '
                + 'border-gray-300 dark:border-zinc-600';
            const summary = document.createElement('summary');
            summary.className = 'cursor-pointer select-none px-2 py-1.5 text-[11px] '
                + 'font-semibold uppercase tracking-wider text-gray-500 dark:text-zinc-400';
            summary.textContent = 'Advanced';
            const bodyEl = document.createElement('div');
            bodyEl.className = 'px-2 pb-2';
            for (const [k, p] of advancedRanges) bodyEl.appendChild(addRange(k, p));
            if (advancedToggles.length) {
                const row = document.createElement('div');
                row.className = 'flex flex-wrap gap-4 pt-1';
                for (const [k, p] of advancedToggles) row.appendChild(addToggle(k, p));
                bodyEl.appendChild(row);
            }
            details.append(summary, bodyEl);
            inner.appendChild(details);
        }

        const sec = { key, targets, rows, root };
        sections.push(sec);
        return root;
    }

    function modeBlock() {
        const wrap = document.createElement('div');
        wrap.className = 'mb-3';
        wrap.appendChild(heading('Display'));
        const row = document.createElement('div');
        row.className = 'flex gap-2';
        for (const [val, text] of [['single', 'One at a time'], ['overlay', 'All at once']]) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = text;
            btn.className = modeButtonCls(val === currentMode);
            btn.addEventListener('click', () => {
                if (val !== currentMode && onModeChange) onModeChange(val);
            });
            live.buttons.push(btn);
            row.appendChild(btn);
        }
        wrap.appendChild(row);
        return wrap;
    }

    function selectBlock() {
        const shell = blockShell('model', 'Model');
        shell.value.remove();
        const select = document.createElement('select');
        select.id = 'param-model';
        select.className = FIELD_CLS;
        for (const entry of catalog) {
            const opt = document.createElement('option');
            opt.value = entry.id;
            opt.textContent = entry.name;
            select.appendChild(opt);
        }
        select.value = activeId_ || (catalog[0] && catalog[0].id);
        select.addEventListener('change', e => onSelect && onSelect(e.target.value));
        shell.wrap.appendChild(select);
        live.selects.push(select);
        return shell.wrap;
    }

    // Which presets are mounted. In overlay mode this is how models get in and
    // out of the scene; the accordions below only appear for what is mounted.
    function pickerBlock() {
        const wrap = document.createElement('div');
        wrap.className = 'mb-3';
        wrap.appendChild(heading('Shown'));
        const list = document.createElement('div');
        list.className = 'flex flex-col gap-1';
        const shown = new Set(currentGroups.map(g => g.id));
        for (const entry of catalog) {
            const lab = document.createElement('label');
            lab.className = 'flex items-center gap-2 text-sm cursor-pointer '
                + 'hover:text-sky-600 transition-colors';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = CHECK_CLS;
            cb.checked = shown.has(entry.id);
            cb.addEventListener('change', e => onToggle && onToggle(entry.id, e.target.checked));
            const span = document.createElement('span');
            span.className = 'font-medium';
            span.textContent = entry.name;
            lab.append(cb, span);
            list.appendChild(lab);
            live.checks.push(cb);
        }
        wrap.appendChild(list);
        return wrap;
    }

    function themeFooter() {
        const footer = document.createElement('div');
        footer.className = 'flex items-center gap-4 pt-3 mt-1 border-t '
            + 'border-gray-200 dark:border-zinc-700';
        const theme = themeBlock(liveTheme, isDark => onThemeChange && onThemeChange(isDark));
        themeInput = theme.input;
        footer.appendChild(theme.wrap);

        if (onReset) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = 'Reset project';
            btn.title = 'Forget every saved setting and start from the defaults';
            btn.className = 'ml-auto text-[11px] px-2 py-1 rounded border '
                + 'border-gray-300 dark:border-zinc-600 text-gray-500 dark:text-zinc-400 '
                + 'hover:text-red-600 hover:border-red-400 transition-colors';
            btn.addEventListener('click', () => onReset());
            live.buttons.push(btn);
            footer.appendChild(btn);
        }
        return footer;
    }

    function signature() {
        return [
            currentMode,
            currentGroups.map(g => g.id).join(','),
            activeId_ || '',
            (current && current.name) || ''
        ].join('|');
    }

    function render() {
        host.textContent = '';
        sections = [];
        live = { selects: [], checks: [], buttons: [] };

        const overlay = currentMode === 'overlay';
        if (overlay || catalog.length > 1) host.appendChild(modeBlock());

        if (overlay) {
            if (catalog.length > 1) host.appendChild(pickerBlock());
            currentGroups.forEach((g, i) => host.appendChild(section(g, true, i === 0)));
        } else {
            if (catalog.length > 1) host.appendChild(selectBlock());
            if (currentGroups[0]) host.appendChild(section(currentGroups[0], false, true));
        }

        if (titleEl) titleEl.textContent = (current && current.name) || '';
        if (subEl) {
            subEl.textContent = overlay
