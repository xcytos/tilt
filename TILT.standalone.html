                    new THREE.Vector3().subVectors(d, a),
                    new THREE.Vector3().subVectors(b, a)).normalize();
                push(a, n); push(d, n); push(c, n);
                push(a, n); push(c, n); push(b, n);
            } else {
                const na = new THREE.Vector3()
                    .addScaledVector(fa.S, onrm[k][0])
                    .addScaledVector(fa.U, onrm[k][1]).normalize();
                const nb = new THREE.Vector3()
                    .addScaledVector(fa.S, onrm[k2][0])
                    .addScaledVector(fa.U, onrm[k2][1]).normalize();
                const n2 = new THREE.Vector3()
                    .addScaledVector(fb.S, onrm[k2][0])
                    .addScaledVector(fb.U, onrm[k2][1]).normalize();
                const n2a = new THREE.Vector3()
                    .addScaledVector(fb.S, onrm[k][0])
                    .addScaledVector(fb.U, onrm[k][1]).normalize();
                push(a, na); push(d, n2a); push(c, n2);
                push(a, na); push(c, n2); push(b, nb);
            }
        }
    }
    if (caps && frames.length > 1) {
        const contour = outline.map(p => new THREE.Vector2(p[0], p[1]));
        const tris = THREE.ShapeUtils.triangulateShape(contour, []);
        const capsSpec = [
            { f: frames[0], flip: false },       // start: outward = -T
            { f: frames[frames.length - 1], flip: true }  // end: outward = +T
        ];
        for (const { f, flip } of capsSpec) {
            const n = flip ? f.T.clone() : f.T.clone().negate();
            const ring = outline.map(o => at(f, o));
            for (const tri of tris) {
                const order = flip ? [tri[0], tri[2], tri[1]]
                    : [tri[0], tri[1], tri[2]];
                for (const idx of order) push(ring[idx], n);
            }
        }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position',
        new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrms, 3));
    return geo;
}

// The whole assembly from one route: frames, channel, neon, halo.
function stripAssembly(pathPts) {
    const { frames } = stripFrames(pathPts);
    const glowCircle = (() => {
        const r = STRIP_PROFILE.glow.r;
        const cu = STRIP_PROFILE.channel.t + STRIP_PROFILE.neon.h / 2;
        const out = [];
        for (let i = 0; i < 16; i++) {
            const a = (i / 16) * Math.PI * 2;
            out.push([Math.cos(a) * r, cu + Math.sin(a) * r]);
        }
        return out;
    })();
    return {
        frames,
        channel: sweepOutline(channelOutline(), frames,
            { flat: true, caps: true }),
        neon: sweepOutline(neonOutline(), frames,
            { flat: false, caps: true }),
        glow: sweepOutline(glowCircle, frames,
            { flat: false, caps: false })
    };
}


// The visible beam: not a solid cone, but light in haze. The shader fades
// the surface out at the silhouette (fresnel) and toward the mouth, so the
// cone has no hard edge - it reads as a glow around the real spotlight.
function createBeamMaterial() {
    return new THREE.ShaderMaterial({
        uniforms: {
            uColor: { value: new THREE.Color(0xffeecf) },
            uOpacity: { value: 0.15 },
            uLen: { value: 1 }
        },
        vertexShader: `
            uniform float uLen;
            varying float vT;
            varying vec3 vN, vV;
            void main() {
                vT = clamp(position.y / uLen, 0.0, 1.0);
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                vN = normalize(normalMatrix * normal);
                vV = normalize(-mv.xyz);
                gl_Position = projectionMatrix * mv;
            }`,
        fragmentShader: `
            uniform vec3 uColor;
            uniform float uOpacity;
            varying float vT;
            varying vec3 vN, vV;
            void main() {
                float fres = abs(dot(normalize(vN), normalize(vV)));
                float edge = pow(fres, 1.8);
                float axial = smoothstep(0.0, 0.12, vT) * (1.0 - 0.8 * vT);
                gl_FragColor = vec4(uColor, uOpacity * edge * axial);
            }`,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
    });
}

function createLightModel(type = 'light-par', initial = {}) {
    const kind = LIGHT_TYPES.includes(type) ? type.slice(6) : 'par';
    const regType = 'light-' + kind;
    const params = LIGHT_PARAMS[kind];

    const root = new THREE.Group();
    root.name = regType;

    const state = {};
    for (const k of Object.keys(params)) state[k] = params[k].value;
    Object.assign(state, initial);

    const matHousing = new THREE.MeshStandardMaterial({
        color: 0x141418, metalness: 0.65, roughness: 0.45
    });
    const matYoke = new THREE.MeshStandardMaterial({
        color: 0x2a2a30, metalness: 0.7, roughness: 0.4
    });
    const matLens = new THREE.MeshStandardMaterial({
        color: 0x0c0c10, emissive: 0xfff4e2, emissiveIntensity: 1,
        roughness: 0.3, metalness: 0
    });
    // The glow is a SEPARATE, optional shell around the physical neon -
    // additive and faint, so bloom never hides the profile's real shape.
    const matGlow = new THREE.MeshBasicMaterial({
        color: 0xfff4e2, transparent: true, opacity: 0.14,
        blending: THREE.AdditiveBlending, depthWrite: false
    });
    const matBeam = createBeamMaterial();

    let spot = null;
    let beam = null;
    // A real neon strip throws light onto whatever it grazes - the fabric
    // behind it, the stage under it. A few short-range points strung along
    // the tube fakes that throw without a wall of lights: three on a rail
    // strip, two on a straight one, all gated by the same power slider and
    // tinted by the same colour as the flex.
    let wash = [];
    const WASH_DIST = 9;
    const WASH_LUX = 9;   // per point, at full power
    let themeNow = 'light';
    // A strip on a stripline anchor rides its frame's own curve - the rail
    // serpentine or the hem - handed over in the fixture's local space by
    // the app on every re-place. null means a straight tube of `length`.
    let pathPts = null;
    let pathKey = '';

    const power01 = () => Math.max(0, Math.min(100, state.power)) / 100;

    // The fixture's own colour, from its two mixing sliders. Saturation 0 is
    // white; otherwise lightness eases down as saturation climbs so a deep
    // amber or purple still reads as light. The SAME tint colours the lens,
    // the visible beam and the real spotlight - what you see is what glows.
    function tintColor() {
        const s01 = Math.max(0, Math.min(100, state.sat)) / 100;
        const h = ((Number(state.hue) % 360) + 360) % 360;
        const l = 0.92 - 0.34 * s01;
        return new THREE.Color().setHSL(h / 360, s01, l, THREE.SRGBColorSpace);
    }

    function applyGlow() {
        const tint = tintColor();
        matLens.emissive.copy(tint);
        matGlow.color.copy(tint);
        matBeam.uniforms.uColor.value.copy(tint);
        if (spot) spot.color.copy(tint);
        matLens.emissiveIntensity = power01() * LIGHT_THEME[themeNow].glow;
        matGlow.opacity = power01() * (themeNow === 'dark' ? 0.22 : 0.14);
        for (const l of wash) {
            l.color.copy(tint);
            l.intensity = power01() * WASH_LUX;
        }
        if (spot) spot.intensity = power01() * SPOT_BASE[kind];
        if (beam) {
            beam.visible = power01() > 0;
            matBeam.uniforms.uOpacity.value = power01() * 0.14;
        }
    }

    // Shared yoke: two clevis arms and a bridge the head pivots between.
    // The head aims along -Z; tilt 0 is horizontal, +90 is straight down,
    // -90 straight up (floor uplights).
    function buildYoke() {
        const panG = new THREE.Group();
        panG.position.y = 0.2;
        panG.rotation.y = state.pan * LIGHT_DEG;
        for (const s of [-1, 1]) {
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.34, 0.07), matYoke);
            arm.position.set(s * 0.17, 0.17, 0);
            panG.add(arm);
        }
        const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.375, 0.035, 0.07), matYoke);
        bridge.position.y = 0.357;
        panG.add(bridge);

        const tiltG = new THREE.Group();
        tiltG.position.y = 0.17;
        tiltG.rotation.x = -state.tilt * LIGHT_DEG;
        panG.add(tiltG);
        return { panG, tiltG };
    }

    // The real light: one SpotLight, no shadow, decay 0 so the dimmer
    // reads predictably at any throw distance. The 12 ft cutoff fades the
    // beam out just past the 8 ft curtain top - no spill onto guests or
    // scenery beyond the wall the fixture was aimed at.
    function addSpot(tiltG, halfAngleRad) {
        spot = new THREE.SpotLight(0xfff2dd, 0, 12, halfAngleRad, 0.35, 0);
        spot.position.set(0, 0, -0.2);
        spot.castShadow = false;
        const target = new THREE.Object3D();
        target.position.set(0, 0, -4);
        spot.target = target;
        tiltG.add(spot, target);
    }

    function clearRoot() {
        for (const o of [...root.children]) {
            o.traverse(c => { if (c.isMesh) c.geometry.dispose(); });
            root.remove(o);
        }
        spot = null;
        beam = null;
        wash = [];
    }

    // String the wash points along the tube: local positions in, point
    // lights out - dim and short-throw, so neighbours only ever catch a
    // grazing spill like real flex does.
    function buildWash(points) {
        for (const p of points) {
            const l = new THREE.PointLight(0xffffff, 0, WASH_DIST, 2);
            l.position.set(p.x, p.y, p.z);
            root.add(l);
            wash.push(l);
        }
    }

    function build() {
        clearRoot();

        // A strip riding the frame's own curve IS its mounting assembly:
        // the extruded channel replaces the floor flange and spigot
        // entirely. Everything else keeps the universal anchor mount -
        // flange + spigot at the anchor point (pole top, rail, floor
        // plate); the fixture only knows its own local frame, +Y up,
        // aiming along -Z.
        const onRail = kind === 'strip' && !!pathPts && pathPts.length >= 2;
        if (!onRail) {
            const flange = new THREE.Mesh(
                new THREE.CylinderGeometry(0.13, 0.15, 0.04, 16), matHousing);
            flange.position.y = 0.02;
            const spigot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.05, 0.05, 0.16, 12), matHousing);
            spigot.position.y = 0.12;
            root.add(flange, spigot);
        }

        if (kind === 'strip') {
            if (onRail) {
                // The full neon-flex assembly, continuous end to end from
                // the one S-curve route: low-profile U-channel, rounded
                // emissive flex seated inside and rising clear of the rim,
                // faint halo shell - all swept on the same upright frames.
                const asm = stripAssembly(pathPts);
                const channel = new THREE.Mesh(asm.channel, matHousing);
                const neon = new THREE.Mesh(asm.neon, matLens);
                const glow = new THREE.Mesh(asm.glow, matGlow);
                glow.renderOrder = 1;
                root.add(channel, neon, glow);
                // The throw: points at the third, middle and two-thirds
                // marks of the route, riding the same frames as the flex.
                const last = asm.frames.length - 1;
                buildWash([0.18, 0.5, 0.82]
                    .map(t => asm.frames[Math.round(last * t)].p));
            } else {
                // Linear tube hanging below the mount; emissive face on the
                // underside. No pan/tilt - its orientation comes from the rail.
                const stem = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.14, 0.05), matHousing);
                stem.position.y = -0.07;
                const len = state.length;
                const tube = new THREE.Mesh(new THREE.BoxGeometry(len, 0.1, 0.12), matHousing);
                tube.position.y = -0.2;
                const face = new THREE.Mesh(new THREE.BoxGeometry(len * 0.96, 0.035, 0.07), matLens);
                face.position.y = -0.262;
                root.add(stem, tube, face);
                buildWash([{ x: -len * 0.28, y: -0.25, z: 0 },
                    { x: len * 0.28, y: -0.25, z: 0 }]);
            }
        } else if (kind === 'par') {
            const { panG, tiltG } = buildYoke();
            root.add(panG);
            // The can: cylinder turned so its axis runs along Z, flared
            // end (the lens) forward at -Z.
            const can = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.17, 0.36, 24), matHousing);
            can.rotation.x = Math.PI / 2;
            tiltG.add(can);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.02, 8, 24), matYoke);
            ring.position.z = -0.185;
            tiltG.add(ring);
            const face = new THREE.Mesh(new THREE.CircleGeometry(0.14, 24), matLens);
            face.position.z = -0.184;
            face.rotation.y = Math.PI;
            tiltG.add(face);

            addSpot(tiltG, (state.focus / 2) * LIGHT_DEG);

            // Visible beam cone: tip at the lens, mouth toward the aim,
            // radius grown to the focus angle over a 6.5 ft throw - it tops
            // out just under the 8 ft curtain rail instead of poking out.
            const len = 6.5;
            const r = Math.tan((state.focus / 2) * LIGHT_DEG) * len;
            const geo = new THREE.CylinderGeometry(r, 0.001, len, 24, 1, true);
            geo.translate(0, len / 2, 0);
            matBeam.uniforms.uLen.value = len;
            beam = new THREE.Mesh(geo, matBeam);
            beam.rotation.x = -Math.PI / 2;
            beam.position.z = -0.19;
            // The glow is 6.5 ft long; if it entered the preview camera's
            // framing box the fixture itself would shrink to a speck.
            // Previews fit the housing and let the beam run out of frame.
            beam.userData.noFraming = true;
            tiltG.add(beam);
        } else { // led: flat wash panel on the same yoke
            const { panG, tiltG } = buildYoke();
            root.add(panG);
            const panel = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.46, 0.07), matHousing);
            tiltG.add(panel);
            const dotGeo = new THREE.PlaneGeometry(0.08, 0.08);
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 5; c++) {
                    const dot = new THREE.Mesh(dotGeo, matLens);
                    dot.position.set(-0.24 + c * 0.12, 0.14 - r * 0.14, -0.037);
                    dot.rotation.y = Math.PI;
                    tiltG.add(dot);
                }
            }
            addSpot(tiltG, (state.wash / 2) * LIGHT_DEG);
        }

        applyGlow();
        model.dirty = false;
    }

    function setTheme(isDark) {
        themeNow = isDark ? 'dark' : 'light';
        const t = LIGHT_THEME[themeNow];
        matHousing.envMapIntensity = t.env;
        matYoke.envMapIntensity = t.env;
        matLens.envMapIntensity = t.env;
        applyGlow();
    }

    function dispose() {
        root.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
        root.clear();
        spot = null;
        beam = null;
        [matHousing, matYoke, matLens, matBeam, matGlow].forEach(m => m.dispose());
    }

    const model = {
        id: regType,
        name: LIGHT_NAMES[regType],
        subtitle: 'Stage light',
        object3D: root,
        params,
        state,
        dirty: true,
        build,
        setTheme,
        setParams(partial) {
            Object.assign(state, partial);
            model.dirty = true;
        },
        // The frame's rail (or hem) polyline for this strip, in the
        // fixture's own local space. Rebuilds at once when it changes so
        // a Swing Pan drag redraws the tube in the same frame, not the
        // next one.
        setPath(pts) {
            const next = Array.isArray(pts) && pts.length >= 2 ? pts : null;
            const key = next
                ? next.map(p => `${p.x},${p.y},${p.z}`).join(';') : '';
            if (key === pathKey) return false;
            pathKey = key;
            pathPts = next;
            build();
            return true;
        },
        dispose
    };

    build();
    return model;
}

// ---- js/viewer.js ----
const FLOOR_SIZE = 200;
const GRID_CELLS = 100;

const THEME = {
    light: { bg: 0xf3f4f6, ambient: 0.8, key: 1.5, floorEnv: 0.1 },
    dark:  { bg: 0x18181b, ambient: 0.4, key: 2.0, floorEnv: 0.05 }
};

const FRAME_DIR = new THREE.Vector3(0, 4, -25).normalize();

// Breathing room between side-by-side models in "all at once" mode.
const OVERLAY_GAP = 2.5;

const FALLBACK_BOUNDS =
    new THREE.Box3(new THREE.Vector3(-6, 0, -6), new THREE.Vector3(6, 9, 6));

// Pure. Takes world spans ([minX, maxX]) measured with every model back at its
// base position and returns the X offset each one needs: packs them left to
// right with `gap` between neighbours, then shifts the whole row so its centre
// lands on the origin. A lone span comes back as a plain re-centring, so the
// single-model view keeps framing exactly as it did before overlay mode.
function layoutOffsets(spans, gap = OVERLAY_GAP) {
    const offs = [];
    let cursor = 0;
    for (const span of spans) {
        const min = span[0], max = span[1];
        if (!(max > min)) { offs.push(0); continue; }
        offs.push(cursor - min);
        cursor += max - min + gap;
    }
    const back = -Math.max(0, cursor - gap) / 2;
    return offs.map(o => o + back);
}

// The grid is baked into the floor texture instead of drawn as separate lines.
// LineBasicMaterial cannot receive shadows, so standalone lines stayed bright
// inside a shadow and glared against the darkened floor.
function makeFloorTexture(base, line, anisotropy) {
    const S = 64;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = base;
    g.fillRect(0, 0, S, S);
    g.strokeStyle = line;
    g.lineWidth = 3;
    g.strokeRect(0, 0, S, S);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(GRID_CELLS, GRID_CELLS);
    tex.anisotropy = anisotropy;
    return tex;
}

function failBoot(message) {
    if (window.__bootFail) clearTimeout(window.__bootFail);
    const box = document.getElementById('boot');
    const msg = document.getElementById('boot-msg');
    if (msg) msg.textContent = message;
    if (box) box.classList.add('failed');
}

// Fit `bounds` into the viewport along the fixed view bearing. Deriving the
// distance from the real bounds and the current aspect keeps the whole scene
// visible on portrait phones, where a fixed camera position crops it badly.
function frameCamera(camera, controls, bounds) {
    const center = bounds.getCenter(new THREE.Vector3());
    const half = bounds.getSize(new THREE.Vector3()).multiplyScalar(0.5);

    const zAxis = FRAME_DIR.clone();
    const xAxis = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), zAxis).normalize();
    const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();
    const extent = v => Math.abs(v.x) * half.x + Math.abs(v.y) * half.y + Math.abs(v.z) * half.z;

    const vHalf = THREE.MathUtils.degToRad(camera.fov) / 2;
    const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
    const dist = Math.max(extent(xAxis) / Math.tan(hHalf),
                          extent(yAxis) / Math.tan(vHalf))
               + extent(zAxis);

    controls.target.copy(center);
    camera.position.copy(center).addScaledVector(FRAME_DIR, dist * 1.12);
    camera.updateProjectionMatrix();
    controls.update();
}

class Viewer {
    constructor(container) {
        this.container = container;
        this.models = [];
        this.isDark = false;
        this.onFirstRender = null;
        this._booted = false;
        this._framedAspect = window.innerWidth / window.innerHeight;

        this.scene = new THREE.Scene();
        this._bgColor = new THREE.Color(THEME.light.bg);
        this.scene.background = this._bgColor;
        this.sceneId = null;

        this.camera = new THREE.PerspectiveCamera(
            45, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.set(0, 8, -25);

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({ antialias: true });
        } catch (err) {
            failBoot('WebGL is not available in this browser');
            throw err;
        }
        this.renderer = renderer;
        this.resize();
        this._framedAspect = this.camera.aspect;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Image based lighting, otherwise metalness reads as flat black
        const pmrem = new THREE.PMREMGenerator(renderer);
        const roomEnv = new RoomEnvironment(renderer);
        this.scene.environment = pmrem.fromScene(roomEnv, 0.04).texture;
        roomEnv.dispose();
        pmrem.dispose();

        this.controls = new OrbitControls(this.camera, renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.target.set(0, 4, 0);
        this.controls.maxPolarAngle = Math.PI / 2 - 0.05;

        this.ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        this.scene.add(this.ambientLight);

        this.mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        this.mainLight.position.set(15, 25, -20);
        this.mainLight.castShadow = true;
        this.mainLight.shadow.mapSize.width = 2048;
        this.mainLight.shadow.mapSize.height = 2048;
        // Wide enough to cover the biggest room the stage-size formula
        // builds (walls at +-80 ft), tight near/far for depth precision,
        // bias so big flat walls don't acne at the coarser texels.
        this.mainLight.shadow.camera.left = -80;
        this.mainLight.shadow.camera.right = 80;
        this.mainLight.shadow.camera.top = 80;
        this.mainLight.shadow.camera.bottom = -80;
        this.mainLight.shadow.camera.near = 2;
        this.mainLight.shadow.camera.far = 200;
        this.mainLight.shadow.normalBias = 0.1;
        this.mainLight.shadow.bias = -0.0004;
        this.scene.add(this.mainLight);

        this.fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        this.fillLight.position.set(-15, 10, 20);
        this.scene.add(this.fillLight);

        const aniso = renderer.capabilities.getMaxAnisotropy();
        this.floorTex = {
            light: makeFloorTexture('#e5e7eb', '#c7ccd3', aniso),
            dark:  makeFloorTexture('#27272a', '#46464e', aniso)
        };
        this.matFloor = new THREE.MeshStandardMaterial({
            color: 0xffffff, roughness: 1, envMapIntensity: 0.1, map: this.floorTex.light
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_SIZE, FLOOR_SIZE), this.matFloor);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        this.floor = floor;
        this.scene.add(floor);

        // The world around the models: ground, walls, sky and the extra
        // lights that make a room a room. The studio scene adds nothing and
        // keeps the grid floor above as it always was.
        this.rig = new SceneRig();
        this.scene.add(this.rig.group);
        this.setScene(DEFAULT_SCENE);

        // The canvas fills its container, not the window: on a phone the
        // control sheet takes the bottom of the screen and the render target
        // has to follow it. Window events still drive the reframe, since only
        // a real window change should re-aim the camera.
        this._onResize = () => {
            const aspect = this.resize();
            if (Math.abs(aspect - this._framedAspect) > this._framedAspect * 0.3) {
                this._framedAspect = aspect;
                this.frameScene();
            }
        };
        window.addEventListener('resize', this._onResize);

        this._watchBox = null;
        if (typeof ResizeObserver === 'function') {
            this._watchBox = new ResizeObserver(() => this.resize());
            this._watchBox.observe(container);
        }

        this._raf = 0;
        this._tick = () => {
            this._raf = requestAnimationFrame(this._tick);
            this.controls.update();
            this.renderer.render(this.scene, this.camera);

            if (!this._booted) {
                this._booted = true;
                if (window.__bootFail) clearTimeout(window.__bootFail);
                const boot = document.getElementById('boot');
                if (boot) {
                    boot.classList.add('hidden');
                    setTimeout(() => boot.remove(), 500);
                }
                if (this.onFirstRender) this.onFirstRender();
            }
        };
    }

    // Mounting is decoupled from framing: overlay mode adds several models
    // and frames once, after layoutGroups has positioned them.
    addModel(model) {
        this.scene.add(model.object3D);
        // Every mounted model lives in the key light's shadow the same way
        // the room does: cast and receive, unless the mesh opts out. Light
        // fixtures, flower panels and greenery never set the flags in
        // their own builders, so they used to float shadowless on stage.
        model.object3D.traverse((o) => {
            if (!(o.isMesh || o.isInstancedMesh)) return;
            if (o.userData && o.userData.noShadow) return;
            o.castShadow = true;
            o.receiveShadow = true;
        });
        this.models.push(model);
        if (model.setTheme) model.setTheme(this.isDark);
        return model;
    }

    removeModel(model) {
        const i = this.models.indexOf(model);
        if (i < 0) return false;
        this.models.splice(i, 1);
        this.scene.remove(model.object3D);
        if (model.dispose) model.dispose();
        return true;
    }

    clearModels() {
        while (this.models.length) this.removeModel(this.models[0]);
    }

    setTheme(isDark) {
        this.isDark = isDark;
        document.documentElement.classList.toggle('dark', isDark);
        this._setEnv();
        for (const m of this.models) if (m.setTheme) m.setTheme(isDark);
    }

    // The world the models stand in is sized by the models: every mesh's
    // world bounding box unions into one footprint, and the stage grows to
    // hold it (with aisles). Studio adds nothing - it has no stage.
    stageFootprint() {
        const box = new THREE.Box3();
        const tmp = new THREE.Box3();
        let any = false;
        for (const m of this.models) {
            if (!m.object3D || !m.object3D.visible) continue;
            // Placements land on object3D between renders, so the cached
            // matrices can be a frame stale - refresh the chain first.
            m.object3D.updateWorldMatrix(true, true);
            tmp.setFromObject(m.object3D);
            if (tmp.isEmpty()) continue;
            box.union(tmp);
            any = true;
        }
        return any ? box : null;
    }

    // The size the current contents ask for. Quantized inside
    // computeStageSize, so tiny jitter never counts as a change.
    _stageSizeFor() {
        if (this.sceneId === 'studio') return null;
        const box = this.stageFootprint();
        return box ? computeStageSize({
            minX: box.min.x, maxX: box.max.x,
            minZ: box.min.z, maxZ: box.max.z
        }) : Object.assign({}, DEFAULT_STAGE_SIZE);
    }

    static _sizeKey(size) {
        return size ? `${size.w}x${size.d}/${size.wallX},${size.wallZ},${size.wallH}` : 'studio';
    }

    // Re-fit the room to whatever now stands on the stage - after a move,
    // an add, a SET switch or a load. Returns true when the room rebuilt.
    refreshStageSize() {
        if (this.sceneId === 'studio') return false;
        const size = this._stageSizeFor();
        if (Viewer._sizeKey(size) === this._stageKey) return false;
        this._stageKey = Viewer._sizeKey(size);
        this.rig.build(this.sceneId, size);
        this._setEnv();
        return true;
    }

    // Swap the world the models stand in. Unknown ids fall back to the
    // studio, so a hand-edited project can never leave an empty scene.
    setScene(id) {
        const next = isScene(id) ? id : DEFAULT_SCENE;
        if (next === this.sceneId) return next;
        this.sceneId = next;
        const size = next === 'studio' ? null : this._stageSizeFor();
        this._stageKey = Viewer._sizeKey(size);
        this.rig.build(next, size);
        this._setEnv();
        return next;
    }

    // Point the fixed lights, floor and background at whatever the current
    // scene asks for. Studio is driven by the light/dark toggle instead of a
    // scene definition, which is exactly the behaviour it had before scenes
    // existed.
    _setEnv() {
        const studio = this.sceneId === 'studio' || !this.rig.settings;
        this.floor.visible = studio;

        if (studio) {
            const t = this.isDark ? THEME.dark : THEME.light;
            // Studio keeps the exact response it always had.
            this.renderer.toneMapping = THREE.NoToneMapping;
            if (this._shadowBox) this._shadowBox.visible = false;
            this.scene.background = this._bgColor.setHex(t.bg);
            this.scene.fog = null;
            this.matFloor.map = this.floorTex[this.isDark ? 'dark' : 'light'];
            this.matFloor.color.setHex(0xffffff);
            this.matFloor.roughness = 1;
            this.matFloor.envMapIntensity = t.floorEnv;
            this.ambientLight.color.setHex(0xffffff);
            this.ambientLight.intensity = t.ambient;
            this.mainLight.color.setHex(0xffffff);
            this.mainLight.intensity = t.key;
            this.fillLight.color.setHex(0xffffff);
            this.fillLight.intensity = 0.5;
            return;
        }

        const s = this.rig.settings;
        // Rooms clip without help: white walls plus a stack of lamps
        // flatten to paper. Filmic curve keeps the highlights honest -
        // sconces and downlights glow instead of blowing out.
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.12;
        this.scene.background = s.background;
        this.scene.fog = s.fog ? new THREE.Fog(s.fog.color, s.fog.near, s.fog.far) : null;
        this.ambientLight.color.setHex(s.ambient.color);
        this.ambientLight.intensity = s.ambient.intensity;
        this.mainLight.color.setHex(s.key.color);
        this.mainLight.intensity = s.key.intensity;
        this.fillLight.color.setHex(s.fill.color);
        this.fillLight.intensity = s.fill.intensity;
    }

    // Shadow debugging for the Look shelf. "Shadows sometimes vanish" is
    // almost never the renderer - it is furniture stepped outside the key
    // light's ortho box, so the counts below separate the two cases.
    shadowInfo() {
        const L = this.mainLight;
        const cam = L.shadow.camera;
        const dir = new THREE.Vector3()
            .subVectors(L.target.position, L.position).normalize();
        const seed = Math.abs(dir.y) > 0.99
            ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
        const right = new THREE.Vector3().crossVectors(seed, dir).normalize();
        const up = new THREE.Vector3().crossVectors(dir, right).normalize();
        let meshes = 0, casters = 0, receivers = 0, outside = 0;
        const p = new THREE.Vector3();
        this.scene.traverse((o) => {
            if (!(o.isMesh || o.isInstancedMesh) || !o.visible) return;
            meshes++;
            if (o.castShadow) casters++;
            if (o.receiveShadow) receivers++;
            o.getWorldPosition(p).sub(L.position);
            const x = p.dot(right), y = p.dot(up), z = p.dot(dir);
            if (Math.abs(x) > cam.right + 1 || Math.abs(y) > cam.top + 1
                || z < cam.near || z > cam.far) outside++;
        });
        return {
            enabled: this.renderer.shadowMap.enabled,
            boxVisible: !!(this._shadowBox && this._shadowBox.visible),
            meshes, casters, receivers, outside,
            box: `${Math.round(cam.right - cam.left)}x`
                + `${Math.round(cam.top - cam.bottom)}x`
                + `${Math.round(cam.far - cam.near)}`
        };
    }

    // Toggling shadowMap.enabled needs every material recompiled, or the
    // old lighting programs keep running with stale defines.
    setShadowsEnabled(on) {
        this.renderer.shadowMap.enabled = !!on;
        this.scene.traverse((o) => {
            if (!(o.isMesh || o.isInstancedMesh)) return;
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of mats) if (m) m.needsUpdate = true;
        });
    }

    // Wireframe of the key light's shadow frustum, so a camera orbit
    // shows exactly which tables sit inside the box and which do not.
    setShadowBoxVisible(on) {
        if (on && !this._shadowBox) {
            const L = this.mainLight;
            const cam = L.shadow.camera;
            const dir = new THREE.Vector3()
                .subVectors(L.target.position, L.position).normalize();
            const seed = Math.abs(dir.y) > 0.99
                ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(0, 1, 0);
            const right = new THREE.Vector3().crossVectors(seed, dir).normalize();
            const up = new THREE.Vector3().crossVectors(dir, right).normalize();
            const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(
                cam.right - cam.left, cam.top - cam.bottom, cam.far - cam.near));
            const box = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
                color: 0x38bdf8, transparent: true, opacity: 0.85, depthTest: false
            }));
            box.renderOrder = 999;
            box.quaternion.setFromRotationMatrix(
                new THREE.Matrix4().makeBasis(right, up, dir));
            box.position.copy(L.position)
                .addScaledVector(dir, cam.near + (cam.far - cam.near) / 2);
            this._shadowBox = box;
            this.scene.add(box);
        }
        if (this._shadowBox) this._shadowBox.visible = !!on;
    }

    // Match the camera and the drawing buffer to whatever box the canvas
    // currently occupies. Never reframes: the sheet opening and closing must
    // not throw the camera back to its default aim.
    resize() {
        const w = this.container.clientWidth || window.innerWidth;
        const h = this.container.clientHeight || window.innerHeight;
        if (!w || !h) return this.camera.aspect;
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(w, h);
        return this.camera.aspect;
    }

    // World bounds of a set of models, before any overlay offset is applied.
    computeBoundsOf(models) {
        const box = new THREE.Box3();
        const tmp = new THREE.Box3();
        for (const m of models) {
            if (!m.object3D) continue;
            tmp.setFromObject(m.object3D);
            if (!tmp.isEmpty()) box.union(tmp);
        }
        return box;
    }

    computeBounds() {
        const box = this.computeBoundsOf(this.models);
        if (box.isEmpty()) return FALLBACK_BOUNDS.clone();
        return box;
    }

    // `groups` is an array of model arrays (one per preset). Spacing is derived
    // from each group's own bounds so presets never overlap, and the row is
    // re-centred. Only X is touched: the floor stays a single shared stage.
    layoutGroups(groups, gap = OVERLAY_GAP) {
        for (const g of groups) {
            for (const m of g) {
                if (!m.object3D) continue;
                m.object3D.position.x -= m.layoutX || 0;
                m.layoutX = 0;
            }
        }
        const spans = groups.map(g => {
            const b = this.computeBoundsOf(g);
            return b.isEmpty() ? [0, 0] : [b.min.x, b.max.x];
        });
        const offs = layoutOffsets(spans, gap);
        groups.forEach((g, i) => {
            for (const m of g) {
                if (!m.object3D) continue;
                m.object3D.position.x += offs[i];
                m.layoutX = offs[i];
            }
        });
        return offs;
    }

    frameScene(bounds = this.computeBounds()) {
        frameCamera(this.camera, this.controls, bounds);
    }

    // Where the camera was left, as plain arrays so the value survives JSON.
    // Restored views must not fight damping, so setCameraState writes the
    // controls directly rather than animating.
    getCameraState() {
        const p = this.camera.position;
        const t = this.controls.target;
        return {
            position: [p.x, p.y, p.z],
            target: [t.x, t.y, t.z]
        };
    }

    setCameraState(state) {
        if (!state) return false;
        const set = (vec, values) => {
            if (!Array.isArray(values) || values.length !== 3) return false;
            if (!values.every(v => typeof v === 'number' && Number.isFinite(v))) return false;
            vec.set(values[0], values[1], values[2]);
            return true;
        };
        const moved = set(this.camera.position, state.position);
        const aimed = set(this.controls.target, state.target);
        if (moved || aimed) {
            this.camera.updateProjectionMatrix();
            this.controls.update();
        }
        return moved || aimed;
    }

    // A 480px JPEG of the current frame, for the project list. The renderer
    // runs without preserveDrawingBuffer, so the canvas can only be read in
    // the same tick as a render - render here, then draw immediately.
    captureThumbnail(maxEdge = 480, quality = 0.72) {
        this.renderer.render(this.scene, this.camera);
        const source = this.renderer.domElement;
        const edge = Math.max(source.width, source.height) || 1;
        const scale = Math.min(1, maxEdge / edge);
        const w = Math.max(1, Math.round(source.width * scale));
        const h = Math.max(1, Math.round(source.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(source, 0, 0, w, h);
        return canvas.toDataURL('image/jpeg', quality);
    }

    start() {
        if (!this._raf) this._tick();
    }

    stop() {
        if (this._raf) cancelAnimationFrame(this._raf);
        this._raf = 0;
    }

    dispose() {
        this.stop();
        window.removeEventListener('resize', this._onResize);
        if (this._watchBox) this._watchBox.disconnect();
        this.clearModels();
        this.rig.dispose();
        this.scene.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
        [this.matFloor].forEach(m => m.dispose());
        this.renderer.dispose();
        if (this.renderer.domElement.parentNode) {
            this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);
        }
    }
}

// ---- js/panel.js ----
const LABEL_CLS = 'font-semibold text-gray-600 dark:text-zinc-300';
const VALUE_CLS = 'text-sky-600 dark:text-sky-400 font-mono';
const CHECK_CLS = 'custom-checkbox';
const HEADING_CLS = 'text-xs font-semibold text-gray-600 dark:text-zinc-300 mb-1';

const fmt = (value, unit) =>
    (typeof value === 'number' ? parseFloat(value.toFixed(2)) : value) + (unit || '');

// Lobe lean angle: how far a lobe's rail segment is turned by its gap.
// tan(lean) = (2 · gap · lobes) / railLen - the vertical excursion over
// the along-rail run of one lobe. 45° at the defaults (1 ft gap, 6 lobes,
// 12 ft rail).
const lobeLeanDeg = (gap, lobes, railLen) =>
    Math.round(Math.atan(2 * gap * (lobes || 6) / (railLen || 12)) * 180 / Math.PI);
const lobeGapText = (gap, lobes, meta) =>
    `${fmt(gap, meta.unit)} · ${lobeLeanDeg(gap, lobes, meta.railLen)}°`;

function blockShell(key, label, compact) {
    const wrap = document.createElement('div');
    wrap.className = compact ? 'mb-1.5' : 'mb-3';
    const head = document.createElement('div');
    head.className = compact
        ? 'flex justify-between text-[11px] mb-0.5'
        : 'flex justify-between text-xs mb-1';
    const labelEl = document.createElement('label');
    labelEl.className = LABEL_CLS;
    labelEl.textContent = label;
    labelEl.htmlFor = `param-${key}`;
    const value = document.createElement('span');
    value.className = VALUE_CLS;
    value.id = `val-${key}`;
    head.append(labelEl, value);
    wrap.append(head);
    return { wrap, value };
}

function rangeBlock(key, p, current, compact) {
    const { wrap, value } = blockShell(key, p.label, compact);
    const input = document.createElement('input');
    input.type = 'range';
    input.id = `param-${key}`;
    input.min = p.min;
    input.max = p.max;
    input.step = p.step;
    input.value = current;
    input.className = 'w-full h-5 accent-sky-500 cursor-pointer';
    value.textContent = fmt(current, p.unit);
    wrap.appendChild(input);
    return { wrap, input, value };
}

// One placement slider: X, Depth or Turn as a full-width track - modern,
// thumb-sized, and it updates the stage while the finger moves.
function placeRangeBlock(key, label, prop, value, min, max, step, unit) {
    const wrap = document.createElement('div');
    wrap.className = 'mb-1.5';
    const head = document.createElement('div');
    head.className = 'flex justify-between text-[11px] mb-0.5';
    const labelEl = document.createElement('label');
    labelEl.className = LABEL_CLS + ' text-[11px]';
    labelEl.textContent = label;
    labelEl.htmlFor = `param-${key}`;
    const val = document.createElement('span');
    val.className = VALUE_CLS + ' text-[11px]';
    val.textContent = fmt(value, unit);
    head.append(labelEl, val);
    const input = document.createElement('input');
    input.type = 'range';
    input.id = `param-${key}`;
    input.min = String(min);
    input.max = String(max);
    input.step = String(step);
    input.value = String(Math.round(value * 100) / 100);
    input.className = 'w-full h-5 accent-sky-500 cursor-pointer';
    wrap.append(head, input);
    return { wrap, input, value: val, head, label: labelEl };
}

function toggleBlock(key, p, current) {
    const wrap = document.createElement('label');
    wrap.className = 'flex items-center gap-2 text-sm cursor-pointer hover:text-sky-600 transition-colors';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.id = `param-${key}`;
    input.className = CHECK_CLS;
    input.checked = !!current;
    const span = document.createElement('span');
    span.className = 'font-medium tracking-wide';
    span.textContent = p.label;
    wrap.append(input, span);
    return { wrap, input };
}

function heading(text) {
    const el = document.createElement('div');
    el.className = HEADING_CLS;
    el.textContent = text;
    return el;
}

function modeButtonCls(active) {
    return 'flex-1 text-xs font-semibold py-1.5 px-2 rounded-md border transition-colors '
        + (active
            ? 'bg-sky-600 border-sky-600 text-white'
            : 'bg-white/70 border-gray-300 text-gray-600 hover:border-sky-400 '
                + 'dark:bg-zinc-800/70 dark:border-zinc-600 dark:text-zinc-300 '
                + 'dark:hover:border-sky-500');
}

// The controls bar is generated from each mounted model's parameter schema, so
// the viewer never hard-codes a specific model's sliders. A "group" is one
// preset's worth of models ({ id, models }); single mode renders the active
// group as one flat block, overlay mode renders every mounted group as an
// accordion so several presets can be tuned side by side.
function createPanel(opts) {
    const {
        body, model, groups = [], catalog = [], activeId, mode = 'single',
        scenes = [], scene = null, sets = [], set = null,
        framePillars = {}, frameElements = {}, frameAnchors = {}, places = {},
        frameSpacing = {},
        colorways = [], colorway = '', fabricColor = null,
        recipes = [], recipe = '',
        onSelect, onToggle, onModeChange, onParamsChange,
        onSceneChange, onColorwayChange, onRgbChange, onAddColor, onRecipeChange,
        onSetChange, onFramePillarsChange,
        onElementAdd, onElementRemove, onElementPatch, onElementCount,
        onFrameSpacing,
        onPlaceChange,
        onFoldChange,
        onFlowerMount, onFlowerOpenStudio, onFlowerQualityChange,
        shadowInfo, onShadowToggle, onShadowBoxToggle,
        onShelfChange, themeIsDark = false,
        folds = []
    } = opts;

    // Flower arrangements are authored in the Studio's own library; the panel
    // lists them so a tap mounts one into the scene. Kept mutable so the list
    // can be refreshed (Studio save / BroadcastChannel) without a full rebuild.
    let flowerList = Array.isArray(opts.flowerArrangements) ? opts.flowerArrangements : [];
    // Panels already mounted in the scene, with their placement - the shelf
    // shows these so a finger can move, turn or remove each one. Refreshed
    // structurally (mount / remove) via setMountedFlowers.
    let mountedFlowers = Array.isArray(opts.flowerMounted) ? opts.flowerMounted : [];
    // Scene-wide flower quality level; the chip's segmented control reads this and
    // app.js pushes changes through setFlowerQuality() so the active state follows.
    let flowerQuality = opts.flowerQuality || 'medium';

    const titleEl = document.getElementById('model-name');
    const subEl = document.getElementById('model-sub');
    const shelfEl = document.getElementById('shelf');
    const shelfClose = document.getElementById('btn-shelf-close');
    // The shelf slides down out of the way; the toolbar stays put - and a
    // tap on the canvas or the Tools chip brings it back.
    const setShelfOpen = open => {
        if (shelfEl) shelfEl.classList.toggle('closed', !open);
        // The canvas gives up the dock's space while the shelf is up, and
        // takes it back the moment it drops.
        onShelfChange && onShelfChange(open);
    };
    if (shelfClose) {
        shelfClose.addEventListener('click', () => setShelfOpen(false));
    }
    const toolbarEl = document.getElementById('toolbar');

    // Five chips, the order a session usually takes, plus Shown when more
    // than one model can be on stage. Icons are tiny inline SVGs - no
    // font, no icon font, no network.
    const CHIP_CLS = 'flex-none flex flex-col items-center justify-center gap-0.5 '
        + 'px-3 h-12 rounded-xl border text-[10px] font-semibold leading-none '
        + 'snap-start shrink-0 transition-colors cursor-pointer select-none';
    const CHIP_ON = 'border-sky-500 bg-sky-50 text-sky-700 '
        + 'dark:bg-sky-900/40 dark:text-sky-300 dark:border-sky-700';
    const CHIP_OFF = 'border-gray-200 bg-white/60 text-gray-500 hover:border-sky-400 '
        + 'dark:border-zinc-700 dark:bg-zinc-800/60 dark:text-zinc-400';
    const icon = paths => {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('width', '18');
        svg.setAttribute('height', '18');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', paths);
        svg.appendChild(p);
        return svg;
    };
    const TOOLS = [
        { id: 'shown', label: 'Shown',
          icon: icon('M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z'),
          show: () => currentMode === 'overlay' || catalog.length > 1 },
        { id: 'sets', label: 'Sets',
          icon: icon('M4 6h16M4 12h16M4 18h10'),
          show: () => sets.length > 1 },
        { id: 'look', label: 'Look',
          icon: icon('M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z'),
          show: () => recipes.length > 1 || scenes.length > 1 },
        { id: 'colour', label: 'Colour',
          icon: icon('M12 21a9 9 0 1 1 0-18c4.97 0 9 3.58 9 8 0 2.5-2 4-4 4h-2'
              + 'a2 2 0 0 0-1.4 3.4A2 2 0 0 1 12 21z'),
          show: () => true },
        { id: 'shape', label: 'Shape',
          icon: icon('M4 8h10M18 8h2M4 16h2M10 16h10'),
          show: () => true },
        { id: 'pillars', label: 'Pillars',
          icon: icon('M6 21V7M12 21V7M18 21V7M4 7h16'),
          show: () => frameGroupsOf().length > 0 },
        { id: 'lights', label: 'Lights',
          icon: icon('M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2'
              + 'M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2'
              + 'M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'),
          show: () => frameGroupsOf().length > 0 }
    ];

    function renderToolbar() {
        if (!toolbarEl) return;
        const live0 = TOOLS.filter(t => t.show());
        if (!live0.some(t => t.id === activeTool)) activeTool = 'shape';
        toolbarEl.textContent = '';
        for (const t of live0) {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = CHIP_CLS + ' ' + (t.id === activeTool ? CHIP_ON : CHIP_OFF);
            chip.setAttribute('aria-pressed', t.id === activeTool ? 'true' : 'false');
            chip.append(t.icon, document.createTextNode(t.label));
            chip.addEventListener('click', () => {
                if (activeTool === t.id) {
                    setShelfOpen(false);
                    return;
                }
                activeTool = t.id;
                setShelfOpen(true);
                renderIfChanged(true);
            });
            live.buttons.push(chip);
            toolbarEl.appendChild(chip);
        }
    }

    function frameGroupsOf() {
        return currentGroups.filter(g => g.id !== PILLAR_ID && !g.owner);
    }

    function emptyNote(text) {
        const p = document.createElement('p');
        p.className = 'text-xs text-gray-500 dark:text-zinc-400 px-1 py-3';
        p.textContent = text;
        return p;
    }
    // Tap the canvas to toggle: down when the shelf is up, up when it is
    // down. A real orbit-drag never counts - only a still tap under 6px.
    const canvasHost = document.getElementById('canvas-container');
    if (canvasHost) {
        let downX = 0, downY = 0;
        canvasHost.addEventListener('pointerdown', e => {
            downX = e.clientX;
            downY = e.clientY;
        });
        canvasHost.addEventListener('pointerup', e => {
            if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
            if (!shelfEl) return;
            setShelfOpen(shelfEl.classList.contains('closed'));
        });
    }

    let currentMode = mode;
    let currentGroups = groups;
    let current = model;
    let activeId_ = activeId;
    let currentScene = scene;
    let currentSet = set;
    let currentFramePillars = framePillars;
    let currentFrameElements = frameElements;
    let currentFrameAnchors = frameAnchors;
    let currentFrameSpacing = frameSpacing;
    let currentPlaces = places;
    let currentColorway = colorway;
    let currentFabricColor = fabricColor;
    let currentRecipe = recipe;
    // Which toolbar chip owns the shelf right now. Structural: switching
    // tools rebuilds the shelf body, never the viewer. A project opens on
    // Sets - the set list is the first thing a viewing session needs - and
    // only falls back when that chip is not on the toolbar.
    let activeTool = 'sets';
    // Which type the next Add light plants; remembered across rebuilds.
    let lastAddType = 'light-par';
    // Which fixtures the light numbers reach: each on its own, one wall,
    // or the whole rig. All is the default for the PAR rig - one mirrored
    // set of numbers for the whole rig. Session-local, like the type
    // chooser.
    let lightsMode = 'all';
    // LED wash panels open on Separate: one card per fixture, remove
    // right there, the mode row beside it for wall-wide edits.
    let ledMode = 'separate';
    // The strip group's side filter: which walls its palette and power
    // reach - left, right, or both at once.
    let stripSide = 'both';
    // Which sections and fixture cards the user folded away. Survives the
    // re-render an Add or retarget triggers - a fold is a preference, not
    // a accident of one paint - and the project file remembers it between
    // sessions through onFoldChange.
    const folded = new Set(folds);
    const foldSink = typeof onFoldChange === 'function' ? onFoldChange : null;
    const noteFold = () => { if (foldSink) foldSink([...folded]); };
    // Add colour swaps this list without a structural render.
    let currentColorways = colorways;
    // Live refs for applyLive: value-level updates never rebuild the DOM.
    let setSelectRef = null;
    let setNoteRef = null;
    let sceneSelectRef = null;
    let rgbDialRef = null;
    const recipeBtns = new Map();
    const sceneChips = new Map();
    // The Look shelf's shadow debug row - refs so applyLive can repaint
    // the counts when the room changes without rebuilding the shelf.
    const shadowRefs = { on: null, box: null, status: null };
    const colorChips = new Map();
    const placeRows = new Map();
    const pillarOffsetRows = new Map();

    let sections = [];
    let live = { selects: [], checks: [], buttons: [] };
    let busy = false;

    // A single stepper arrow beside the Turn label: nudges the rotation to the
    // next / previous position on the slider (dir is -1 or +1).
    const TURN_STEP = 15; // degrees per arrow click - one slider position
    function turnStepArrow(dir, onStep) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'w-6 h-6 rounded border border-gray-300 dark:border-zinc-600 '
            + 'text-gray-500 dark:text-zinc-400 hover:border-sky-400 hover:text-sky-500 '
            + 'transition-colors flex items-center justify-center';
        b.title = dir < 0 ? 'Turn left' : 'Turn right';
        b.setAttribute('aria-label', b.title);
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('width', '14');
        svg.setAttribute('height', '14');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2.2');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', dir < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6');
        svg.appendChild(path);
        b.appendChild(svg);
        b.addEventListener('click', onStep);
        return b;
    }

    // Placement controls for one mounted flower panel - X and Depth sliders,
    // plus a Turn (rotate) control: a slider with two stepper arrows flanking
    // the Turn label that step it to the next / previous angle. Wired straight
    // to the scene (no rebuild while a finger is on a control).
    function buildFlowerPlacement(fp) {
        const wrap = document.createElement('div');
        wrap.className = 'mt-1';
        for (const [label, prop, min, max, step, unit] of [
            ['X', 'x', -40, 40, 0.5, ' ft'],
            ['Depth', 'z', -40, 40, 0.5, ' ft'],
            ['Turn', 'ry', 0, 360, TURN_STEP, '°']
        ]) {
            // Turn lives in 0..360; normalise a stray negative/over value so the
            // slider and the readout agree.
            const init = prop === 'ry'
                ? ((Math.round(Number(fp[prop]) || 0) % 360) + 360) % 360
                : fp[prop];
            const built = placeRangeBlock(`${fp.id}-pos-${prop}`, label, prop,
                init, min, max, step, unit);
            built.input.addEventListener('input', e => {
                const v = parseFloat(e.target.value);
                if (!Number.isFinite(v)) return;
                built.value.textContent = fmt(v, unit);
                if (opts.onFlowerMove) opts.onFlowerMove(fp.id, { [prop]: v });
            });
            live.selects.push(built.input);
            wrap.appendChild(built.wrap);
            if (prop === 'ry') {
                // Two arrows flank the Turn label: each steps the slider to the
                // next / previous position - a clean rotate control.
                const stepBy = d => {
                    let v = Math.round(Number(built.input.value) || 0) + d;
                    v = ((v % 360) + 360) % 360;
                    built.input.value = String(v);
                    built.value.textContent = fmt(v, unit);
                    if (opts.onFlowerMove) opts.onFlowerMove(fp.id, { ry: v });
                };
                const left = document.createElement('div');
                left.className = 'flex items-center gap-0.5';
                built.head.insertBefore(left, built.label);
                left.appendChild(turnStepArrow(-1, () => stepBy(-TURN_STEP)));
                left.appendChild(built.label);
                left.appendChild(turnStepArrow(1, () => stepBy(TURN_STEP)));
            }
        }
        return wrap;
    }

    // The Flowers chip ships in its own module (objects/flowerchip.js) - wire
    // it into the toolbar right after Lights and hand it what it needs.
    const flowerChip = createFlowerChip({
        icon,
        getFlowerList: () => flowerList,
        onMount: arr => { if (opts.onFlowerMount) opts.onFlowerMount(arr); },
        onOpenStudio: () => { if (opts.onFlowerOpenStudio) opts.onFlowerOpenStudio(); },
        getMountedFlowers: () => mountedFlowers,
        onFlowerMove: (id, patch) => { if (opts.onFlowerMove) opts.onFlowerMove(id, patch); },
        onFlowerRemove: id => { if (opts.onFlowerRemove) opts.onFlowerRemove(id); },
        buildFlowerPlacement,
        getFlowerQuality: () => flowerQuality,
        onFlowerQualityChange: q => { if (opts.onFlowerQualityChange) opts.onFlowerQualityChange(q); },
        live,
        emptyNote
    });
    TOOLS.splice(TOOLS.findIndex(t => t.id === 'lights') + 1, 0, flowerChip.chip);

    let liveTheme = themeIsDark;
    let lastSignature = null;

    body.textContent = '';

    const msg = document.createElement('p');
    msg.id = 'panel-msg';
    msg.className = 'hidden mb-3 text-[11px] leading-snug text-red-600 dark:text-red-400';
    body.appendChild(msg);

    const host = document.createElement('div');
    body.appendChild(host);

    function emit(partial, targets) {
        onParamsChange && onParamsChange(partial, targets);
    }

    // HSV maths for the shared colour square: the curtain keeps the
    // swatch's brightness while the palette picks its hue and saturation.
    const hexToHsv = hex => {
        const r = ((hex >> 16) & 255) / 255;
        const g = ((hex >> 8) & 255) / 255;
        const b = (hex & 255) / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const d = max - min;
        let h = 0;
        if (d) {
            if (max === r) h = ((g - b) / d) % 6;
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
            if (h < 0) h += 360;
        }
        return { h, s: max ? (d / max) * 100 : 0, v: max * 100 };
    };
    const hsvToHex = (h, s, v) => {
        const c = (s / 100) * (v / 100);
        const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        const m = v / 100 - c;
        const seg = Math.floor(h / 60) % 6;
        const rgb = [[c, x, 0], [x, c, 0], [0, c, x],
            [0, x, c], [x, 0, c], [c, 0, x]][seg];
        const r = Math.round((rgb[0] + m) * 255);
        const g = Math.round((rgb[1] + m) * 255);
        const b = Math.round((rgb[2] + m) * 255);
        return (r << 16) | (g << 8) | b;
    };

    // The one colour square every hue uses: hue across, saturation up from
    // white, a live preview chip. Drags emit on every move - the lights
    // recolour while the finger travels, not on release. `opts.v` freezes
    // brightness so a curtain keeps its swatch's lightness.
    function paletteBlock(init, onLive, opts = {}) {
        const wrap = document.createElement('div');
        wrap.className = opts.className || 'mt-2';
        const head = document.createElement('div');
        head.className = 'flex items-center justify-between mb-1';
        const lab = document.createElement('span');
        lab.className = 'text-[11px] font-semibold uppercase tracking-wider '
            + 'text-gray-500 dark:text-zinc-400';
        lab.textContent = opts.label || 'Colour';
        const prev = document.createElement('span');
        prev.className = 'w-5 h-5 rounded-full border border-black/10 shrink-0';
        head.append(lab, prev);
        wrap.appendChild(head);
        const square = document.createElement('div');
        if (opts.id) square.id = opts.id;
        square.className = 'relative w-full h-24 rounded-lg border '
            + 'border-gray-300 dark:border-zinc-600 cursor-crosshair select-none';
        square.style.background = 'linear-gradient(to top, '
            + 'rgba(255,255,255,1), rgba(255,255,255,0)), '
            + 'linear-gradient(to right, hsl(0,100%,50%), hsl(60,100%,50%), '
            + 'hsl(120,100%,50%), hsl(180,100%,50%), hsl(240,100%,50%), '
            + 'hsl(300,100%,50%), hsl(360,100%,50%))';
        const dot = document.createElement('span');
        dot.className = 'absolute w-3.5 h-3.5 -ml-1.75 -mt-1.75 rounded-full '
            + 'border-2 border-white shadow ring-1 ring-black/30 pointer-events-none';
        square.appendChild(dot);
        wrap.appendChild(square);
        let hue = Number.isFinite(init && init.hue) ? init.hue : 40;
        let sat = Number.isFinite(init && init.sat) ? init.sat : 25;
        const placeDot = () => {
            dot.style.left = `${(hue / 360) * 100}%`;
            dot.style.top = `${(1 - sat / 100) * 100}%`;
            prev.style.background = `hsl(${hue}, ${Math.max(10, sat)}%, `
                + `${Number.isFinite(opts.v) ? Math.max(20, opts.v) : 60}%)`;
        };
        placeDot();
        const dial = e => {
            const t = e.touches && e.touches[0] ? e.touches[0] : e;
            const r = square.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const x = Math.max(0, Math.min(1, (t.clientX - r.left) / r.width));
            const y = Math.max(0, Math.min(1, (t.clientY - r.top) / r.height));
            hue = Math.round(x * 360);
            sat = Math.round((1 - y) * 100);
            placeDot();
            onLive && onLive(hue, sat);
        };
        let dragging = false;
        square.addEventListener('mousedown', e => {
            dragging = true;
            dial(e);
            e.preventDefault();
        });
        square.addEventListener('touchstart', e => {
            dragging = true;
            dial(e);
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('mousemove', e => { if (dragging) dial(e); });
        document.addEventListener('touchmove',
            e => { if (dragging) dial(e); }, { passive: false });
        document.addEventListener('mouseup', () => { dragging = false; });
        document.addEventListener('touchend', () => { dragging = false; });
        // Drive the dot from the outside (applyLive after a swatch tap).
        wrap._set = (h, s) => {
            if (Number.isFinite(h)) hue = h;
            if (Number.isFinite(s)) sat = s;
            placeDot();
        };
        return wrap;
    }

    // Busy takes everything down, but a control can also be off on its own
    // (a stepper at its limit, a position locked to the frame) - `data-off`
    // records that so this never switches it back on.
    function applyBusy() {
        for (const group of [live.selects, live.checks, live.buttons]) {
            for (const el of group) el.disabled = busy || el.dataset.off === '1';
        }
    }

    // One collapsible block of parameters for one preset. `targets` is the
    // preset's models, so a preset holding several objects is edited at once.
    // `tool` picks which subject this section speaks to: shape sliders and
    // placement for Shape, the Curtains toggle and fabric for Colour, the
    // pillars group for Pillars.
    function section(group, collapsible, open, tool = 'shape') {
        const key = group.id || 'active';
        const idx = typeof group.inst === 'number' ? group.inst : 0;
        const targets = (group.models || []).filter(Boolean);
        const schema = targets[0];

        let root, inner;
        if (collapsible) {
            root = document.createElement('details');
            root.className = 'mb-3 rounded-lg border '
                + 'border-gray-200 dark:border-zinc-700 bg-white/40 dark:bg-zinc-800/40';
            const summary = document.createElement('summary');
            summary.className = 'cursor-pointer select-none px-3 py-2 text-xs '
                + 'font-semibold text-gray-700 dark:text-zinc-200';
            summary.textContent = (schema ? schema.name : group.id)
                + (group.total > 1 ? ` ${idx + 1}` : '');
            inner = document.createElement('div');
            inner.className = 'px-3 pb-3';
            root.append(summary, inner);
            root.open = !!open;
        } else {
            root = document.createElement('div');
            inner = root;
        }

        const rows = {};
        const normalToggles = [];
        const shapeRanges = [];
        const advancedRanges = [];
        const advancedToggles = [];

        // Renders one control and wires it to `emit`, so the schema stays the
        // only source of truth for what the panel shows.
        const addRange = (k, p) => {
            const built = rangeBlock(`${key}-${k}`, p, schema.state[k]);
            built.input.addEventListener('input', e => {
                const v = parseFloat(e.target.value);
                built.value.textContent = fmt(v, p.unit);
                emit({ [k]: v }, targets);
            });
            rows[k] = built;
            return built.wrap;
        };
        const addToggle = (k, p) => {
            const built = toggleBlock(`${key}-${k}`, p, schema.state[k]);
            built.input.addEventListener('change', e => {
                emit({ [k]: e.target.checked }, targets);
            });
            rows[k] = built;
            return built.wrap;
        };

        if (schema && schema.params) {
            for (const [k, p] of Object.entries(schema.params)) {
                // The Curtains toggle and the fabric belong to Colour; the
                // sliders and the advanced gear belong to Shape.
                if (tool === 'colour') {
                    if (p.type === 'toggle') normalToggles.push([k, p]);
                    continue;
                }
                if (p.type === 'lobeGaps') continue; // rendered below
                if (p.advanced) {
                    (p.type === 'range' ? advancedRanges : advancedToggles)
                        .push([k, p]);
                } else if (p.type === 'range') {
                    shapeRanges.push([k, p]);
                }
            }
        }

        // Per-lobe gap sliders: one per active lobe. All LOBES_MAX rows are
        // built up front and shown/hidden by the Lobes slider so a mid-drag
        // lobes change never rebuilds the DOM.
        const lobeGapMeta = schema && schema.params
            ? schema.params.lobeGaps : null;
        const lobeGapSlots = [];
        function syncLobeGapVisibility() {
            const n = Math.round(schema.state.lobes) || 6;
            lobeGapSlots.forEach((slot, i) => {
                slot.wrap.style.display = i < n ? '' : 'none';
            });
        }
        // The lean degrees on every gap row depend on the lobe count, so a
        // lobes change re-reads all of them. Always reads fresh state - the
        // lobeGaps array identity changes when setParams replaces it.
        function refreshLobeGapTexts() {
            const lobesNow = Math.round(schema.state.lobes) || 6;
            const gapsNow = Array.isArray(schema.state.lobeGaps)
                ? schema.state.lobeGaps : [];
            lobeGapSlots.forEach((slot, i) => {
                const v = Number.isFinite(gapsNow[i]) ? gapsNow[i]
                    : lobeGapMeta.value;
                slot.value.textContent = lobeGapText(v, lobesNow, lobeGapMeta);
            });
        }
        if (tool === 'shape' && lobeGapMeta) {
            const gaps = Array.isArray(schema.state.lobeGaps)
                ? schema.state.lobeGaps : [];
            const count = lobeGapMeta.count || 11;
            const lobesNow = Math.round(schema.state.lobes) || 6;
            for (let i = 0; i < count; i++) {
                const meta = {
                    label: `Lobe ${i + 1} Gap`,
                    type: 'range',
                    min: lobeGapMeta.min,
                    max: lobeGapMeta.max,
                    step: lobeGapMeta.step,
                    unit: lobeGapMeta.unit
                };
                const val = Number.isFinite(gaps[i]) ? gaps[i] : lobeGapMeta.value;
                const built = rangeBlock(`${key}-lobeGap-${i}`, meta, val);
                built.value.textContent = lobeGapText(val, lobesNow, lobeGapMeta);
                built.input.addEventListener('input', e => {
                    const v = parseFloat(e.target.value);
                    const lobesCur = Math.round(schema.state.lobes) || 6;
                    built.value.textContent = lobeGapText(v, lobesCur, lobeGapMeta);
                    // Read the state array fresh: setParams may have replaced
                    // it with a new (clamped) array since these rows were built.
                    const cur = Array.isArray(schema.state.lobeGaps)
                        ? schema.state.lobeGaps : [];
                    const arr = Array.from({ length: count },
                        (_, j) => j === i ? v
                            : (Number.isFinite(cur[j]) ? cur[j]
                                : lobeGapMeta.value));
                    if (Array.isArray(schema.state.lobeGaps)) {
                        schema.state.lobeGaps.splice(0, schema.state.lobeGaps.length, ...arr);
                    } else {
                        schema.state.lobeGaps = arr;
                    }
                    emit({ lobeGaps: arr.slice() }, targets);
                });
                rows[`lobeGap${i}`] = built;
                lobeGapSlots.push({ wrap: built.wrap, input: built.input, value: built.value });
            }
        }

        // The S Curve is one open group: the four shape sliders plus where
        // this frame stands (X / Depth / Turn as tracks). Open by default -
        // it is what the hand reaches for first. Pillars stay below.
        if (tool === 'shape' && shapeRanges.length) {
            const details = document.createElement('details');
            details.open = true;
            details.className = 'mt-3 rounded-md border border-dashed '
                + 'border-gray-300 dark:border-zinc-600';
            const summary = document.createElement('summary');
            summary.className = 'cursor-pointer select-none px-2 py-1.5 text-[11px] '
                + 'font-semibold uppercase tracking-wider text-gray-500 dark:text-zinc-400';
            summary.textContent = 'S Curve';
            const bodyEl = document.createElement('div');
            bodyEl.className = 'px-2 pb-2';
            for (const [k, p] of shapeRanges) {
                bodyEl.appendChild(addRange(k, p));
                // After the Lobes slider, insert the per-lobe gap sliders
                // and keep their visibility (and lean degrees) in sync.
                if (k === 'lobes') {
                    for (const slot of lobeGapSlots) bodyEl.appendChild(slot.wrap);
                    syncLobeGapVisibility();
                    refreshLobeGapTexts();
                    rows.lobes.input.addEventListener('input', () => {
                        syncLobeGapVisibility();
                        refreshLobeGapTexts();
                    });
                    // Reset: back to the pre-lobe-feature configuration -
                    // 6 lobes at the default 1 ft gap, a plain sin(6πt)
                    // serpentine. One emit, DOM updated directly.
                    const resetBtn = document.createElement('button');
                    resetBtn.type = 'button';
                    resetBtn.className = 'mt-0.5 mb-1 w-full rounded-md border '
                        + 'border-gray-300 dark:border-zinc-600 px-2 py-1 text-[11px] '
                        + 'font-semibold uppercase tracking-wider text-gray-500 '
                        + 'dark:text-zinc-400 hover:border-sky-400 hover:text-sky-600 '
                        + 'dark:hover:text-sky-400 transition-colors';
                    resetBtn.textContent = 'Reset Lobes';
                    resetBtn.addEventListener('click', () => {
                        const n = lobeGapMeta.count || 11;
                        const resetVal = lobeGapMeta.value;
                        const arr = Array.from({ length: n }, () => resetVal);
                        schema.state.lobes = 6;
                        if (Array.isArray(schema.state.lobeGaps)) {
                            schema.state.lobeGaps.splice(0, schema.state.lobeGaps.length, ...arr);
                        } else {
                            schema.state.lobeGaps = arr;
                        }
                        rows.lobes.input.value = '6';
                        if (rows.lobes.value) {
                            rows.lobes.value.textContent =
                                fmt(6, schema.params.lobes.unit);
                        }
                        lobeGapSlots.forEach(slot => {
                            slot.input.value = String(resetVal);
                        });
                        syncLobeGapVisibility();
                        refreshLobeGapTexts();
                        emit({ lobes: 6, lobeGaps: arr.slice() }, targets);
                    });
                    bodyEl.appendChild(resetBtn);
                }
            }
            const place = (currentPlaces[key] || [])[idx];
            if (place) bodyEl.appendChild(positionBlock(key, idx, place));
            details.append(summary, bodyEl);
            inner.appendChild(details);
        }

        if (tool === 'colour' && normalToggles.length) {
            const row = document.createElement('div');
            row.className = 'flex flex-wrap gap-4 pt-1';
            for (const [k, p] of normalToggles) row.appendChild(addToggle(k, p));
            inner.appendChild(row);
            // The Curtains toggle owns the fabric: palettes and the RGB dial
            // live under it, not in a row of their own.
            if (schema && schema.params && schema.params.fabric) {
                inner.appendChild(fabricBlock());
            }
        }

        // One gear per frame section: the advanced numbers only. The
        // pillar's look moved into the frame's Pillars group below.
        if (tool === 'shape' && (advancedRanges.length || advancedToggles.length)) {
            const details = document.createElement('details');
            details.className = 'mt-2 rounded-md border border-dashed '
                + 'border-gray-300 dark:border-zinc-600';
            const summary = document.createElement('summary');
            summary.className = 'cursor-pointer select-none px-2 py-1.5 text-[11px] '
                + 'font-semibold uppercase tracking-wider text-gray-500 dark:text-zinc-400';
            summary.append(gearIcon(), document.createTextNode('Settings'));
            const gearBody = document.createElement('div');
            gearBody.className = 'px-2 pb-2';
            for (const [k, p] of advancedRanges) gearBody.appendChild(addRange(k, p));
            if (advancedToggles.length) {
                const row = document.createElement('div');
                row.className = 'flex flex-wrap gap-4 pt-1';
                for (const [k, p] of advancedToggles) row.appendChild(addToggle(k, p));
                gearBody.appendChild(row);
            }
            details.append(summary, gearBody);
            inner.appendChild(details);
        }

        // Pillars: one group per frame, gone until the frame has some.
        // Count, place, the offset and the pillar's look all live here.
        if (tool === 'pillars') inner.appendChild(pillarsBlock(key));
        // Lights: one rig per frame - add, retarget, tune, remove.
        if (tool === 'lights') inner.appendChild(lightsBlock(key));

        const sec = { key, targets, rows, root };
        sections.push(sec);
        return root;
    }

    // Where this frame stands, as sliders: X, Depth and Turn on full-width
    // tracks inside the S Curve group - no bare number boxes. The stage
    // follows the thumb; applyLive parks it when a finger is on the track.
    function positionBlock(key, idx, place) {
        // Folded by default: the four shape sliders are what the hand
        // reaches for; placement comes after, and the chevron opens it.
        const wrap = document.createElement('details');
        wrap.className = 'mt-1.5 border-t border-dashed '
            + 'border-gray-300 dark:border-zinc-600';
        const summary = document.createElement('summary');
        summary.className = 'cursor-pointer select-none py-1.5 text-[10px] '
            + 'font-bold uppercase tracking-wider '
            + 'text-gray-400 dark:text-zinc-500';
        summary.textContent = 'Placement';
        wrap.appendChild(summary);
        const body = document.createElement('div');
        body.className = 'pt-1';

        const refs = {};
        for (const [label, prop, min, max, step, unit] of [
            ['X', 'x', -40, 40, 0.5, ' ft'],
            ['Depth', 'z', -40, 40, 0.5, ' ft'],
            ['Turn', 'ry', -90, 90, 1, '°']
        ]) {
            const built = placeRangeBlock(`${key}-pos-${prop}`, label, prop,
                place[prop], min, max, step, unit);
            built.input.addEventListener('input', e => {
                const v = parseFloat(e.target.value);
                if (!Number.isFinite(v)) return;
                built.value.textContent = fmt(v, unit);
                onPlaceChange && onPlaceChange(key, idx, { [prop]: v });
            });
            live.selects.push(built.input);
            refs[prop] = { input: built.input };
            body.appendChild(built.wrap);
        }

        // Back to the SET's own numbers: zero the free override, let the
        // drawing speak again.
