// ---- js/project.js ----
// The project file is the panel's memory: which display mode was on, which
// presets were on stage, every control value for every preset that has been
// added, plus which project it belongs to and where the camera was left.
// Served builds keep a copy on disk as project.json and mirror it in
// localStorage; named projects themselves live in the SQLite database behind
// tools/store.mjs, which sanitises documents through these same helpers.

// Layout data only: no three.js, so this import still resolves in the plain
// Node the tests run the parser under.
// Pure (no three.js): the flower arrangement's authority for turning whatever a
// document carries into a full, clamped settings object.

const PROJECT_FILE = 'project.json';
const STORAGE_KEY = 'o2tilt-project.v1';
const API = './api/projects';

// A project opened from the homepage carries ?p=<id>. That id decides where
// every save goes; without it the editor keeps working on the shared
// project.json session, which is what a direct file:// open uses.
function readTarget() {
    try {
        const id = new URLSearchParams(location.search).get('p');
        return id && /^[\w-]{1,64}$/.test(id) ? id : null;
    } catch {
        return null;
    }
}

let target = readTarget();
let notice = '';

function projectId() { return target; }

// 'missing' - the URL points at a project that has since been deleted, so the
// editor detached and is editing the local session instead.
// 'offline' - the project could not be reached; saves will keep failing.
function loadNotice() { return notice; }

function served() {
    return typeof location !== 'undefined' && /^https?:$/.test(location.protocol);
}


function hasLocal() {
    return typeof localStorage !== 'undefined';
}

function cleanName(name, fallback = '') {
    if (typeof name !== 'string') return fallback;
    const clean = name.replace(/\s+/g, ' ').trim().slice(0, 80);
    return clean || fallback;
}

// A camera position/target is only kept when it is three finite numbers.
function vec3(v) {
    if (!Array.isArray(v) || v.length !== 3) return null;
    return v.every(x => typeof x === 'number' && Number.isFinite(x)) ? v : null;
}

function cleanView(view) {
    if (!view || typeof view !== 'object' || Array.isArray(view)) return null;
    const out = {
        position: vec3(view.position),
        target: vec3(view.target),
        theme: view.theme === 'dark' || view.theme === 'light' ? view.theme : null
    };
    return out.position || out.target || out.theme ? out : null;
}

// Per-instance placement: { '<key>': [{ x, z, ry }, ...] }. Coordinates are
// clamped to something walkable and each list to a handful of entries - a
// hand-edited file must not be able to put a thousand objects on the stage.
const PLACE_LIMIT = 8;
const PLACE_KEYS = 16;
const PLACE_KEY_RE = /^[A-Za-z0-9_-]{1,40}$/;
const clampN = (v, lo, hi, dflt) =>
    (typeof v === 'number' && Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : dflt);

function cleanPlaces(places) {
    if (!places || typeof places !== 'object' || Array.isArray(places)) return {};
    const out = {};
    let keys = 0;
    for (const [key, list] of Object.entries(places)) {
        if (keys >= PLACE_KEYS || !PLACE_KEY_RE.test(key) || !Array.isArray(list)) continue;
        const arr = [];
        for (const p of list.slice(0, PLACE_LIMIT)) {
            if (!p || typeof p !== 'object' || Array.isArray(p)) {
                arr.push(null); // keep the index: instance i is still instance i
                continue;
            }
            arr.push({
                x: clampN(p.x, -300, 300, 0),
                z: clampN(p.z, -300, 300, 0),
                ry: clampN(p.ry, -360, 360, 0),
                ...(p.auto === true ? { auto: true } : {})
            });
        }
        out[key] = arr;
        keys++;
    }
    return out;
}

// Pillars belong to their frame: { '<frameId>': { count, place } }. Count is
// 0-2 per instance of the frame; place is where the pair anchors - centre of
// the O2, the outer ends of its modules, or the inner ends beside the gap.
// Documents from the global-pillar days carry a plain number instead; that
// is passed through so app.js can migrate it against the frames it knows.
function cleanFramePillars(raw) {
    if (typeof raw === 'number') return raw;
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
    const out = {};
    let keys = 0;
    for (const [id, v] of Object.entries(raw)) {
        if (keys >= PLACE_KEYS || !PLACE_KEY_RE.test(id)
            || !v || typeof v !== 'object' || Array.isArray(v)) continue;
        const rawOff = v.offset && typeof v.offset === 'object' && !Array.isArray(v.offset)
            ? v.offset : {};
        out[id] = {
            count: Math.round(clampN(v.count, 0, 2, 0)),
            place: ['centre', 'inner', 'outer'].includes(v.place) ? v.place : 'outer',
            gap: clampN(v.gap, -5, 40, 3),
            offset: {
                x: clampN(rawOff.x, -200, 200, 0),
                z: clampN(rawOff.z, -200, 200, 0),
                ry: clampN(rawOff.ry, -360, 360, 0)
            }
        };
        keys++;
    }
    return out;
}

// Checked against its shape here and against the real list in app.js, so
// this module keeps importing nothing: the tests parse it in plain Node,
// where a three.js import would not resolve.
const SCENE_RE = /^[a-z][a-z0-9-]{0,31}$/;

// Lighting fixtures belong to their frame: { '<frameId>': [{ type, anchor,
// params }] }. Only shapes and numbers get through - the type must be a
// registered light, the anchor a plausible mount-point id, the numbers
// finite and bounded - so a hand-edited project cannot smuggle a thousand
// lights into the scene. The registered list itself is mirrored here (this
// module imports nothing); app.js re-checks against the live registry.
const ELEM_TYPES = ['light-par', 'light-led', 'light-strip'];
// Mount-point ids: kind-Side-index (`rail-L-3`, `pole-R-1`) or the strip
// lines (`stripline-L-T`, `stripline-R-B`). The old digit-only tail wiped
// every stripline anchor on load, which dropped rail strips back onto a
// pole as straight tubes.
const ELEM_ANCHOR_RE = /^[a-z]+-[A-Za-z]+-(?:\d+|T|B)$/;
const ELEM_PER_FRAME = 20;
const ELEM_TOTAL = 40;
const ELEM_PARAM_RE = /^[a-z][A-Za-z0-9]{0,15}$/;

function cleanFrameElements(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    let frames = 0, total = 0;
    for (const [id, v] of Object.entries(raw)) {
        if (frames >= PLACE_KEYS || total >= ELEM_TOTAL) break;
        if (!PLACE_KEY_RE.test(id) || !Array.isArray(v) || !v.length) continue;
        const list = [];
        for (const el of v) {
            if (list.length >= ELEM_PER_FRAME || total >= ELEM_TOTAL) break;
            if (!el || typeof el !== 'object' || Array.isArray(el)) continue;
            if (!ELEM_TYPES.includes(el.type)) continue;
            const params = {};
            if (el.params && typeof el.params === 'object' && !Array.isArray(el.params)) {
                let keys = 0;
                for (const [k, n] of Object.entries(el.params)) {
                    if (keys >= 8) break;
                    if (!ELEM_PARAM_RE.test(k)
                        || typeof n !== 'number' || !Number.isFinite(n)) continue;
                    params[k] = n;
                    keys++;
                }
            }
            list.push({
                type: el.type,
                anchor: typeof el.anchor === 'string' && ELEM_ANCHOR_RE.test(el.anchor)
                    ? el.anchor : '',
                params
            });
            total++;
        }
        if (list.length) {
            out[id] = list;
            frames++;
        }
    }
    return out;
}

// One frame's floor-PAR spacing in feet: absent or zero keeps the wall's
// full-width even bays; a positive number is a centred line of lights the
// Which collapsible sections and fixture cards were folded away: section
// names (`PAR`) and per-card keys (`strip:0`). Plain strings, short and
// tightly pattern-checked - a fold is a UI preference, never structure.
function cleanFolds(raw) {
    if (!Array.isArray(raw)) return [];
    const out = [];
    for (const k of raw) {
        if (out.length >= 120) break;
        if (typeof k !== 'string' || !/^[A-Za-z0-9:_-]{1,40}$/.test(k)) continue;
        out.push(k);
    }
    return out;
}

// frame re-seats on its own hooks. Keys follow the place-id rules.
function cleanFrameSpacing(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
    const out = {};
    let keys = 0;
    for (const [id, v] of Object.entries(raw)) {
        if (keys >= PLACE_KEYS || !PLACE_KEY_RE.test(id)) continue;
        const n = Number(v);
        if (!Number.isFinite(n) || n <= 0) continue;
        out[id] = Math.max(1, Math.min(12, Math.round(n * 10) / 10));
        keys++;
    }
    return out;
}

// Documents from before the merge: Divided Entrance is Classic Symmetry now.
const LEGACY_LAYOUT = { 'divided-entrance': 'classic-symmetry' };

// The four shape sliders, remembered per SET so each drawing keeps the look
// you left it with. Ranges are clamped in app.js, which owns the schema.
const DOC_SET_SHAPE_KEYS = ['gap', 'pan', 'pitch', 'decline', 'lobes'];
// Colours you saved yourself: appended after the board palettes, never
// replacing them. Capped so a document cannot grow a paint shop.
function cleanExtras(raw) {
    const out = [];
    if (!Array.isArray(raw)) return out;
    for (const v of raw) {
        if (out.length >= 12) break;
        if (!v || typeof v !== 'object') continue;
        if (typeof v.id !== 'string' || !/^[a-z0-9-]{1,32}$/.test(v.id)) continue;
        const name = typeof v.name === 'string' ? v.name.trim().slice(0, 24) : '';
        if (!name) continue;
        const fabric = Number(v.fabric);
        if (!Number.isFinite(fabric) || fabric < 0 || fabric > 0xffffff) continue;
        if (out.some(c => c.id === v.id)) continue;
        out.push({ id: v.id, name, fabric: Math.round(fabric) });
    }
    return out;
}

function cleanSetPresets(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    for (const [id, v] of Object.entries(raw)) {
        if (!LAYOUT_IDS.includes(id) || !v || typeof v !== 'object') continue;
        const shape = {};
        for (const k of DOC_SET_SHAPE_KEYS) {
            const n = Number(v[k]);
            if (Number.isFinite(n)) shape[k] = n;
        }
        if (Array.isArray(v.lobeGaps)) {
            shape.lobeGaps = v.lobeGaps
                .map(Number)
                .filter(Number.isFinite)
                .slice(0, 11);
        }
        if (Object.keys(shape).length) out[id] = shape;
    }
    return out;
}

// Mounted flower panels: each references an arrangement in the Studio's own
// library by id (the library lives in the Studio's localStorage, not here) plus
// a placement. A fallback copy of `settings` travels with it so a scene still
// opens when the Studio entry has since been removed; app.js prefers the live
// Studio arrangement (matched by id) so edits there keep persisting here.
const FLOWER_PANEL_LIMIT = 12;
const FP_ID_RE = /^[a-z0-9-]{1,40}$/;

// Returns normalized settings, or null when `raw` is not an object at all.
function cleanArrangementSettings(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    try { return FlowerModel.normalize(raw); } catch { return null; }
}

function cleanFlowerPanels(raw) {
    if (!Array.isArray(raw)) return [];
    const out = [];
    for (const p of raw) {
        if (out.length >= FLOWER_PANEL_LIMIT) break;
        if (!p || typeof p !== 'object' || Array.isArray(p)) continue;
        if (typeof p.id !== 'string' || !FP_ID_RE.test(p.id)) continue;
        const settings = cleanArrangementSettings(p.settings);
        if (!settings) continue;
        out.push({
            id: p.id,
            name: typeof p.name === 'string' ? p.name.trim().slice(0, 60) : '',
            arrangementId: typeof p.arrangementId === 'string' && FP_ID_RE.test(p.arrangementId)
                ? p.arrangementId : null,
            settings,
            x: clampN(p.x, -300, 300, 0),
            z: clampN(p.z, -300, 300, 0),
            ry: clampN(p.ry, -360, 360, 0)
        });
    }
    return out;
}

// Pure: turns whatever came back from disk into a known shape, or null if it
// is unusable. Never throws - a corrupt project just means "start fresh".
function parseProject(raw) {
    let data = raw;
    if (typeof raw === 'string') {
        try { data = JSON.parse(raw); } catch { return null; }
    }
    if (!data || typeof data !== 'object' || Array.isArray(data)) return null;

    const project = {
        version: 2,
        name: cleanName(data.name),
        mode: data.mode === 'overlay' ? 'overlay' : 'single',
        activeId: typeof data.activeId === 'string' ? data.activeId : null,
        view: cleanView(data.view),
        scene: typeof data.scene === 'string' && SCENE_RE.test(data.scene) ? data.scene : null,
        colorway: COLORWAY_IDS.includes(data.colorway) ? data.colorway : DEFAULT_COLORWAY,
        setPresets: cleanSetPresets(data.setPresets),
        extraColors: cleanExtras(data.extraColors),
        // A raw curtain colour from the RGB dial; null means "use the
        // palette". Validated here, clamped by the panel's own dial.
        fabricColor: Number.isFinite(data.fabricColor) && data.fabricColor >= 0
            && data.fabricColor <= 0xffffff ? Math.round(data.fabricColor) : null,
        layout: typeof data.layout === 'string'
            && LAYOUT_IDS.includes(LEGACY_LAYOUT[data.layout] || data.layout)
            ? (LEGACY_LAYOUT[data.layout] || data.layout) : null,
        pillars: cleanFramePillars(data.pillars),
        elements: cleanFrameElements(data.elements),
        // Which panel sections and fixture cards the user folded away.
        folds: cleanFolds(data.folds),
        spacing: cleanFrameSpacing(data.spacing),
        places: cleanPlaces(data.places),
        // Flower panels mounted around the scene. Each references an arrangement
        // in the Studio's own library by id (see the Studio's localStorage).
        flowerPanels: cleanFlowerPanels(data.flowerPanels),
        // Scene-wide flower geometry quality (drives the petal/leaf tessellation).
        flowerQuality: ['high', 'medium', 'low'].includes(data.flowerQuality)
            ? data.flowerQuality : 'medium',
        mounted: Array.isArray(data.mounted)
            ? data.mounted.filter(id => typeof id === 'string' && id)
            : [],
        overlayIds: Array.isArray(data.overlayIds)
            ? data.overlayIds.filter(id => typeof id === 'string' && id)
            : [],
        presets: {}
    };

    if (data.presets && typeof data.presets === 'object' && !Array.isArray(data.presets)) {
        for (const [id, values] of Object.entries(data.presets)) {
            if (!values || typeof values !== 'object' || Array.isArray(values)) continue;
            const clean = {};
            for (const [k, v] of Object.entries(values)) {
                if (typeof v === 'number' && Number.isFinite(v)) clean[k] = v;

// Pure: writes a saved value into a model's state, but only when the schema
// still has that key and the type still matches. A preset file edited by hand
// can never poison the model.
function applySaved(state, schema, saved) {
    if (!saved || !schema) return false;
    let changed = false;
    for (const [k, v] of Object.entries(saved)) {
        const p = schema[k];
        if (!p) continue;
        if (p.type === 'range') {
            if (typeof v !== 'number' || !Number.isFinite(v)) continue;
            const clamped = Math.min(p.max, Math.max(p.min, v));
            if (state[k] === clamped) continue;
            state[k] = clamped;
            changed = true;
        } else if (p.type === 'toggle') {
            if (typeof v !== 'boolean' || state[k] === v) continue;
            state[k] = v;
            changed = true;
        }
    }
    return changed;
}

function projectToJSON(project) {
    return JSON.stringify(project, null, 2);
}

function readLocal() {
    if (!hasLocal()) return null;
    try {
        return parseProject(localStorage.getItem(STORAGE_KEY));
    } catch {
        return null;
    }
}

// Named projects live behind the API; the shared session lives in
// project.json with a localStorage mirror for a file:// open.
async function fetchNamed(id) {
    const res = await fetch(`${API}/${encodeURIComponent(id)}`, { cache: 'no-store' });
    if (res.status === 404) {
        // The row is gone: stop aiming saves at it rather than failing
        // forever, and let the caller say so.
        target = null;
        notice = 'missing';
        return null;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}

async function loadProject() {
    notice = '';
    if (target && served()) {
        try {
            const payload = await fetchNamed(target);
            const project = payload ? parseProject(payload.doc) : null;
            if (project) {
                project.name = cleanName(payload.name, project.name);
                return project;
            }
            if (notice === 'missing') return readLocal();
        } catch (err) {
            console.warn('[project] could not load project ' + target, err);
            notice = 'offline';
            return readLocal();
        }
    }
    if (served()) {
        try {
            const res = await fetch(PROJECT_FILE, { cache: 'no-store' });
            if (res.ok) {
                const project = parseProject(await res.text());
                if (project) return project;
            }
        } catch {
            // fall through to the local mirror
        }
    }
    return readLocal();
}

async function saveProject(project) {
    const json = projectToJSON(project);
    let onDisk = false;
    let status = 0;

    if (served()) {
        try {
            const res = await fetch(target ? `${API}/${target}` : PROJECT_FILE, {
                method: target ? 'PATCH' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: target ? JSON.stringify({ doc: project }) : json
            });
            onDisk = res.ok;
            status = res.status;
        } catch {
            onDisk = false;
            status = -1;
        }
    }
    if (hasLocal()) {
        try { localStorage.setItem(STORAGE_KEY, json); } catch { /* quota */ }
    }
    if (typeof window !== 'undefined') {
        window.__tiltSave = { at: Date.now(), ok: onDisk, status, target };
        if (typeof window.__tiltDiag === 'function') window.__tiltDiag();
    }
    return onDisk;
}

// The last write on the way out of the page. keepalive lets a PATCH outlive
// the document - sendBeacon can only POST, which the API would answer with a
// 405 for a named project.
function flushProject(project) {
    const json = projectToJSON(project);
    if (hasLocal()) {
        try { localStorage.setItem(STORAGE_KEY, json); } catch { /* quota */ }
    }
    if (!served()) return false;
    try {
        fetch(target ? `${API}/${target}` : PROJECT_FILE, {
            method: target ? 'PATCH' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: target ? JSON.stringify({ doc: project }) : json,
            keepalive: true
        }).catch(() => { /* the page is closing */ });
        return true;
    } catch {
        return false;
    }
}

// Forget the local session. A named project is kept - deleting it would break
// the URL - and just has its document reset to the defaults.
async function clearProject() {
    if (served()) {
        try {
            await fetch(target ? `${API}/${target}` : PROJECT_FILE, {
                method: target ? 'PATCH' : 'DELETE',
                headers: target ? { 'Content-Type': 'application/json' } : undefined,
                body: target ? JSON.stringify({ doc: {} }) : undefined
            });
        } catch { /* offline */ }
    }
    if (hasLocal()) {
        try { localStorage.removeItem(STORAGE_KEY); } catch { /* ignore */ }
    }
}

async function patchName(name) {
    const res = await fetch(`${API}/${target}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}

async function renameProject(name) {
    if (!target) return false;
    const payload = await patchName(name);
    notice = '';
    return payload.name;
}

// Turn the local session into a real project: the whole document goes up in
// the create call, so nothing is lost on the redirect back.
async function createProject(name, doc) {
    const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, doc })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}

async function duplicateProject(name) {
    if (!target) throw new Error('no project open');
    const res = await fetch(`${API}/${target}/duplicate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(name ? { name } : {})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
}

// A flower panel authored in the Studio and dropped into the scene as a
// floor-standing object. The arrangement itself is deep nested settings (colours,
// border layers, greenery) authored in the Studio, so it is NOT stored in `params`
// (which validateDef keeps to range/toggle knobs). It is injected via
// setParams({ settings }) / setSettings() and, at rest, lives in a dedicated
// top-level field of the project doc (see Phase 5).
const FLOWERPANEL_ID = 'flowerpanel';
const FLOWERPANEL_NAME = 'Flower Panel';
const FLOWERPANEL_SUBTITLE = 'Arrangement';

// No auto-renderable knobs: the TILT panel only places and shows the panel; the
// arrangement is edited in the Studio. Empty schema keeps the persisted params
// object clean.
const FLOWERPANEL_PARAMS = {};

// used a 0.72 world scale; TILT uses full scale).

    // root's placement transform (position + rotation.y from the scene placement).

    // the camera at (0, 8, -25). Users spin it further via the placement's ry.
    panel.rotation.y = Math.PI;
    root.add(panel);

    const scene = FlowerScene.create({ scale: FT, quality: initial.quality });
    panel.add(scene.group);

    const state = {
        settings: FlowerModel.normalize(initial.settings || {}),
        arrangementId: initial.arrangementId || null,
        quality: scene.getQuality()

    function build() {
        const s = state.settings;
        scene.build(s);
        // Stand the panel on the floor. Its vertical centre sits at y = 0 in the
        // panel-local frame, so lift by half the height (feet == world units, FT=1).
        panel.position.y = (s.height * FT) / 2;
        model.dirty = false;
    }

    // Flowers keep their authored colours; the light/dark theme does not recolour
    // the arrangement (unlike the stone/fabric of the pillar and S-curve).
    function setTheme() {}

    function dispose() {
        scene.dispose();
        root.clear();
    }

    const model = {
        id: FLOWERPANEL_ID,
        name: FLOWERPANEL_NAME,
        subtitle: FLOWERPANEL_SUBTITLE,
        object3D: root,
        params: FLOWERPANEL_PARAMS,
        state,
        dirty: true,
        build,
        setTheme,
        setParams(partial) {
            if (partial && partial.settings) {
                state.settings = FlowerModel.normalize(partial.settings);
            }
            if (partial && 'arrangementId' in partial) {
                state.arrangementId = partial.arrangementId;
            }

        },
        getSettings() { return state.settings; },
        setSettings(settings) {
            state.settings = FlowerModel.normalize(settings);
            model.dirty = true;

        // Marks dirty only when the level actually changes, so a rebuild follows.
        setQuality(q) {

                state.quality = scene.getQuality();
                model.dirty = true;
                return true;
            }
            return false;
        },
        getQuality() { return scene.getQuality(); },
        dispose

    return model;

                    + 'dark:text-zinc-200 truncate';

                const meta = document.createElement('small');
                meta.className = 'block text-[11px] text-gray-500 dark:text-zinc-400';
                const nColors = (s.colors && s.colors.length) || 0;
                meta.textContent = `${s.width || 0} × ${s.height || 0} ft · `
                    + `${nColors} colour${nColors === 1 ? '' : 's'}`;
                info.append(name, meta);
                head.appendChild(info);
                card.appendChild(head);

                const row = document.createElement('div');
                row.className = 'mt-1.5 flex items-center gap-1.5';
                const mount = document.createElement('button');
                mount.type = 'button';
                mount.className = 'px-2.5 h-7 rounded-md text-[11px] font-semibold '
                    + 'border border-sky-500 text-sky-600 dark:text-sky-400 '
                    + 'dark:border-sky-700 hover:bg-sky-50 dark:hover:bg-sky-900/40 '
                    + 'transition-colors';
                mount.textContent = 'Mount';
                mount.title = 'Place this arrangement in the scene';
                mount.addEventListener('click', () => { if (ctx.onMount) ctx.onMount(arr); });
                ctx.live.buttons.push(mount);
                row.appendChild(mount);
                card.appendChild(row);
                wrap.appendChild(card);
            }
            if (ctx.onOpenStudio) wrap.appendChild(studioButton(false));
        }

        const mb = mountedBlock();
        if (mb) wrap.appendChild(mb);
        return wrap;
    }

    // panel.setFlowerQuality() repaints the segmented control after a level change.
    function setQuality() { if (qualityPaint) qualityPaint(); }

    return { chip, block, setQuality };

// ---- js/registry.js ----
const MANIFEST_FILE = 'manifest.json';

// Used when the manifest cannot be fetched (no server, bad path), so the
// viewer still boots with something on screen instead of an empty stage.
const BUILTIN = {
    id: 'o2tilt',
    name: 'S Curve',
    objects: [{
        type: 'o2tilt-frame',
        params: { gap: 3, pan: 0, pitch: 0, decline: 0, fabric: true },
        elements: []
    }]
};

const THEMES = ['light', 'dark'];

function isPlainObject(v) {
    return !!v && typeof v === 'object' && !Array.isArray(v);
}

// Pure: no fetch, no three. Returns a list of human-readable problems.
// `types` is a Map of type -> { factory, params }.
function validateDef(def, types) {
    const errs = [];
    if (!isPlainObject(def)) return ['definition must be a JSON object'];

    if (typeof def.id !== 'string' || !def.id) errs.push('missing "id"');
    if (typeof def.name !== 'string' || !def.name) errs.push('missing "name"');

    if (def.environment !== undefined) {
        if (!isPlainObject(def.environment)) errs.push('"environment" must be an object');
        else if (def.environment.theme !== undefined && !THEMES.includes(def.environment.theme)) {
            errs.push(`environment.theme must be one of ${THEMES.join(', ')}`);
        }
    }

    if (!Array.isArray(def.objects) || def.objects.length === 0) {
        errs.push('"objects" must be a non-empty array');
        return errs;
    }

    def.objects.forEach((o, i) => {
        const at = `objects[${i}]`;
        if (!isPlainObject(o)) { errs.push(`${at} must be an object`); return; }
        if (typeof o.type !== 'string' || !o.type) { errs.push(`${at}.type must be a string`); return; }

        const reg = types ? types.get(o.type) : null;
        if (types && !reg) { errs.push(`${at}.type "${o.type}" is not registered`); return; }
        if (!reg) return;

        const params = o.params === undefined ? {} : o.params;
        if (!isPlainObject(params)) { errs.push(`${at}.params must be an object`); return; }

        const schema = reg.params || {};
        for (const [k, v] of Object.entries(params)) {
            const p = schema[k];
            if (!p) { errs.push(`${at}.params: unknown "${k}"`); continue; }
            if (p.type === 'range') {
                if (typeof v !== 'number' || !Number.isFinite(v)) {
                    errs.push(`${at}.params.${k} must be a number`);
                } else if (v < p.min || v > p.max) {
                    errs.push(`${at}.params.${k}=${v} outside [${p.min}, ${p.max}]`);
                }
            } else if (p.type === 'toggle') {
                if (typeof v !== 'boolean') errs.push(`${at}.params.${k} must be true or false`);
            }
        }

        if (o.elements !== undefined && !Array.isArray(o.elements)) {
            errs.push(`${at}.elements must be an array`);
        } else if (Array.isArray(o.elements)) {
            // Elements attach to this object's anchors (lights, and anything
            // after them): same schema rules as the object itself.
            o.elements.forEach((el, j) => {
                const where = `${at}.elements[${j}]`;
                if (!isPlainObject(el)) { errs.push(`${where} must be an object`); return; }
                if (typeof el.type !== 'string' || !el.type) {
                    errs.push(`${where}.type must be a string`); return;
                }
                const ereg = types ? types.get(el.type) : null;
                if (types && !ereg) {
                    errs.push(`${where}.type "${el.type}" is not registered`); return;
                }
                if (!ereg) return;
                const eparams = el.params === undefined ? {} : el.params;
                if (!isPlainObject(eparams)) {
                    errs.push(`${where}.params must be an object`); return;
                }
                const eschema = ereg.params || {};
                for (const [k, v] of Object.entries(eparams)) {
                    const p = eschema[k];
                    if (!p) { errs.push(`${where}.params: unknown "${k}"`); continue; }
                    if (p.type === 'range') {
                        if (typeof v !== 'number' || !Number.isFinite(v)) {
                            errs.push(`${where}.params.${k} must be a number`);
                        } else if (v < p.min || v > p.max) {
                            errs.push(`${where}.params.${k}=${v} outside [${p.min}, ${p.max}]`);
                        }
                    } else if (p.type === 'toggle') {
                        if (typeof v !== 'boolean') {
                            errs.push(`${where}.params.${k} must be true or false`);
                        }
                    }
                }
                if (el.anchor !== undefined && typeof el.anchor !== 'string') {
                    errs.push(`${where}.anchor must be a string`);
                }
            });
        }
    });

    return errs;
}

class Registry {
    constructor(base = './models') {
        this.base = String(base).replace(/\/+$/, '');
        this.types = new Map();
        this.entries = [];
        this.defs = new Map();
        this.source = 'builtin';
    }

    register(type, factory, params = {}) {
        this.types.set(type, { factory, params });
        return this;
    }

    get list() {
        if (this.entries.length) return this.entries;
        return [{ id: BUILTIN.id, name: BUILTIN.name, file: null, tags: ['builtin'] }];
    }

    // 'builtin' until a manifest has been fetched successfully.
    get manifestSource() { return this.source; }

    async loadManifest() {
        const url = `${this.base}/${MANIFEST_FILE}`;
        const res = await fetch(url, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`GET ${url} -> ${res.status}`);

        let data;
        try { data = await res.json(); }
        catch (e) { throw new Error(`${MANIFEST_FILE} is not valid JSON: ${e.message}`); }

        if (!isPlainObject(data) || !Array.isArray(data.models)) {
            throw new Error(`${MANIFEST_FILE} needs a "models" array`);
        }
        if (!data.models.length) throw new Error(`${MANIFEST_FILE} lists no models`);

        const seen = new Set();
        const entries = data.models.map((m, i) => {
            if (!isPlainObject(m)) throw new Error(`models[${i}] must be an object`);
            const id = typeof m.id === 'string' ? m.id : '';
            const file = typeof m.file === 'string' ? m.file : '';
            if (!id) throw new Error(`models[${i}] needs an "id"`);
            if (!file) throw new Error(`models[${i}] needs a "file"`);
            if (seen.has(id)) throw new Error(`duplicate model id "${id}"`);
            if (file.includes('..') || file.startsWith('/') || file.includes(':')) {
                throw new Error(`models[${i}].file must stay inside the models folder`);
            }
            seen.add(id);
            return {
                id,
                name: typeof m.name === 'string' && m.name ? m.name : id,
                file,
                tags: Array.isArray(m.tags) ? m.tags.map(String) : []
            };
        });

        this.entries = entries;
        this.defs.clear();
        this.source = 'manifest';
        return entries;
    }

    async load(id) {
        const cached = this.defs.get(id);
        if (cached) return cached;

        let def;
        if (this.source !== 'manifest' && id === BUILTIN.id) {
            def = BUILTIN;
        } else {
            const entry = this.entries.find(e => e.id === id);
            if (!entry) throw new Error(`unknown model id "${id}"`);

            const url = `${this.base}/${entry.file}`;
            const res = await fetch(url, { cache: 'no-cache' });
            if (!res.ok) throw new Error(`GET ${url} -> ${res.status}`);
            try { def = await res.json(); }
            catch (e) { throw new Error(`${entry.file} is not valid JSON: ${e.message}`); }
        }

        const errs = validateDef(def, this.types);
        if (errs.length) throw new Error(`${id}: ${errs.join('; ')}`);

        this.defs.set(id, def);
        return def;
    }

    // Turns a definition into live models. Returns both, because the viewer
    // and the environment (theme) are separate concerns.
    async instantiate(def) {
        const errs = validateDef(def, this.types);
        if (errs.length) throw new Error(`${def && def.id}: ${errs.join('; ')}`);

        const models = [];
        for (const [i, o] of def.objects.entries()) {
            const model = this.types.get(o.type).factory(o.params || {});
            model.id = def.id;
            model.name = def.name;
            model.objectIndex = i;
            model.def = def;
            models.push(model);
        }
        return { models, environment: def.environment || {} };
    }
}

const MODEL_ID = 'o2tilt';
const MODEL_NAME = 'S Curve';
const MODEL_SUBTITLE = 'Modular Control';

const POLE_MAX_HEIGHT = 8.0;
const RAIL_LENGTH = 12.0;
const WAVE_AMP = 1.0;
const LOBES_MIN = 4;
const LOBES_MAX = 11;
const LOBE_GAP_MIN = 0.2;
const LOBE_GAP_MAX = 3.0;
const RAIL_RADIUS = 0.12;
const FABRIC_RES_X = 300;
const FABRIC_RES_Y = 8;
const POLE_COUNT = 3;
const MAX_DROP = 5.0;
const PLEAT_FREQ = 30;
const PLEAT_DEPTH = 0.12;
const ANCHOR_RAIL_SAMPLES = 24;
// Floor uplight hooks: one per section of the wall, up to ten per side.
// The panel's Per-wall slider (1-10) picks how many of them carry a
// fixture; the anchors themselves always exist so any count is legal.
const UPLIGHT_PER_SIDE = 10;
// How far in front of its curtain wall a floor uplight stands. The stand
// base frame is 1.6 ft square (reaches 0.8 ft off the line), so this keeps
// the fixture clear of the plate while staying inside the wash throw.
const UPLIGHT_STANDOFF = 1.35;
// Front-side z floor: the stand base frames reach 0.8 ft off the wall
// line, so a fixture's centre stays at least this far front of z=0.
const UPLIGHT_MIN_Z = 1.15;
// Where a hem strip rides: the curtain's foot on the floor, the same
// serpentine as the rail above it, at tube height.
const STRIP_HEM_Y = 0.12;
// How far backstage each stand sits behind its curtain line. A single
// drape is dressed on the audience side of the rail, so the uprights
// hide behind their own curtain from the guest view; a short arm at
// the top ties each stand back to the bracket on the rail. Covers the
// square-pole corner (0.113) + pleat depth (0.12) + margin.
const STAND_BACK = 0.30;

// A stand is telescoping: a fixed sleeve standing out of the floor, with a
// slimmer inner tube running out of its open top and on up to the rail.
const POLE_SECTION = 0.16;      // outer tube across flats, in feet
const MM_PER_FOOT = 304.8;
const NEST_CLEARANCE = 0.002;   // gap between inner tube and sleeve bore, feet
const INNER_HIDE = 0.02;        // below this the inner tube is not drawn

// The stand-to-rail joint is a sleeve coupler: the round rail pole passes
// through a fatter coupling sleeve that the stand top rises into. Because
// the sleeve is round, the rail can be rotated (pitched) and locked in
// place - the tilt lives in this joint, like a set-screw EMT coupling on
// a pipe-and-rail build.
const Y_AXIS = new THREE.Vector3(0, 1, 0);

// Pivot-bracket dimensions (feet), scaled from the DIY spec:
// round sleeve 70-100 mm long, side plates 4-5 mm x 60-70 mm,
// M8/M10 pivot bolt, M6/M8 locking bolt.
const BR_SLEEVE_LEN = 0.25;
const BR_SLEEVE_OUTER_R = RAIL_RADIUS + 0.017;
const BR_PLATE_THICK = 0.015;
const BR_PLATE_HEIGHT = 0.22;
const BR_PLATE_WIDTH = 0.1;
const BR_PIVOT_R = 0.014;
const BR_PIVOT_HEAD_R = 0.025;
const BR_PIVOT_HEAD_H = 0.012;
const BR_LOCK_R = 0.01;
const BR_LOCK_LEN = 0.06;
const BR_PLATE_OFFSET = BR_SLEEVE_OUTER_R + BR_PLATE_THICK / 2 + 0.005;
const BR_BOLT_LEN = 2 * BR_PLATE_OFFSET + BR_PLATE_THICK + 0.02;


const PARAMS = {
    gap:     { label: 'Center Gap',        type: 'range', min: 0, max: 10,  step: 0.1, value: 3,  unit: ' ft' },
    pan:     { label: 'Swing Pan (Arc)',   type: 'range', min: -90, max: 90,  step: 1,   value: 0,  unit: '°' },
    pitch:   { label: 'Pitch (Rail Tilt)', type: 'range', min: 0, max: 45,  step: 1,   value: 0,  unit: '°' },
    lobes:   { label: 'Lobes',            type: 'range', min: LOBES_MIN, max: LOBES_MAX, step: 1, value: 6, unit: '' },
    lobeGaps: { label: 'Lobe Gaps', type: 'lobeGaps', min: LOBE_GAP_MIN, max: LOBE_GAP_MAX, step: 0.1, value: WAVE_AMP, unit: ' ft', count: LOBES_MAX, railLen: RAIL_LENGTH },
    decline: { label: 'Decline (Slope)',   type: 'range', min: 0, max: 100, step: 1,   value: 0,  unit: '%' },
    fabric:  { label: 'Curtains',          type: 'toggle', value: false },

    poleShape: { label: 'Square Poles',    type: 'toggle', value: true, advanced: true },
    poleInner: { label: 'Inner Wall',      type: 'range', min: 0.8, max: 3, step: 0.1,
                 value: 1,   unit: ' mm', advanced: true },
    poleOuter: { label: 'Outer Wall',      type: 'range', min: 1,   max: 4, step: 0.1,
                 value: 1.5, unit: ' mm', advanced: true },
    sleeve:    { label: 'Sleeve Height',   type: 'range', min: 3, max: 10, step: 0.1,
                 value: 5,   unit: ' ft', advanced: true }
};

const MODEL_THEME = {
    light: { fabric: 0xffffff, fabricEnv: 0.15, metalEnv: 1.0 },
    dark:  { fabric: 0xd4d4d8, fabricEnv: 0.08, metalEnv: 0.4 }
};

function createBaseFrame(bMat) {
    const group = new THREE.Group();
    const w = 1.6, d = 1.6, thick = 0.12, h = 0.12;

    const mark = m => { m.castShadow = true; m.receiveShadow = true; return m; };

    // 1. Square base frame
    const geoX = new THREE.BoxGeometry(w, h, thick);
    const geoZ = new THREE.BoxGeometry(thick, h, d - thick * 2);

    const b1 = new THREE.Mesh(geoX, bMat); b1.position.set(0, h / 2, d / 2 - thick / 2);
    const b2 = new THREE.Mesh(geoX, bMat); b2.position.set(0, h / 2, -d / 2 + thick / 2);
    const b3 = new THREE.Mesh(geoZ, bMat); b3.position.set(w / 2 - thick / 2, h / 2, 0);
    const b4 = new THREE.Mesh(geoZ, bMat); b4.position.set(-w / 2 + thick / 2, h / 2, 0);
    [b1, b2, b3, b4].forEach(m => group.add(mark(m)));

    // 2. Pole base plate + collar (the pole foot the braces anchor into)
    const PLATE_R = 0.30, PLATE_H = 0.10;
    const COLLAR_R = 0.14, COLLAR_TOP = 0.66;
    const plate = mark(new THREE.Mesh(
        new THREE.CylinderGeometry(PLATE_R, PLATE_R, PLATE_H, 24), bMat));
    plate.position.y = PLATE_H / 2;
    const collar = mark(new THREE.Mesh(
        new THREE.CylinderGeometry(COLLAR_R, COLLAR_R, COLLAR_TOP - PLATE_H, 24), bMat));
    collar.position.y = (PLATE_H + COLLAR_TOP) / 2;
    group.add(plate, collar);

    // 3. Four diagonal braces, each embedded at BOTH ends
    const a = new THREE.Vector3(0.06, 0.58, 0);
    const b = new THREE.Vector3(w / 2 - thick / 2, h / 2, 0);
    const dir = b.clone().sub(a);
    const gLen = dir.length();
    const braceGeo = new THREE.CylinderGeometry(0.045, 0.045, gLen, 8);
    braceGeo.translate(0, gLen / 2, 0);
    const braceQ = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), dir.normalize());

    for (let i = 0; i < 4; i++) {
        const holder = new THREE.Group();
        const g = mark(new THREE.Mesh(braceGeo, bMat));
        g.position.copy(a);
        g.quaternion.copy(braceQ);
        holder.add(g);
        holder.rotation.y = (Math.PI / 2) * i;
        group.add(holder);
    }
    return group;
}

// Cross-section of a real tube: a square (or round) ring extruded along Y
// over a unit height, so scaling Y sets the length while the wall thickness
// stays in X/Z. Solid-looking but genuinely hollow - the wall number in the
// Advanced settings is a real dimension.
function tubeGeometry(square, section, wall) {
    const outer = section / 2;
    const inner = Math.max(outer * 0.15, outer - wall);
    let shape, hole;

    if (square) {
        shape = new THREE.Shape();
        shape.moveTo(-outer, -outer).lineTo(outer, -outer)
             .lineTo(outer, outer).lineTo(-outer, outer).closePath();
        hole = new THREE.Path();
        // Opposite winding so the ring triangulates as a hole.
        hole.moveTo(-inner, -inner).lineTo(-inner, inner)
             .lineTo(inner, inner).lineTo(inner, -inner).closePath();
    } else {
        shape = new THREE.Shape();
        shape.absarc(0, 0, outer, 0, Math.PI * 2, false);
        hole = new THREE.Path();
        hole.absarc(0, 0, inner, 0, Math.PI * 2, true);
    }
    shape.holes.push(hole);

    const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 1, bevelEnabled: false, steps: 1, curveSegments: square ? 1 : 24
    });
    geo.rotateX(-Math.PI / 2);
    return geo;
}

function getStructuralPoints(state, isRight, segments) {
    const pts = [];
    const panRad = state.pan * (Math.PI / 180);
    const pitchRad = state.pitch * (Math.PI / 180);
    const halfGap = state.gap / 2.0;

    const sinP = Math.sin(pitchRad), cosP = Math.cos(pitchRad);
    const sinA = Math.sin(panRad),   cosA = Math.cos(panRad);

    for (let i = 0; i <= segments; i++) {
        const t = i / segments;

        const localX = t * RAIL_LENGTH;
        // Per-lobe amplitude: lobe i covers t ∈ [i/lobes, (i+1)/lobes).
        // sin(t·π·lobes) is zero at every lobe boundary, so swapping the
        // amplitude there never kinks the rail. Each lobe holds one
        // half-wave bump (a single lobe, not an up/down pair).
        const nLobes = Math.max(LOBES_MIN, Math.min(LOBES_MAX,
            Math.round(state.lobes) || 6));
        const lobeIdx = Math.min(nLobes - 1, Math.max(0, Math.floor(t * nLobes)));
        const lobeAmp = Number(state.lobeGaps && state.lobeGaps[lobeIdx])
            || WAVE_AMP;
        const wave = Math.sin(t * Math.PI * nLobes) * lobeAmp;

        // Decline: a pure vertical drop, independent of pitch.
        const dropY = -t * (state.decline / 100) * MAX_DROP;

        // Pitch: roll the serpentine about the rail's own X axis. Poles sit
        // where wave === 0, so their heights are unaffected by pitch.
        const pitchedY = -wave * sinP;
        const pitchedZ =  wave * cosP;

        // Pan: yaw the whole rail about Y, anchored at the centre gap
        const panX = localX * cosA + pitchedZ * sinA;
        const panZ = -localX * sinA + pitchedZ * cosA;

        let wX = halfGap + panX;
        let wY = POLE_MAX_HEIGHT + dropY + pitchedY;
        let wZ = panZ;

        if (!isRight) wX = -wX;

        pts.push(new THREE.Vector3(wX, wY, wZ));
    }
    return pts;
}

function generateFabricGeometry(curvePts, isRight) {
    const cols = FABRIC_RES_X, rows = FABRIC_RES_Y;
    const verts = [], uvs = [], indices = [];
    const rowStride = rows + 1;

    for (let i = 0; i <= cols; i++) {
        const t = i / cols;
        const pt = curvePts[i];

        let tan = new THREE.Vector3();
        if (i < cols) tan.subVectors(curvePts[i + 1], pt);
        else tan.subVectors(pt, curvePts[i - 1]);
        tan.y = 0;
        if (tan.lengthSq() < 1e-12) tan.set(1, 0, 0);
        tan.normalize();

        const normal = new THREE.Vector3(-tan.z, 0, tan.x);
        if (!isRight) normal.negate();

        const phase = t * Math.PI * 2 * PLEAT_FREQ;

        for (let j = 0; j <= rows; j++) {
            const v = j / rows;
            const y = THREE.MathUtils.lerp(pt.y - RAIL_RADIUS, 0, v);
            const amp = PLEAT_DEPTH * (0.55 + 0.45 * v);
            const off = Math.sin(phase) * amp;
            verts.push(pt.x + normal.x * off, y, pt.z + normal.z * off);
            uvs.push(t, 1 - v);
        }
    }

    for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
            const a = i * rowStride + j;
            const b = a + 1;
            const c = (i + 1) * rowStride + j;
            const d = c + 1;
            indices.push(a, b, d);
            indices.push(a, d, c);
        }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
}

function createO2TiltModel(initial = {}) {
    const root = new THREE.Group();
    root.name = MODEL_ID;

    const matRail = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.28 });
    const matPole = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.4, roughness: 0.4 });
    const matBase = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.7, roughness: 0.2 });
    const matJoint = new THREE.MeshStandardMaterial({ color: 0x6b7280, metalness: 0.75, roughness: 0.3 });
    const matFabric = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.9, metalness: 0.1,
        side: THREE.DoubleSide, envMapIntensity: 0.15
    });

    const state = {};
    for (const k of Object.keys(PARAMS)) {
        state[k] = PARAMS[k].type === 'lobeGaps'
            ? Array(LOBES_MAX).fill(PARAMS[k].value)
            : PARAMS[k].value;
    }
    Object.assign(state, initial);
    // Guarantee a full-length lobeGaps array even when a preset or project
    // supplies a shorter one.
    if (!Array.isArray(state.lobeGaps) || state.lobeGaps.length !== LOBES_MAX) {
        const src = Array.isArray(state.lobeGaps) ? state.lobeGaps : [];
        state.lobeGaps = Array.from({ length: LOBES_MAX },
            (_, i) => Number.isFinite(src[i]) ? src[i] : WAVE_AMP);
    }

    const polesL = [], polesR = [], basesL = [], basesR = [];
    for (let i = 0; i < POLE_COUNT; i++) {
        for (const [pArr, bArr, tag] of [
            [polesL, basesL, 'L'], [polesR, basesR, 'R']
        ]) {
            const stand = new THREE.Group();
            stand.name = `stand-${tag}-${i}`;

            const sleeve = new THREE.Mesh(new THREE.BufferGeometry(), matPole);
            const inner = new THREE.Mesh(new THREE.BufferGeometry(), matPole);
            sleeve.name = 'stand-sleeve';
            inner.name = 'stand-inner';
            sleeve.castShadow = inner.castShadow = true;
            inner.visible = false;
            stand.add(sleeve, inner);

            const base = createBaseFrame(matBase);
            base.name = 'stand-base';
            root.add(stand, base);

            pArr.push({ group: stand, sleeve, inner, height: 0 });
            bArr.push(base);
        }
    }

    // One shared geometry per part; rebuilt only when the advanced tube
    // settings actually change, not on every slider tick.
    let sleeveGeo = null, innerGeo = null, tubeKey = '';

    function ensureTubeGeometry() {
        const wallOut = state.poleOuter / MM_PER_FOOT;
        const wallIn = state.poleInner / MM_PER_FOOT;
        const key = `${state.poleShape ? 'square' : 'round'}|${wallOut.toFixed(5)}|${wallIn.toFixed(5)}`;
        if (key === tubeKey) return;
        tubeKey = key;

        // The inner tube has to nest inside the sleeve bore with room to slide.
        const bore = POLE_SECTION / 2 - wallOut;
        const innerSection = Math.max(0.02, (bore - NEST_CLEARANCE) * 2);

        if (sleeveGeo) sleeveGeo.dispose();
        if (innerGeo) innerGeo.dispose();
        sleeveGeo = tubeGeometry(state.poleShape, POLE_SECTION, wallOut);
        innerGeo = tubeGeometry(state.poleShape, innerSection, wallIn);

        for (const arr of [polesL, polesR]) {
            for (const p of arr) {
                p.sleeve.geometry = sleeveGeo;
                p.inner.geometry = innerGeo;
            }
        }
    }

    let railL = null, railR = null, fabricL = null, fabricR = null;
    let anchors = [];
    let anchorsStale = true;

    // Per-stand hardware cleared on rebuild: the pivot brackets that hold
    // the rail, and the arms reaching from each backstage stand back to
    // its bracket.
    const joints = [];
    // Shared pivot-bracket geometries (one set for all six brackets).
    const brSleeveGeo = new THREE.CylinderGeometry(BR_SLEEVE_OUTER_R, BR_SLEEVE_OUTER_R, BR_SLEEVE_LEN, 16);
    const brPlateGeo = new THREE.BoxGeometry(BR_PLATE_WIDTH, BR_PLATE_HEIGHT, BR_PLATE_THICK);
    const brBoltGeo = new THREE.CylinderGeometry(BR_PIVOT_R, BR_PIVOT_R, BR_BOLT_LEN, 8);
    const brHeadGeo = new THREE.CylinderGeometry(BR_PIVOT_HEAD_R, BR_PIVOT_HEAD_R, BR_PIVOT_HEAD_H, 6);
    const brLockGeo = new THREE.CylinderGeometry(BR_LOCK_R, BR_LOCK_R, BR_LOCK_LEN, 8);
    const brLockHeadGeo = new THREE.CylinderGeometry(BR_LOCK_R * 1.8, BR_LOCK_R * 1.8, BR_LOCK_R * 2, 6);
    // Horizontal stand-to-bracket arm (one shared geometry, six arms).
    const standArmGeo = new THREE.BoxGeometry(STAND_BACK + 0.1, 0.07, 0.07);

    function release(mesh) {
        if (!mesh) return;
        root.remove(mesh);
        mesh.geometry.dispose();
    }

    function build() {
        const ptsL = getStructuralPoints(state, false, FABRIC_RES_X);
        const ptsR = getStructuralPoints(state, true, FABRIC_RES_X);
        const panRad = state.pan * (Math.PI / 180);

        ensureTubeGeometry();

        for (const j of joints) root.remove(j);
        joints.length = 0;

        for (let i = 0; i < POLE_COUNT; i++) {
            const idx = Math.floor((i / (POLE_COUNT - 1)) * FABRIC_RES_X);

            for (const [pts, stands, bases, turn] of [
                [ptsR, polesR, basesR, 1],
                [ptsL, polesL, basesL, -1]
            ]) {
                const p = pts[idx];
                const railY = Math.max(0.05, p.y);
                const stand = stands[i];

                // The sleeve is the pole's retracted length; the inner tube
                // takes up the rest of the way to the rail, and neither is
                // ever allowed to poke through it.
                const sleeveH = Math.min(Math.max(0.05, state.sleeve), railY);
                const innerH = railY - sleeveH;

                const bx = p.x;
                const bz = p.z;

                // Rail tangent at this point — full 3D so the sleeve
                // follows the rail's pitch, not just its yaw.
                const jPrev = pts[Math.max(0, idx - 1)];
                const jNext = pts[Math.min(pts.length - 1, idx + 1)];
                const tan = jNext.clone().sub(jPrev);
                if (tan.lengthSq() < 1e-12) tan.set(1, 0, 0);
                tan.normalize();

                // Horizontal curtain normal (same convention as the
                // fabric: (-tz, 0, tx), flipped for the left wall). It
                // points backstage, so the stand hides behind its own
                // drape from the guest side; a short arm at the top
                // reaches back to the bracket on the rail.
                const n = new THREE.Vector3(-tan.z, 0, tan.x);
                if (turn < 0) n.negate();
                if (n.lengthSq() < 1e-12) n.set(0, 0, 1);
                n.normalize();
                const sx = bx + n.x * STAND_BACK;
                const sz = bz + n.z * STAND_BACK;

                stand.group.position.set(sx, 0, sz);
                stand.group.rotation.y = turn * panRad;
                stand.sleeve.position.set(0, 0, 0);
                stand.sleeve.scale.set(1, sleeveH, 1);
                stand.inner.position.set(0, sleeveH, 0);
                stand.inner.scale.set(1, Math.max(0.02, innerH), 1);
                stand.inner.visible = innerH > INNER_HIDE;
                stand.height = railY;

                bases[i].position.set(sx, 0, sz);
                bases[i].rotation.y = turn * panRad;

                // Horizontal arm from the stand top back to the bracket
                // on the rail. Long axis is local X, so yaw it onto the
                // stand-to-bracket direction (-n).
                const arm = new THREE.Mesh(standArmGeo, matJoint);
                arm.name = `stand-arm-${turn < 0 ? 'L' : 'R'}-${i}`;
                arm.position.set((sx + bx) / 2, railY, (sz + bz) / 2);
                arm.rotation.y = Math.atan2(n.z, -n.x);
                arm.castShadow = true;
                root.add(arm);
                joints.push(arm);

                // Pivot bracket: sits at the rail point, reached from
                // the offset stand by the arm above. The round sleeve
                // holds the rail and tilts with it (pitch), two side
                // plates (clevis ears) hang down, and a pivot bolt
                // through plates and sleeve lets the rail tilt. A
                // smaller locking bolt clamps the chosen angle.
                const bracket = new THREE.Group();
                bracket.position.set(bx, railY, bz);
                // Yaw only — the plates and bolt stay horizontal; the
                // sleeve is what tilts with the rail.
                bracket.rotation.y = Math.atan2(-tan.z, tan.x);

                // Round sleeve aligned to the full 3D rail tangent so it
                // pitches with the rail. The cylinder's default axis is Y,
                // so point Y along the tangent. Express the tangent in the
                // bracket's local frame (undo the yaw) so the tilt is
                // purely the pitch component.
                const cosY = Math.cos(-bracket.rotation.y);
                const sinY = Math.sin(-bracket.rotation.y);
                const localTan = new THREE.Vector3(
                    tan.x * cosY + tan.z * sinY,
                    tan.y,
                    -tan.x * sinY + tan.z * cosY
                ).normalize();
                const sleeve = new THREE.Mesh(brSleeveGeo, matJoint);
                sleeve.quaternion.setFromUnitVectors(Y_AXIS, localTan);
                sleeve.castShadow = true;
                bracket.add(sleeve);

                // Two side plates (clevis ears) on either side of the
                // sleeve along the pivot axis (local Z), hanging down
                // onto the stand top. They stay put — the sleeve tilts.
                for (const side of [-1, 1]) {
                    const plate = new THREE.Mesh(brPlateGeo, matJoint);
                    plate.position.set(0, -BR_PLATE_HEIGHT / 2,
                        side * BR_PLATE_OFFSET);
                    plate.castShadow = true;
                    bracket.add(plate);
                }

                // Pivot bolt through the plates (local Z, horizontal).
                const bolt = new THREE.Mesh(brBoltGeo, matJoint);
                bolt.rotation.x = Math.PI / 2;
                bolt.castShadow = true;
                bracket.add(bolt);

                // Hex heads at both ends of the bolt.
                for (const end of [-1, 1]) {
                    const head = new THREE.Mesh(brHeadGeo, matJoint);
                    head.rotation.x = Math.PI / 2;
                    head.position.z = end * (BR_BOLT_LEN / 2);
                    head.castShadow = true;
                    bracket.add(head);
                }

                // Locking bolt on one plate (secures the tilt angle).
                const lock = new THREE.Mesh(brLockGeo, matJoint);
                lock.rotation.x = Math.PI / 2;
                lock.position.set(0, -BR_PLATE_HEIGHT * 0.3,
                    BR_PLATE_OFFSET + BR_PLATE_THICK / 2 + BR_LOCK_LEN / 2);
                lock.castShadow = true;
                bracket.add(lock);

                const lockHead = new THREE.Mesh(brLockHeadGeo, matJoint);
                lockHead.rotation.x = Math.PI / 2;
                lockHead.position.set(0, -BR_PLATE_HEIGHT * 0.3,
                    BR_PLATE_OFFSET + BR_PLATE_THICK / 2 + BR_LOCK_LEN);
                lockHead.castShadow = true;
                bracket.add(lockHead);

                root.add(bracket);
                joints.push(bracket);
            }
        }

        release(railR); release(railL); railR = railL = null;
        const rCurv = new THREE.CatmullRomCurve3(ptsR);
        const lCurv = new THREE.CatmullRomCurve3(ptsL);
        rCurv.arcLengthDivisions = lCurv.arcLengthDivisions = Math.max(200, FABRIC_RES_X);
        railR = new THREE.Mesh(new THREE.TubeGeometry(rCurv, FABRIC_RES_X, RAIL_RADIUS, 12, false), matRail);
        railL = new THREE.Mesh(new THREE.TubeGeometry(lCurv, FABRIC_RES_X, RAIL_RADIUS, 12, false), matRail);
        railR.castShadow = railL.castShadow = true;
        root.add(railR, railL);

        release(fabricR); release(fabricL); fabricR = fabricL = null;
        if (state.fabric) {
            fabricR = new THREE.Mesh(generateFabricGeometry(ptsR, true), matFabric);
            fabricL = new THREE.Mesh(generateFabricGeometry(ptsL, false), matFabric);
            fabricR.castShadow = fabricL.castShadow = true;
            root.add(fabricR, fabricL);
        }

        anchorsStale = true;
        model.dirty = false;
    }

    // Anchors are where ELEMENTS (curtain, flowers, balloons) may attach.
    // kind: 'rail'  - along the serpentine rail, with tangent + outward normal
    //       'pole'  - top of each pole
    //       'base'  - floor plate of each base
    function getAnchors() {
        if (!anchorsStale) return anchors;
        anchors = [];

        for (const side of [false, true]) {
            const pts = getStructuralPoints(state, side, ANCHOR_RAIL_SAMPLES);
            const tag = side ? 'R' : 'L';
            for (let i = 0; i < pts.length; i++) {
                const prv = pts[Math.max(i - 1, 0)];
                const nxt = pts[Math.min(i + 1, pts.length - 1)];
                const tangent = nxt.clone().sub(prv).normalize();
                const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
                if (!side) normal.negate();
                anchors.push({
                    id: `rail-${tag}-${i}`,
                    kind: 'rail',
                    side: tag,
                    position: pts[i].clone(),
                    tangent,
                    normal
                });
            }

            // Floor uplights: one per section of the wall (ten per side),
            // spaced evenly ALONG THE WALL ITSELF - the rail polyline's own
            // parameter - so the hooks stay spread from gap to far end even
            // when Swing Pan turns the wall nearly edge-on, where even-x
            // spacing would pile every hook at the same spot. Each hook
            // stands off on the guest-facing side along the WALL'S OWN
            // facing - the chord from gap to far end, the same way the old
            // -Z rule read the unswung wall - not pure -Z (which slips
            // behind a swung curtain past ~67 degrees or parks the hook
            // when the wall swings the other way) and not the local pleat
            // normal either (the serpentine backwaves it, which would
            // bunch neighbouring hooks). The standoff keeps its 1.35 ft,
            // then steps further out along the same line until the hook
            // clears every stand plate on its own wall - plates are 1.6 ft
            // square, so distance to the plate centre is the honest guard
            // at any swing.
            const chord = pts[pts.length - 1].clone().sub(pts[0]).setY(0);
            if (chord.lengthSq() < 1e-12) chord.set(1, 0, 0);
            chord.normalize();
            const back = new THREE.Vector3(-chord.z, 0, chord.x);
            if (!side) back.negate();
            const front = back.clone().negate();
            const atT = u => {
                const f = Math.max(0, Math.min(1, u)) * (pts.length - 1);
                const j = Math.min(pts.length - 2, Math.floor(f));
                const v = f - j;
                const a = pts[j], b = pts[j + 1];
                return {
                    p: a.clone().lerp(b, v),
                    t: b.clone().sub(a).setY(0).normalize()
                };
            };
            // Strip lines: one mount per wall at the top rail and one at
            // the hem, both mid-wall on the curtain's own curve. An RGB
            // strip clamped here draws along the exact serpentine of the
            // fabric - top tube on the rail itself, hem tube at the foot.
            const mid = atT(0.5);
            anchors.push({
                id: `stripline-${tag}-T`,
                kind: 'stripline',
                mount: 'top',
                side: tag,
                position: mid.p.clone(),
                tangent: mid.t.clone(),
                normal: front.clone()
            });
            anchors.push({
                id: `stripline-${tag}-B`,
                kind: 'stripline',
                mount: 'hem',
                side: tag,
                position: new THREE.Vector3(mid.p.x, STRIP_HEM_Y, mid.p.z),
                tangent: mid.t.clone(),
                normal: front.clone()
            });
            const plates = side ? basesR : basesL;
            for (let k = 0; k < UPLIGHT_PER_SIDE; k++) {
                const { p, t: tangent } = atT((k + 0.5) / UPLIGHT_PER_SIDE);
                const pos = new THREE.Vector3(
                    p.x + front.x * UPLIGHT_STANDOFF, 0,
                    p.z + front.z * UPLIGHT_STANDOFF);
                for (let step = 0; step < 6; step++) {
                    let clear = true;
                    for (const b of plates) {
                        const dx = pos.x - b.position.x;
                        const dz = pos.z - b.position.z;
                        if (dx * dx + dz * dz < UPLIGHT_MIN_Z * UPLIGHT_MIN_Z) {
                            clear = false;
                            break;
                        }
                    }
                    if (clear) break;
                    pos.addScaledVector(front, 0.4);
                }
                anchors.push({
                    id: `uplight-${tag}-${k}`,
                    kind: 'uplight',
                    side: tag,
                    position: pos,
                    tangent,
                    normal: front.clone()
                });
            }
        }

        for (const [tag, pArr, bArr] of [['L', polesL, basesL], ['R', polesR, basesR]]) {
            for (let i = 0; i < pArr.length; i++) {
                const stand = pArr[i];
                anchors.push({
                    id: `pole-${tag}-${i}`,
                    kind: 'pole',
                    side: tag,
                    position: new THREE.Vector3(
                        stand.group.position.x, stand.height, stand.group.position.z),
                    tangent: new THREE.Vector3(0, 1, 0),
                    normal: new THREE.Vector3(1, 0, 0)
                });
                anchors.push({
                    id: `base-${tag}-${i}`,
                    kind: 'base',
                    side: tag,
                    position: bArr[i].position.clone(),
                    tangent: new THREE.Vector3(1, 0, 0),
                    normal: new THREE.Vector3(0, 1, 0)
                });
            }
        }

        anchorsStale = false;
        return anchors;
    }

    function setTheme(isDark) {
        const t = isDark ? MODEL_THEME.dark : MODEL_THEME.light;
        matFabric.color.setHex(t.fabric);
        matFabric.envMapIntensity = t.fabricEnv;
        matRail.envMapIntensity = t.metalEnv;
        matPole.envMapIntensity = t.metalEnv;
        matBase.envMapIntensity = t.metalEnv;
        matJoint.envMapIntensity = t.metalEnv;
    }

    // The chosen fabric palette. setTheme resets the fabric to its own white
    // or grey, so the composition root applies the colorway after the theme.
    function setColorway(hex) {
        if (!Number.isFinite(hex)) return;
        matFabric.color.setHex(hex);
    }

    function dispose() {
        release(railL); release(railR); release(fabricL); release(fabricR);
        railL = railR = fabricL = fabricR = null;
        root.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
        root.clear();
        sleeveGeo = innerGeo = null;
        tubeKey = '';
        [matRail, matPole, matBase, matFabric, matJoint].forEach(m => m.dispose());
        anchors = [];
        anchorsStale = true;
    }

    const model = {
        id: MODEL_ID,
        name: MODEL_NAME,
        subtitle: MODEL_SUBTITLE,
        object3D: root,
        params: PARAMS,
        state,
        dirty: true,
        build,
        getAnchors,
        setTheme,
        setColorway,
        setParams(partial) {
            if (Array.isArray(partial.lobeGaps)) {
                const gaps = Array.from({ length: LOBES_MAX },
                    (_, i) => {
                        const v = Number(partial.lobeGaps[i]);
                        return Number.isFinite(v)
                            ? Math.max(LOBE_GAP_MIN,
                                Math.min(LOBE_GAP_MAX, v))
                            : state.lobeGaps[i];
                    });
                state.lobeGaps = gaps;
                const { lobeGaps: _drop, ...rest } = partial;
                Object.assign(state, rest);
            } else {
                Object.assign(state, partial);
            }
            model.dirty = true;
        },
        dispose
    };

    build();
    return model;
}

// ---- js/objects/pillar.js ----
// O1 in the inventory printed on every board: the fixed classical column the
// curtain frames are staged against. Stands on the model ground at y = 0 like
// everything else, so a set can drop it straight into a layout slot.
const PILLAR_ID = 'pillar';
const PILLAR_NAME = 'Classical Pillar';
const PILLAR_SUBTITLE = 'Set component';

const PILLAR_PARAMS = {
    height:   { label: 'Height',   type: 'range', min: 4, max: 16, step: 0.5, value: 9, unit: ' ft' },
    diameter: { label: 'Diameter', type: 'range', min: 0.8, max: 3, step: 0.1, value: 1.4, unit: ' ft' },
    capital:  { label: 'Capital',  type: 'toggle', value: true },
    plinth:   { label: 'Plinth Base', type: 'toggle', value: true },
    flutes:   { label: 'Fluted Shaft', type: 'toggle', value: true, advanced: true }
};

// The pillar has no preset file of its own - a set asks for it by name, so
// its definition travels with the model instead of with models/.
const PILLAR_DEF = {
    id: PILLAR_ID,
    name: PILLAR_NAME,
    objects: [{ type: PILLAR_ID, params: {}, elements: [] }]
};

const PILLAR_THEME = {
    light: { stone: 0xf3f0ea, env: 0.35 },
    dark:  { stone: 0xd6d2c8, env: 0.18 }
};

function createPillarModel(initial = {}) {
    const root = new THREE.Group();
    root.name = PILLAR_ID;

    const state = {};
    for (const k of Object.keys(PILLAR_PARAMS)) state[k] = PILLAR_PARAMS[k].value;
    Object.assign(state, initial);

    const stone = new THREE.MeshStandardMaterial({
        color: PILLAR_THEME.light.stone, roughness: 0.65, metalness: 0
    });

    function build() {
        root.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
        root.clear();

        const d = state.diameter;
        const h = state.height;
        stone.flatShading = !!state.flutes;
        stone.needsUpdate = true;

        let y = 0;
        if (state.plinth) {
            const ph = Math.min(0.6, h * 0.07);
            const plinth = new THREE.Mesh(new THREE.BoxGeometry(d * 1.5, ph, d * 1.5), stone);
            plinth.position.y = ph / 2;
            root.add(plinth);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(d * 0.5, d * 0.1, 8, 24), stone);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = ph + d * 0.04;
            root.add(ring);
            y = ph + d * 0.08;
        }

        const capH = state.capital ? Math.min(0.9, h * 0.1) : 0;
        const shaftH = Math.max(1, h - y - capH);
        const shaft = new THREE.Mesh(
            new THREE.CylinderGeometry(d / 2, d / 2 * 1.08, shaftH, state.flutes ? 20 : 32, 1),
            stone);
        shaft.position.y = y + shaftH / 2;
        root.add(shaft);

        if (state.capital) {
            const neck = new THREE.Mesh(new THREE.TorusGeometry(d * 0.52, d * 0.07, 8, 24), stone);
            neck.rotation.x = Math.PI / 2;
            neck.position.y = y + shaftH + d * 0.04;
            root.add(neck);
            const cap = new THREE.Mesh(
                new THREE.BoxGeometry(d * 1.4, capH * 0.55, d * 1.4), stone);
            cap.position.y = y + shaftH + capH * 0.28;
            root.add(cap);
            const abacus = new THREE.Mesh(
                new THREE.BoxGeometry(d * 1.55, capH * 0.25, d * 1.55), stone);
            abacus.position.y = y + shaftH + capH * 0.68;
            root.add(abacus);
        }

        for (const m of root.children) {
            if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; }
        }
        model.dirty = false;
    }

    function setTheme(isDark) {
        const t = isDark ? PILLAR_THEME.dark : PILLAR_THEME.light;
        stone.color.setHex(t.stone);
        stone.envMapIntensity = t.env;
    }

    function dispose() {
        root.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
        root.clear();
        stone.dispose();
    }

    const model = {
        id: PILLAR_ID,
        name: PILLAR_NAME,
        subtitle: PILLAR_SUBTITLE,
        object3D: root,
        params: PILLAR_PARAMS,
        state,
        dirty: true,
        build,
        setTheme,
        setParams(partial) { Object.assign(state, partial); model.dirty = true; },
        dispose
    };

    build();
    return model;
}

// ---- js/elements/light.js ----
// The lighting element family: ONE universal fixture model with a type
// adaptor per event light - a PAR can (focused beam), an LED wash panel
// and a linear strip. Registered as three types (light-par, light-led,
// light-strip) so the panel renders each from its own schema, and mounted
// on ANY model's anchors through the def's `elements` list - the anchor
// contract (getAnchors) is what makes this system model-agnostic.
const LIGHT_TYPES = ['light-par', 'light-led', 'light-strip'];
const LIGHT_NAMES = {
    'light-par': 'PAR Light',
    'light-led': 'LED Wash',
    'light-strip': 'Strip Light'
};

// Params stay range/toggle so registry validation, the panel and the
// project clamps all keep their current contract. Hue + Saturation are the
// fixture's RGBW colour mixing as two sliders: Saturation 0 is plain white,
// low saturation with Hue ~40 is warm white, high saturation is amber/gold
// (hue 40) or deep purple (hue 280) - the palettes an entrance actually
// asks for. Defaults are the wedding look: warm white.
const LIGHT_PARAMS = {
    par: {
        power: { label: 'Power',  type: 'range', min: 0,    max: 100, step: 1,   value: 100, unit: '%' },
        pan:   { label: 'Pan',    type: 'range', min: -180, max: 180, step: 1,   value: 0,   unit: '°' },
        tilt:  { label: 'Tilt',   type: 'range', min: -90,  max: 90,  step: 1,   value: 45,  unit: '°' },
        focus: { label: 'Focus',  type: 'range', min: 10,   max: 60,  step: 1,   value: 30,  unit: '°' },
        hue:   { label: 'Hue',    type: 'range', min: 0,    max: 360, step: 1,   value: 40,  unit: '°' },
        sat:   { label: 'Saturation', type: 'range', min: 0, max: 100, step: 1,  value: 35,  unit: '%' }
    },
    led: {
        power: { label: 'Power',  type: 'range', min: 0,    max: 100, step: 1,   value: 100, unit: '%' },
        pan:   { label: 'Pan',    type: 'range', min: -180, max: 180, step: 1,   value: 0,   unit: '°' },
        tilt:  { label: 'Tilt',   type: 'range', min: -90,  max: 90,  step: 1,   value: 55,  unit: '°' },
        wash:  { label: 'Spread', type: 'range', min: 20,   max: 120, step: 1,   value: 70,  unit: '°' },
        hue:   { label: 'Hue',    type: 'range', min: 0,    max: 360, step: 1,   value: 40,  unit: '°' },
        sat:   { label: 'Saturation', type: 'range', min: 0, max: 100, step: 1,  value: 35,  unit: '%' }
    },
    strip: {
        power:  { label: 'Power',  type: 'range', min: 0,  max: 100, step: 1,   value: 100, unit: '%' },
        length: { label: 'Length', type: 'range', min: 1,  max: 12,  step: 0.5, value: 6,   unit: ' ft' },
        hue:    { label: 'Hue',    type: 'range', min: 0, max: 360, step: 1,   value: 40,  unit: '°' },
        sat:    { label: 'Saturation', type: 'range', min: 0, max: 100, step: 1, value: 35, unit: '%' }
    }
};

const LIGHT_THEME = {
    light: { env: 0.5, glow: 1.0 },
    dark:  { env: 0.2, glow: 1.8 }
};
const LIGHT_DEG = Math.PI / 180;
// One real spotlight per PAR/LED fixture, never more, never shadowed:
// the scene's own rig owns shadows and the bounded count keeps a stage
// full of fixtures harmless. The strip is emissive only.
const SPOT_BASE = { par: 2.2, led: 1.4 };

// ---- the neon-flex strip assembly --------------------------------------
// One S-curve route in, three pieces out - an aluminium U-channel, the
// rounded neon flex seated inside it, and an optional soft halo. Every
// piece is swept from the SAME resampled path with an EXPLICIT upright
// frame (world-up transported into each binormal), never a Frenet frame:
// the channel always opens skyward, the cross-section never twists or
// pinches, and the neon sits a fixed height above the channel rim, so
// gaps, buried sections and drifting halves are impossible by
// construction. All dimensions in feet.
const STRIP_PROFILE = {
    channel: { w: 0.15, h: 0.045, t: 0.016 },  // low-profile U-channel
    neon: { w: 0.1, h: 0.066, r: 0.028 },       // rounded neon flex
    glow: { r: 0.072 }                          // halo, just past the corners
};

// The channel's closed outline in the (side, up) plane: floor, two walls,
// two lips folded inward - an extruded mounting profile, not a hose.
function channelOutline() {
    const { w, h, t } = STRIP_PROFILE.channel;
    const w2 = w / 2;
    return [
        [-w2, 0], [w2, 0], [w2, h], [w2 - t, h],
        [w2 - t, t], [-(w2 - t), t], [-(w2 - t), h], [-w2, h]
    ];
}

// The neon flex: a rounded rectangle seated on the channel floor - flat
// bottom, generous corner radius, its top rising clear above the rim.
function neonOutline() {
    const { w, h, r } = STRIP_PROFILE.neon;
    const t0 = STRIP_PROFILE.channel.t;
    const w2 = w / 2;
    const u0 = t0, u1 = t0 + h;
    const seg = 6;
    const pts = [];
    const arc = (cx, cy, a0, a1) => {
        for (let i = 0; i <= seg; i++) {
            const a = a0 + (a1 - a0) * (i / seg);
            pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
        }
    };
    // Counter-clockwise: bottom-left arc, bottom-right, top-right,
    // top-left. The straight edges fall out as the chords between
    // consecutive arcs - bottom, right, top, left.
    arc(-(w2 - r), u0 + r, Math.PI, Math.PI * 1.5);
    arc(w2 - r, u0 + r, Math.PI * 1.5, Math.PI * 2);
    arc(w2 - r, u1 - r, 0, Math.PI / 2);
    arc(-(w2 - r), u1 - r, Math.PI / 2, Math.PI);
    return pts;
}

// Resample the route and carry world-up through every binormal: T along
// the path, U as upright as the slope allows, S = T x U across. Returns
// the evenly spaced samples and their frames.
function stripFrames(pathPts) {
    const pts = pathPts.map(p => new THREE.Vector3(p.x, p.y, p.z));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
    const N = Math.min(360, Math.max(144, pts.length * 16));
    const samples = curve.getSpacedPoints(N);
    const frames = [];
    for (let i = 0; i < samples.length; i++) {
        const prev = samples[Math.max(0, i - 1)];
        const next = samples[Math.min(samples.length - 1, i + 1)];
        const T = next.clone().sub(prev);
        if (T.lengthSq() < 1e-12) T.set(1, 0, 0);
        T.normalize();
        // Up projected off the tangent - never flips while the path stays
        // short of vertical.
        const U = new THREE.Vector3(0, 1, 0)
            .addScaledVector(T, -T.y);
        if (U.lengthSq() < 1e-12) U.set(0, 0, 1);
        U.normalize();
        const S = new THREE.Vector3().crossVectors(T, U).normalize();
        frames.push({ p: samples[i], T, S, U });
    }
    return { samples, frames };
}

// Sweep a closed 2D outline along the frames. `flat` shades each quad
// with its own face normal (crisp extruded metal); smooth mode carries
// the outline's own 2D outward normals (rounded flex). Caps close both
// ends so there are no abrupt open tips.
function sweepOutline(outline, frames, opts = {}) {
    const flat = opts.flat === true;
    const caps = opts.caps !== false;
    const m = outline.length;
    // Outward normals per outline vertex (CCW polygon: edge normal =
    // (dy, -dx)); duplicated corners would sharpen - none needed here.
    const onrm = outline.map((p, k) => {
        const q = outline[(k + 1) % m];
        const dx = q[0] - p[0], dy = q[1] - p[1];
        const r = Math.hypot(dx, dy) || 1;
        return [dy / r, -dx / r];
    });
    const verts = [];
    const nrms = [];
    const push = (v, n) => {
        verts.push(v.x, v.y, v.z);
        nrms.push(n.x, n.y, n.z);
    };
    const at = (f, o) => new THREE.Vector3()
        .copy(f.p)
        .addScaledVector(f.S, o[0])
        .addScaledVector(f.U, o[1]);
    for (let i = 0; i < frames.length - 1; i++) {
        const fa = frames[i], fb = frames[i + 1];
        for (let k = 0; k < m; k++) {
            const k2 = (k + 1) % m;
            const a = at(fa, outline[k]);
            const b = at(fa, outline[k2]);
            const c = at(fb, outline[k2]);
            const d = at(fb, outline[k]);
            if (flat) {
                const n = new THREE.Vector3().crossVectors(
