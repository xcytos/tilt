<!doctype html>
<meta charset="utf-8">
<title>TILT room captures</title>
<style>
    body { background: #111; color: #ddd; font: 14px/1.55 monospace; padding: 16px; }
    canvas { display: none; }
    .ok  { color: #8c6; }
    .err { color: #e77; }
    h1   { font-size: 16px; }
</style>
<h1>TILT room captures</h1>
<div id="log">rendering…</div>
<canvas id="c" width="1280" height="720"></canvas>
<script type="importmap">
{ "imports": { "three": "/tests/vendor/three160.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { SceneRig, DEFAULT_STAGE_SIZE } from '/js/scenes.js';

const log = document.getElementById('log');
const say = (m, cls) => {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = m;
    log.appendChild(d);
};

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, preserveDrawingBuffer: true
});
renderer.setSize(1280, 720, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const SCENES = ['white-stage', 'ballroom', 'garden-night', 'terrace'];

// The exact light rig the viewer uses for rooms, so what lands on disk
// is what the user sees - same key, same shadow box, same tone curve.
function buildRoom(id) {
    const scene = new THREE.Scene();
    const rig = new SceneRig();
    scene.add(rig.group);
    const s = rig.build(id, Object.assign({}, DEFAULT_STAGE_SIZE));
    if (s) {
        scene.background = s.background;
        scene.fog = s.fog ? new THREE.Fog(s.fog.color, s.fog.near, s.fog.far) : null;
    }
    const amb = new THREE.AmbientLight(
        s ? s.ambient.color : 0xffffff, s ? s.ambient.intensity : 0.8);
    scene.add(amb);
    const key = new THREE.DirectionalLight(
        s ? s.key.color : 0xffffff, s ? s.key.intensity : 1.5);
    key.position.set(15, 25, -20);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -56;
    key.shadow.camera.right = 56;
    key.shadow.camera.top = 56;
    key.shadow.camera.bottom = -56;
    key.shadow.camera.near = 2;
    key.shadow.camera.far = 160;
    key.shadow.normalBias = 0.06;
    key.shadow.bias = -0.0004;
    scene.add(key);
    const fill = new THREE.DirectionalLight(
        s ? s.fill.color : 0xffffff, s ? s.fill.intensity : 0.5);
    fill.position.set(-15, 10, 20);
    scene.add(fill);
    return scene;
}

function views(size) {
    return [
        // From the house, elevated: whole room, stage centered.
        { name: 'house', pos: [0, 15, -(size.d / 2 + 30)], look: [0, 4, 0] },
        // From the stage, looking out over the guests.
        { name: 'stage', pos: [0, 5.5, 6], look: [0, 2.5, -(size.d / 2 + 22)] },
        // Down the central aisle toward the stage.
        { name: 'aisle', pos: [0, 5, -(size.d / 2 + 20)], look: [0, 3, 2] },
        // Side wall close-up: sconces, pilasters, texture, shadows.
        { name: 'wall', pos: [size.wallX - 7, 9, -size.d / 2 - 4],
          look: [-size.wallX * 0.4, 4, -size.d / 2 - 8] }
    ];
}

async function put(name, blob) {
    const res = await fetch('/__captures/' + name, {
        method: 'PUT', body: blob
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
}

const size = Object.assign({}, DEFAULT_STAGE_SIZE);
const cam = new THREE.PerspectiveCamera(50, 1280 / 720, 0.1, 500);

for (const id of SCENES) {
    const scene = buildRoom(id);
    for (const v of views(size)) {
        cam.position.set(v.pos[0], v.pos[1], v.pos[2]);
        cam.lookAt(v.look[0], v.look[1], v.look[2]);
        renderer.render(scene, cam);
        const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
        const name = id + '-' + v.name + '.png';
        try {
            await put(name, blob);
            say('ok   ' + name + '  (' + blob.size + ' B)', 'ok');
        } catch (e) {
            say('FAIL ' + name + ': ' + e.message, 'err');
        }
        await new Promise((r) => setTimeout(r, 40));
    }
}
say('done - PNGs are in tests/.tmp/captures/', 'ok');
</script>
